<title>Calendario Payless</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: barra de marca + barra de filtros fija arriba; el mes ocupa el lienzo; la publicación se abre en una hoja con el teléfono a la izquierda y la ficha a la derecha. */
:root{
  --bg:#f6f4f1; --surface:#ffffff; --sunk:#efebe6; --line:#e2dcd4; --line-strong:#cfc6bb;
  --ink:#1e1a16; --ink-2:#5a5148; --ink-3:#8b8177;
  --accent:#ea5b0c; --accent-ink:#ffffff; --accent-soft:#fde6d8;
  --r-centro:#0f8b8d; --r-sur:#4a56c9; --r-rd:#c2366b; --r-caribe:#6d8f12;
  --ok:#1d8a4e; --ok-soft:#dcf2e5; --warn:#b7791f; --warn-soft:#fbefd6; --bad:#c43c2f; --bad-soft:#fbe1dd; --info:#3a6ccf; --info-soft:#e1e9fa;
  --pub-bg:#c9efd6; --pub-line:#5fbf86; --pub-ink:#14593a; --pend-bg:#ffdcc2; --pend-line:#f08a3e; --pend-ink:#8a3a07; --pend:#e8700f; --pro:#7a4fd0;
  --phone:#000; --phone-ink:#f5f5f5; --ig-bg:#ffffff; --ig-ink:#111; --ig-mute:#737373; --ig-line:#efefef;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --radius:10px; --shadow:0 1px 2px rgba(30,26,22,.06),0 8px 24px rgba(30,26,22,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161311; --surface:#201c19; --sunk:#2a2522; --line:#352f2b; --line-strong:#4a423c;
  --ink:#f3ede7; --ink-2:#c3b8ad; --ink-3:#8f857b;
  --accent:#ff7a33; --accent-ink:#1a0f08; --accent-soft:#4a2614;
  --r-centro:#35b9bb; --r-sur:#8b95ff; --r-rd:#ff6fa3; --r-caribe:#a6c94a;
  --ok:#4cc884; --ok-soft:#173826; --warn:#e5b04f; --warn-soft:#3b2d12; --bad:#ff7b6d; --bad-soft:#40201c; --info:#86a8ff; --info-soft:#1d2a47;
  --ig-bg:#000; --ig-ink:#f5f5f5; --ig-mute:#a8a8a8; --ig-line:#262626;
  --pub-bg:#16402a; --pub-line:#2f8a57; --pub-ink:#9be3b9; --pend-bg:#4a2612; --pend-line:#c4621f; --pend-ink:#ffc49a; --pend:#ff8f3d; --pro:#a98bff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161311; --surface:#201c19; --sunk:#2a2522; --line:#352f2b; --line-strong:#4a423c;
  --ink:#f3ede7; --ink-2:#c3b8ad; --ink-3:#8f857b;
  --accent:#ff7a33; --accent-ink:#1a0f08; --accent-soft:#4a2614;
  --r-centro:#35b9bb; --r-sur:#8b95ff; --r-rd:#ff6fa3; --r-caribe:#a6c94a;
  --ok:#4cc884; --ok-soft:#173826; --warn:#e5b04f; --warn-soft:#3b2d12; --bad:#ff7b6d; --bad-soft:#40201c; --info:#86a8ff; --info-soft:#1d2a47;
  --ig-bg:#000; --ig-ink:#f5f5f5; --ig-mute:#a8a8a8; --ig-line:#262626;
  --pub-bg:#16402a; --pub-line:#2f8a57; --pub-ink:#9be3b9; --pend-bg:#4a2612; --pend-line:#c4621f; --pend-ink:#ffc49a; --pend:#ff8f3d; --pro:#a98bff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{padding-inline:max(16px,2vw)}

/* ---------- top bar */
.top{position:relative;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font:800 22px/1 var(--f-display);letter-spacing:-.02em}
.brand b i{font-style:normal;color:var(--accent)}
.brand span{color:var(--ink-3);font-size:13px}
.month{display:flex;align-items:center;gap:6px;margin-left:auto}
.month h1{font:700 20px/1 var(--f-display);margin:0;min-width:150px;text-align:center;text-transform:capitalize;letter-spacing:-.01em}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{border-color:var(--line-strong);color:var(--ink)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.role-inside{background:var(--accent-soft);color:var(--accent)}
.pill.role-cliente{background:var(--info-soft);color:var(--info)}
.pill.role-lectura,.pill.role-offline{background:var(--sunk);color:var(--ink-2)}
.sync{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.sync.on{background:var(--ok)}

/* ---------- filter bar */
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:0 12px}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 11px;font-weight:600;font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button .dot{width:8px;height:8px;border-radius:50%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.flabel{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.fgroup{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
select.sel,input.search{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;min-width:0}
input.search{width:200px;max-width:100%}
.views{margin-left:auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--line-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--surface);border-color:var(--bad);color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.summary{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);padding-block:0 10px}
.summary b{color:var(--ink);font-variant-numeric:tabular-nums}
.summary .warn b{color:var(--bad)}
.banner{margin:10px 0 0;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--ink);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- main area */
main{padding-block:16px 40px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}
.layout.nobacklog{grid-template-columns:minmax(0,1fr)}

/* calendar grid */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.cal-head,.cal-body{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-head div{padding:8px 10px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--line)}
.day{min-height:132px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0;position:relative}
.day:nth-child(7n){border-right:0}
.day.out{background:var(--sunk)}
.day.out .dnum{color:var(--ink-3)}
.day.today .dnum{background:var(--accent);color:var(--accent-ink)}
.day.drop{outline:2px dashed var(--accent);outline-offset:-3px;background:var(--accent-soft)}
.dhead{display:flex;align-items:center;justify-content:space-between}
.dnum{font:600 12px/1 var(--f-mono);padding:4px 6px;border-radius:6px;color:var(--ink-2)}
.dadd{opacity:0;border:0;background:transparent;color:var(--ink-3);font-size:16px;line-height:1;padding:0 4px}
.day:hover .dadd{opacity:1}
.dpaste{border:1px dashed var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:5px;font:700 10px/1 var(--f-body);padding:3px 6px;margin-left:auto;margin-right:2px}
.dpaste:hover{background:var(--accent);color:var(--accent-ink)}
.clipbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--radius);padding:8px 12px;margin-bottom:12px;font-size:13px}
.clipbar b{font-weight:700}
.clipbar .sp{flex:1}
.clipbar input{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:4px 6px;font:inherit}
.pc.clip{outline:2px dashed var(--accent);outline-offset:1px}
.pc.sel{box-shadow:0 0 0 2px var(--ink);border-color:var(--ink)}
.day.sel{background:color-mix(in srgb,var(--accent) 8%,var(--surface));box-shadow:inset 0 0 0 2px var(--accent)}
.selhint{font-size:12px;color:var(--ink-3);margin:-4px 0 10px}
.selhint kbd{font:600 11px var(--f-mono);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface);color:var(--ink-2)}
.more{border:0;background:transparent;color:var(--ink-2);font-size:12px;font-weight:600;text-align:left;padding:2px 4px}
.more:hover{color:var(--accent)}

/* post chip */
.pc{display:grid;grid-template-columns:28px minmax(0,1fr);gap:6px;align-items:center;border:1px solid var(--line);border-left:3px solid var(--rc,var(--ink-3));background:var(--surface);border-radius:6px;padding:3px 5px 3px 4px;text-align:left;width:100%;min-width:0;cursor:pointer}
.pc:hover{border-color:var(--line-strong);border-left-color:var(--rc)}
.pc[draggable="true"]{cursor:grab}
.pc.dragging{opacity:.4}
.pc .th{width:28px;height:28px;border-radius:4px;background:var(--sunk) center/cover no-repeat;display:grid;place-items:center;font-size:12px;color:var(--ink-3);overflow:hidden}
.pc .th.story{border-radius:50%;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--accent)}
.pc .t1{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden}
.pc .t2{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sd{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ink-3)}
.st-sin{--s:var(--ink-3)} .st-des{--s:var(--ink-2)} .st-env{--s:var(--pend)} .st-apr{--s:var(--info)} .st-cam{--s:var(--bad)} .st-pro{--s:var(--ok)} .st-pub{--s:var(--ok)}
/* fondo por estado: verde = publicado, naranja = esperando al cliente, blanco = en desarrollo Inside */
.pc.cs-pub{background:var(--pub-bg);border-color:var(--pub-line)} .pc.cs-pub .t1{color:var(--pub-ink)}
.pc.cs-env{background:var(--pend-bg);border-color:var(--pend-line)} .pc.cs-env .t1{color:var(--pend-ink)}
table.list tr.cs-pub td{background:var(--pub-bg)} table.list tr.cs-env td{background:var(--pend-bg)}
.legend .cs{width:14px;height:10px;border-radius:3px;border:1px solid var(--line-strong);background:var(--surface)}
.legend .cs.pub{background:var(--pub-bg);border-color:var(--pub-line)} .legend .cs.env{background:var(--pend-bg);border-color:var(--pend-line)}
.fmts{display:flex;flex-wrap:wrap;gap:6px}
.fmts .chip{font-size:13px;padding:5px 12px}
.fmts .chip .n{font:600 10px var(--f-mono);opacity:.7;margin-left:4px}
.sd{background:var(--s)}
.fmt{font-family:var(--f-mono);font-size:10px;letter-spacing:.02em}

/* backlog */
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 150px)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.panel h3{margin:0 0 4px;font:700 15px/1.2 var(--f-display)}
.panel p.sub{margin:0 0 10px;color:var(--ink-3);font-size:12px}
.backlog{display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow:auto;padding-right:2px}
.backlog.drop{outline:2px dashed var(--accent);outline-offset:2px}
.legend{display:grid;gap:6px;font-size:12px;color:var(--ink-2)}
.legend div{display:flex;align-items:center;gap:8px}
.legend .sw{width:12px;height:12px;border-radius:3px}

/* agenda / list */
.agenda{display:flex;flex-direction:column;gap:14px}
.aday h4{margin:0 0 6px;font:700 14px/1.2 var(--f-display);display:flex;gap:8px;align-items:baseline}
.aday h4 span{font:500 12px var(--f-body);color:var(--ink-3)}
.aday .items{display:grid;gap:6px}
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto}
table.list{border-collapse:collapse;width:100%;min-width:980px;font-size:13px}
table.list th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:9px 10px;border-bottom:1px solid var(--line)}
table.list td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.list tr{cursor:pointer}
table.list tr:hover td{background:var(--sunk)}
.qhora{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 6px;font:inherit;width:110px}
.rtag{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px}
.rtag i{width:8px;height:8px;border-radius:2px;background:var(--rc)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;background:color-mix(in srgb,var(--s) 14%,transparent);color:var(--s);white-space:nowrap}
.badge .sd{background:var(--s)}

/* grid (IG profile) view */
.gridview{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:24px;align-items:start}
.gridnote{color:var(--ink-2);font-size:13px;max-width:52ch}
.gridnote h2{font:800 26px/1.1 var(--f-display);letter-spacing:-.02em;margin:0 0 8px;color:var(--ink)}

/* ---------- phone + Instagram */
.phone{background:var(--phone);border-radius:42px;padding:12px;box-shadow:var(--shadow);width:100%;max-width:390px;margin-inline:auto}
.screen{background:var(--ig-bg);color:var(--ig-ink);border-radius:32px;overflow:hidden;position:relative;font-family:-apple-system,"Helvetica Neue","Segoe UI",Roboto,sans-serif;font-size:13.5px}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:10px 22px 4px;font-weight:600;font-size:13px}
.igtop{display:flex;align-items:center;justify-content:space-between;padding:6px 14px 8px;border-bottom:1px solid var(--ig-line)}
.igtop b{font:700 19px/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.01em}
.ighead{display:flex;align-items:center;gap:10px;padding:10px 12px}
.av{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font:800 15px/1 var(--f-display);flex:none}
.av.ring{box-shadow:0 0 0 2px var(--ig-bg),0 0 0 4px #e1306c}
.ighead .h{line-height:1.2;min-width:0}
.ighead .h b{font-size:13.5px}
.ighead .h small{display:block;color:var(--ig-mute);font-size:12px}
.ighead .dots{margin-left:auto;font-weight:700;letter-spacing:1px}
.media{position:relative;background:#111;overflow:hidden;touch-action:pan-y}
.media.r45{aspect-ratio:4/5}
.media.r916{aspect-ratio:9/16}
.track{display:flex;height:100%;transition:transform .3s ease}
.track img,.track .ph{flex:0 0 100%;width:100%;height:100%;object-fit:cover;display:block}
.cnt{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:3px 8px;border-radius:999px;font-weight:600}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:0;background:rgba(255,255,255,.85);color:#111;display:grid;place-items:center;font-weight:800}
.nav.prev{left:8px}.nav.next{right:8px}
.igdots{display:flex;justify-content:center;gap:4px;padding:8px 0 0;min-height:14px}
.igdots i{width:6px;height:6px;border-radius:50%;background:var(--ig-line)}
.igdots i.on{background:#0095f6}
.igact{display:flex;gap:14px;padding:8px 12px 4px;font-size:22px;line-height:1}
.igact .sp{margin-left:auto}
.igact svg{width:24px;height:24px;stroke:var(--ig-ink);fill:none;stroke-width:1.8}
.igcap{padding:2px 12px 14px;font-size:13.5px;line-height:1.4;white-space:pre-wrap;word-break:break-word}
.igcap .prov{display:block;margin-top:6px;color:var(--ig-mute);font-size:11.5px;font-style:italic}
.igcap .tm{display:block;margin-top:6px;color:var(--ig-mute);font-size:11px;text-transform:uppercase;letter-spacing:.02em}
.igmore{color:var(--ig-mute);border:0;background:none;padding:0}
.ph{display:flex!important;flex-direction:column;justify-content:flex-end;gap:8px;padding:22px;background:var(--accent);color:#fff;text-align:left}
.ph .k{font:600 11px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.ph .phl{font:800 clamp(22px,7vw,30px)/1.02 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.ph .pend{align-self:flex-start;background:rgba(0,0,0,.25);border-radius:999px;padding:3px 9px;font:600 11px var(--f-body)}
.ph .sig{margin-top:6px;font:700 13px var(--f-display);opacity:.9}
.ph.promo{background:#d73a14}
.ph.kids{background:#1b8f8a}
.ph.nl{background:#7d4b8f}
/* story */
.story .media{border-radius:0}
.stbars{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:3px;z-index:2}
.stbars i{flex:1;height:2.5px;border-radius:2px;background:rgba(255,255,255,.4)}
.stbars i.on{background:#fff}
.sthead{position:absolute;top:18px;left:10px;right:10px;display:flex;align-items:center;gap:8px;color:#fff;z-index:2;font-size:13px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.sthead .av{width:28px;height:28px;font-size:13px}
.sthead small{opacity:.8}
.stfoot{position:absolute;left:10px;right:10px;bottom:12px;display:flex;gap:10px;align-items:center;z-index:2}
.stfoot div{flex:1;border:1.5px solid rgba(255,255,255,.8);border-radius:999px;color:#fff;padding:9px 14px;font-size:13px}
.tapzone{position:absolute;top:0;bottom:0;width:40%;z-index:1;border:0;background:transparent}
.tapzone.l{left:0}.tapzone.r{right:0}
/* reel */
.reelui{position:absolute;inset:auto 0 0 0;padding:14px 56px 16px 12px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55));z-index:2;font-size:13px}
.reelui b{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.reelui .av{width:26px;height:26px;font-size:12px}
.reelui p{margin:0;max-height:3.9em;overflow:hidden;white-space:pre-wrap}
.reelside{position:absolute;right:10px;bottom:70px;display:flex;flex-direction:column;gap:18px;z-index:2;color:#fff;align-items:center;font-size:11px}
.reelside svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:1.8}
.reeltag{position:absolute;top:44px;left:12px;color:#fff;font:700 18px/1 var(--f-display);z-index:2;text-shadow:0 1px 3px rgba(0,0,0,.5)}

<script>
"use strict";
/* ============ constantes */
const REGIONES=[
  {id:"CENTRO",nombre:"Centroamérica",corto:"Centro",var:"--r-centro",paises:["GT","SV","HN","NI","CR"]},
  {id:"SUR",nombre:"Sur",corto:"Sur",var:"--r-sur",paises:["PA","CO","EC","PE"]},
  {id:"RD",nombre:"República Dominicana",corto:"RD",var:"--r-rd",paises:["RD"]},
  {id:"CARIBE",nombre:"Caribe inglés",corto:"Caribe",var:"--r-caribe",paises:["TT","JM","BB","ECI","GY","USVI"]}];
const PAIS={GT:"Guatemala",SV:"El Salvador",HN:"Honduras",NI:"Nicaragua",CR:"Costa Rica",PA:"Panamá",CO:"Colombia",EC:"Ecuador",PE:"Perú",RD:"República Dominicana",TT:"Trinidad y Tobago",JM:"Jamaica",BB:"Barbados",ECI:"Eastern Caribbean",GY:"Guyana",USVI:"Islas Vírgenes EE. UU."};
const EN_PAISES=new Set(["TT","JM","BB","ECI","GY","USVI"]);
const ESTADOS=[
  {id:"Sin iniciar",c:"st-sin"},{id:"En desarrollo",c:"st-des"},{id:"Enviado a cliente",c:"st-env"},
  {id:"Cambios solicitados",c:"st-cam"},{id:"Aprobado",c:"st-apr"},{id:"Programado",c:"st-pro"},{id:"Publicado",c:"st-pub"}];
const FORMATOS=["Estático","Carrusel","Reel","Historia","Portada"];
const TIPOS={feed:"Feed",historia:"Historia",promo:"Promo"};
const LINEAS=["Sneakers","Nuevas Llegadas","Kids","Halloween Kids","Comfort Plus","Aniversario TT","Promociones","Otra"];
const DOW=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const FIELDS_EDIT=["fecha","hora","estado","formato","formatos","tipo","campana","linea","serie","headline","copy","cta","idea","objetivo","tipoContenido","sku","mandatories","responsable","insumo","prioridad","link","slide","legal","estadoLegal","fase","vigencia"];

/* ============ estado */
const S={
  posts:new Map(), comments:[], profiles:{},
  mode:"loading",      // live | offline
  role:"lectura",      // inside | cliente | lectura
  viewAs:null,         // inside puede previsualizar como cliente
  me:null, myId:null,
  db:null, assets:null, user:null,
  month:null,
  f:{region:"ALL",paises:[],tipo:"ALL",linea:"ALL",estado:"ALL",q:"",view:"cal",gridPais:"GT",gridSize:"phone",onlyArt:false,desde:"2026-10-01",hasta:"2026-10-10"},
  openId:null, openTab:"info", pv:{slide:0}, dragId:null, clip:null, sel:null, selDay:null,
};
const store={get(k){try{return JSON.parse(localStorage.getItem("cpay:"+k))}catch(e){return null}},set(k,v){try{localStorage.setItem("cpay:"+k,JSON.stringify(v))}catch(e){}}};
const saved=store.get("f"); if(saved) Object.assign(S.f,saved,{q:""});

/* ============ utilidades */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const todayISO=iso(new Date());
const cap1=s=>s.charAt(0).toUpperCase()+s.slice(1);
const region=id=>REGIONES.find(r=>r.id===id)||REGIONES[0];
const estadoC=e=>(ESTADOS.find(x=>x.id===e)||ESTADOS[0]).c;
const colorC=e=>e==="Publicado"||e==="Programado"?"cs-pub":e==="Enviado a cliente"?"cs-env":"";
function horaMin(h){
  if(!h) return 24*60;
  const s=String(h).toLowerCase().replace(/\s+/g,"");
  const m=s.match(/(\d{1,2})(?::(\d{2}))?(am|pm|m)?/); if(!m) return 24*60;
  let H=+m[1],M=+(m[2]||0);
  if(m[3]==="pm"&&H<12) H+=12; if(m[3]==="am"&&H===12) H=0; if(m[3]==="m") H=12;
  return H*60+M;
}
function toHHMM(h){const m=horaMin(h);if(m>=24*60) return "";return pad(Math.floor(m/60))+":"+pad(m%60)}
function fromHHMM(v){if(!v) return "";let [H,M]=v.split(":").map(Number);const ap=H>=12?"pm":"am";const h12=H%12||12;return `${h12}:${pad(M)} ${ap}`}
function fmtDia(s,long){if(!s) return "Sin fecha"; const d=parseISO(s); const w=(d.getDay()+6)%7; return long?`${["lunes","martes","miércoles","jueves","viernes","sábado","domingo"][w]} ${d.getDate()} de ${MESES[d.getMonth()]}`:`${DOW[w]} ${d.getDate()} ${MESES[d.getMonth()].slice(0,3)}`}
function imgSrc(x){return x.startsWith("asset:")?"/_blob/"+x.slice(6):x}
function toast(msg){const r=$("#toastRoot");r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML="",2600)}
function role(){return S.viewAs||S.role}
const canEdit=()=>S.mode==="live"&&role()==="inside";
const canApprove=()=>S.mode==="live"&&(role()==="cliente"||role()==="inside");
function rv(p){return `var(${region(p.region).var})`}
function caption(p){
  if(p.copy&&p.copy.trim()) return {text:p.copy.trim(),prov:false};
  const t=[p.headline,p.cta?`👉 ${p.cta}`:""].filter(Boolean).join("\n\n");
  return {text:t||p.campana||"",prov:true};
}
function phClass(p){return p.tipo==="promo"||p.linea==="Promociones"?"promo":p.linea==="Kids"||p.linea==="Halloween Kids"?"kids":p.linea==="Nuevas Llegadas"?"nl":""}
function colLetter(n){let s="";while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s}
function slotLabel(p){return p.slot?`hoja «${p.slot.sheet}», celdas ${p.slot.cell} (fila VIEW)`:""}
function emptyMedia(p){
  const ok=["Aprobado","Programado","Publicado"].includes(p.estado);
  if(role()!=="inside") return `<div class="ph emptym"><b>${ok?"Pieza aprobada":"Arte en producción"}</b><span>${esc(p.campana||"")}${p.headline?" · "+esc(p.headline):""}</span></div>`;
  return `<div class="ph emptym"><span class="em-ic">＋</span><b>Sin imagen</b><span>${p.slot?`Pégala en el Excel: ${esc(slotLabel(p))}`:"Esta pieza no tiene casilla de imagen en el Excel. Ubícala primero en el calendario del documento."}</span></div>`;
}
function placeholder(p,extra=""){
  const en=p.paises.every(c=>EN_PAISES.has(c));

}

const FEED_FMT=["Estático","Carrusel","Reel"];
function fmts(p){const a=(Array.isArray(p.formatos)&&p.formatos.length?p.formatos:[p.formato||"Estático"]).filter(f=>FORMATOS.includes(f));return a.length?FORMATOS.filter(f=>a.includes(f)):["Estático"]}
function isStory(p){return fmts(p).includes("Historia")}
function feedFmt(p){return fmts(p).find(f=>FEED_FMT.includes(f))||""}
function fmtLabel(p){return fmts(p).join(" + ")}
function fmtAbbr(p){return fmts(p).map(f=>FMT_ABBR[f]).join("·")}
function pvFmt(p){const a=fmts(p);return a.includes(S.pv.fmt)?S.pv.fmt:a[0]}
const FMT_ABBR={"Estático":"POST","Carrusel":"CARR","Reel":"REEL","Historia":"HIST","Portada":"PORT"};

/* ============ filtros */
function matches(p,opts={}){
  const f=S.f;
  if(f.region!=="ALL"&&p.region!==f.region) return false;
  if(f.paises.length&&!p.paises.some(c=>f.paises.includes(c))) return false;
  if(!opts.ignoreTipo&&f.tipo!=="ALL"&&p.tipo!==f.tipo) return false;
  if(f.linea!=="ALL"&&p.linea!==f.linea) return false;
  if(f.estado!=="ALL"&&p.estado!==f.estado) return false;
  if(p.fecha&&((f.desde&&p.fecha<f.desde)||(f.hasta&&p.fecha>f.hasta))) return false;
  if(f.q){const q=f.q.toLowerCase();const hay=[p.campana,p.headline,p.copy,p.serie,p.idea,p.sku,p.fase,p.grupo,p.paises.join(" ")].join(" ").toLowerCase();if(!hay.includes(q)) return false}
  return true;
}
function isDraft(p){return !p.campana&&!p.headline&&!(p.imagenes||[]).length}
function visible(){return [...S.posts.values()].filter(p=>matches(p)&&!(role()!=="inside"&&isDraft(p)))}
function sortPosts(a,b){return (a.fecha||"9").localeCompare(b.fecha||"9")||horaMin(a.hora)-horaMin(b.hora)||a.region.localeCompare(b.region)}
function persistF(){store.set("f",{...S.f,q:""})}

  const f=S.f; const r=f.region!=="ALL"?region(f.region):null;
  const counts={}; for(const p of S.posts.values()){counts[p.region]=(counts[p.region]||0)+1}
  $("#filters").innerHTML=`

    <div class="seg" role="group" aria-label="Región">
      <button data-region="ALL" aria-pressed="${f.region==="ALL"}">Todas</button>
      ${REGIONES.map(x=>`<button data-region="${x.id}" aria-pressed="${f.region===x.id}"><span class="dot" style="background:var(${x.var})"></span>${x.corto}</button>`).join("")}
    </div></div>
  ${r&&r.paises.length>1?`<div class="fgroup"><span class="flabel">País</span><div class="chips">${r.paises.map(c=>`<button class="chip" data-pais="${c}" aria-pressed="${f.paises.includes(c)}" title="${PAIS[c]}">${c}</button>`).join("")}</div></div>`:""}
  <div class="fgroup"><span class="flabel">Tipo</span>
    <div class="seg" role="group" aria-label="Tipo">
      ${[["ALL","Todo"],["feed","Feed"],["historia","Historias"],["promo","Promos"]].map(([k,l])=>`<button data-tipo="${k}" aria-pressed="${f.tipo===k}">${l}</button>`).join("")}
    </div></div>
  <div class="fgroup">
    <select class="sel" id="fLinea" aria-label="Campaña"><option value="ALL">Todas las campañas</option>${LINEAS.map(l=>`<option ${f.linea===l?"selected":""}>${l}</option>`).join("")}</select>
    <select class="sel" id="fEstado" aria-label="Estado"><option value="ALL">Todos los estados</option>${ESTADOS.map(e=>`<option ${f.estado===e.id?"selected":""}>${e.id}</option>`).join("")}</select>
    <span class="flabel" style="margin-left:6px">Fechas</span><input class="sel" type="date" id="fDesde" value="${esc(f.desde||"")}" aria-label="Desde"><span class="flabel">a</span><input class="sel" type="date" id="fHasta" value="${esc(f.hasta||"")}" aria-label="Hasta">
    <button class="chip" data-range="1-10" aria-pressed="${f.desde==="2026-10-01"&&f.hasta==="2026-10-10"}">1–10 oct</button><button class="chip" data-range="mes" aria-pressed="${!f.desde&&!f.hasta}">Mes completo</button>
    <input class="search" id="fQ" type="search" placeholder="Buscar headline, SKU, campaña…" value="${esc(f.q)}" aria-label="Buscar">
  </div>
  <div class="fgroup views">
    <div class="seg" role="group" aria-label="Vista">
      ${[["cal","Calendario"],["list","Lista"],["grid","Feed por país"],...(role()==="inside"?[["gaps","Faltantes"]]:[])].map(([k,l])=>`<button data-view="${k}" aria-pressed="${f.view===k}">${l}</button>`).join("")}
    </div>
    ${canEdit()?`<button class="btn primary" id="newPost">＋ Nueva</button>`:""}
  </div>`;
}
document.addEventListener("click",e=>{
  const rg=e.target.closest("[data-range]"); if(rg){if(rg.dataset.range==="mes"){S.f.desde="";S.f.hasta=""}else{S.f.desde="2026-10-01";S.f.hasta="2026-10-10";S.month=[2026,9]}persistF();render();return}
  const t=e.target.closest("[data-region],[data-pais],[data-tipo],[data-view]"); if(!t||!t.closest("#filters")) return;
  const f=S.f;
  if(t.dataset.region){f.region=t.dataset.region;f.paises=[]; if(f.region!=="ALL"&&!region(f.region).paises.includes(f.gridPais)) f.gridPais=region(f.region).paises[0]}
  if(t.dataset.pais){const c=t.dataset.pais;f.paises=f.paises.includes(c)?f.paises.filter(x=>x!==c):[...f.paises,c]; if(f.paises.length===1) f.gridPais=f.paises[0]}
  if(t.dataset.tipo) f.tipo=t.dataset.tipo;
  if(t.dataset.view) f.view=t.dataset.view;
  persistF(); render();
});
document.addEventListener("change",e=>{
  if(e.target.id==="fLinea"){S.f.linea=e.target.value;persistF();render()}
  if(e.target.id==="fEstado"){S.f.estado=e.target.value;persistF();render()}
  if(e.target.id==="fDesde"){S.f.desde=e.target.value;persistF();render()}
  if(e.target.id==="fHasta"){S.f.hasta=e.target.value;persistF();render()}
});
document.addEventListener("input",e=>{if(e.target.id==="fQ"){S.f.q=e.target.value;clearTimeout(renderFilters.t);renderFilters.t=setTimeout(()=>renderView(),150)}});

/* ============ resumen */
function renderSummary(){
  const [y,m]=S.month; const pre=`${y}-${pad(m+1)}`;
  const vs=visible(); const inM=vs.filter(p=>p.fecha&&p.fecha.startsWith(pre));
  const by=k=>inM.filter(p=>p.tipo===k).length;
  const env=inM.filter(p=>p.estado==="Enviado a cliente").length;
  const cam=inM.filter(p=>p.estado==="Cambios solicitados").length;
  const soon=inM.filter(p=>p.fecha>=todayISO&&p.fecha<=iso(new Date(Date.now()+2*864e5))&&!["Aprobado","Programado","Publicado"].includes(p.estado)).length;

   ${soon&&role()==="inside"?`<span class="warn"><b>${soon}</b> salen en ≤2 días sin aprobar</span>`:""}${sf&&role()==="inside"?`<span><b>${sf}</b> por asignar fecha</span>`:""}`;
}

/* ============ vista calendario */
function chip(p,opts={}){
  const im=p.imagenes&&p.imagenes[0];
  const story=!isFeed(p)&&isStory(p);
  const drag=canEdit()?`draggable="true"`:"";
  const where=p.paises.length===region(p.region).paises.length&&p.paises.length>1?region(p.region).corto:p.paises.join(" ");
  return `<button class="pc ${colorC(p.estado)} ${S.clip===p.id?"clip":""} ${S.sel===p.id?"sel":""}" data-open="${esc(p.id)}" ${drag} data-drag="${esc(p.id)}" style="--rc:${rv(p)}" title="${esc((p.headline||p.campana)+" · "+p.estado)}">
    <span class="th ${story?"story":""}" style="${im?`background-image:url('${esc(imgSrc(im))}')`:""}">${im?"":p.tipo==="promo"?"%":story?"◎":"▢"}</span>
    <span style="min-width:0"><span class="t1"><span class="sd ${estadoC(p.estado)}"></span><span class="mono">${esc(p.hora||(opts.sf&&p.fechaPropuesta?"prop. "+fmtDia(p.fechaPropuesta):"—"))}</span><span class="fmt">${fmtAbbr(p)}</span><span>${esc(where)}</span></span>
    <span class="t2">${esc(p.campana||p.headline||"Sin campaña")}</span></span></button>`;
}
function monthDays(){
  const [y,m]=S.month; const first=new Date(y,m,1); const start=new Date(first); start.setDate(1-((first.getDay()+6)%7));
  const last=new Date(y,m+1,0); const end=new Date(last); end.setDate(last.getDate()+(6-((last.getDay()+6)%7)));
  const out=[]; for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)) out.push(new Date(d)); return out;
}
const expanded=new Set();
function renderCal(){
  const rank=p=>isFeed(p)?0:fmts(p).includes("Portada")?1:2;
  const vs=visible().sort((a,b)=>sortPosts(a,b)); const byDay={}; for(const p of vs) if(p.fecha)(byDay[p.fecha]=byDay[p.fecha]||[]).push(p);
  for(const k in byDay) byDay[k].sort((a,b)=>rank(a)-rank(b)||horaMin(a.hora)-horaMin(b.hora));
  const sf=vs.filter(p=>!p.fecha);
  const narrow=window.matchMedia("(max-width:760px)").matches;
  const [y,m]=S.month; const pre=`${y}-${pad(m+1)}`;
  let main;
  if(narrow){
    const days=Object.keys(byDay).filter(d=>d.startsWith(pre)).sort();
    main=days.length?`<div class="agenda">${days.map(d=>`<section class="aday"><h4>${cap1(fmtDia(d,true))} <span>${byDay[d].length} publicaciones</span></h4><div class="items">${byDay[d].map(p=>chip(p)).join("")}</div></section>`).join("")}</div>`
      :emptyMonth();
  }else{
    const LIM=4;
    main=`<div class="cal"><div class="cal-head">${DOW.map(d=>`<div>${d}</div>`).join("")}</div><div class="cal-body">${monthDays().map(d=>{
      const k=iso(d); const ps=byDay[k]||[]; const out=d.getMonth()!==m; const show=expanded.has(k)?ps:ps.slice(0,LIM);
      return `<div class="day ${out?"out":""} ${k===todayISO?"today":""} ${S.selDay===k?"sel":""}" data-day="${k}"><div class="dhead"><span class="dnum">${d.getDate()}</span>${canEdit()&&S.clip&&S.posts.has(S.clip)?`<button class="dpaste" data-paste="${k}" title="Pegar la publicación copiada el ${fmtDia(k,true)}">Pegar</button>`:""}${canEdit()?`<button class="dadd" data-new="${k}" aria-label="Nueva publicación el ${fmtDia(k,true)}">＋</button>`:""}</div>
      ${show.map(p=>chip(p)).join("")}${ps.length>LIM?`<button class="more" data-expand="${k}">${expanded.has(k)?"Ver menos":`+${ps.length-LIM} más`}</button>`:""}</div>`}).join("")}</div></div>`;
  }
  const side=`<aside class="side">
    ${role()==="inside"?`<section class="panel"><h3>Por asignar fecha <span style="font:600 13px var(--f-mono);color:var(--ink-3)">${sf.length}</span></h3><p class="sub">Piezas de la parrilla que no coinciden con ningún día del calendario operativo.${canEdit()?" Arrástralas a un día, o vincúlalas desde la ficha de un post.":""}</p>
      <div class="backlog" data-day="">${sf.length?sf.map(p=>chip(p,{sf:true})).join(""):`<p class="sub" style="margin:0">Nada pendiente con estos filtros.</p>`}</div></section>`:""}
    <section class="panel"><h3>Cómo leer el calendario</h3><div class="legend">
      ${REGIONES.map(r=>`<div><span class="sw" style="background:var(${r.var})"></span>${r.nombre}</div>`).join("")}
      <div style="margin-top:4px"></div>
      <div><span class="cs pub"></span><span><b>Verde</b>: programado o publicado</span></div>
      <div><span class="cs env"></span><span><b>Naranja</b>: esperando aprobación del cliente</span></div>
      <div><span class="cs"></span><span><b>Blanco</b>: en desarrollo en Inside</span></div>
      <div style="margin-top:4px"></div>
      ${ESTADOS.map(e=>`<div><span class="sd ${e.c}" style="width:9px;height:9px"></span>${e.id}</div>`).join("")}
      <div style="margin-top:4px;color:var(--ink-3)">Las historias llevan aro naranja. POST, CARR, REEL, HIST y PORT indican los formatos; una pieza puede salir en varios.</div>
    </div></section></aside>`;
  $("#view").innerHTML=`${clipBar()}${selectMode()&&!S.clip?`<p class="selhint"><b>Clic</b> selecciona una publicación · <b>doble clic</b> la abre · <kbd>Ctrl</kbd>+<kbd>C</kbd> copia · clic en un día y <kbd>Ctrl</kbd>+<kbd>V</kbd> pega</p>`:""}<div class="layout">${main}${side}</div>`;
}
function emptyMonth(){return `<div class="empty"><h3>Sin publicaciones este mes</h3><p>Cambia de mes o limpia los filtros para ver más.</p></div>`}

  <td style="max-width:280px">${esc(p.headline||"—")}</td><td><span class="badge ${estadoC(p.estado)}"><span class="sd"></span>${esc(p.estado)}</span></td>

/* ============ vista feed por país */
function countryFeed(c,useFilters){
  const [y,m]=S.month; const pre=`${y}-${pad(m+1)}`;
  const all=[...S.posts.values()].filter(p=>p.paises.includes(c)&&!(role()!=="inside"&&isDraft(p))&&(!useFilters||matches({...p,paises:[c]},{ignoreTipo:true})));
  const feed=all.filter(p=>isFeed(p)&&p.fecha&&p.fecha<=`${pre}-31`).sort((a,b)=>sortPosts(b,a));
  const stories=all.filter(p=>isStory(p)&&p.fecha&&p.fecha.startsWith(pre)).sort(sortPosts);
  return {feed,stories,pre,m};
}
function isFeed(p){return fmts(p).some(f=>FEED_FMT.includes(f))}
function handleOf(c){return `payless${c==="RD"?"rd":"."+c.toLowerCase()}`}
function profileGrid(c,{highlight=null,useFilters=true,onlyArt=false,tab="feed"}={}){
  let {feed,stories,pre,m}=countryFeed(c,useFilters);
  const withArt=feed.filter(p=>p.imagenes&&p.imagenes.length).length;
  const shown=onlyArt?feed.filter(p=>p.imagenes&&p.imagenes.length||p.id===highlight):feed;
  const sgroups=[]; const seen=new Set(); for(const s of [...stories.filter(x=>(x.imagenes||[]).length),...stories]){if(!seen.has(s.campana)){seen.add(s.campana);sgroups.push(s)}}
  const inMonth=feed.filter(p=>p.fecha.startsWith(pre));
  const en=EN_PAISES.has(c);
  return `<div class="igtop"><b>${handleOf(c)}</b><span style="font-size:20px">≡</span></div>
     <div class="prof"><div class="row"><div class="av ring">P</div><div class="stats"><div><b>${inMonth.length}</b>en ${MESES[m]}</div><div><b>${withArt}</b>con arte</div><div><b>${stories.length}</b>historias</div></div></div>
     <div class="bio"><b>Payless ${esc(PAIS[c])}</b>${en?"Find your style in one place. Only at Payless.":"Todos los estilos en un solo lugar. Solo en Payless."}</div></div>
     <div class="hls">${sgroups.length?sgroups.map(s=>`<button class="hl" data-open="${esc(s.id)}"><span style="${s.imagenes&&s.imagenes[0]?`background-image:url('${esc(imgSrc(s.imagenes[0]))}')`:""}">${s.imagenes&&s.imagenes[0]?"":"P"}</span><em>${esc(s.campana)}</em></button>`).join(""):`<span style="color:var(--ig-mute);font-size:12px">Sin historias este mes</span>`}</div>
     <div class="gtabs"><button data-gtab="feed" class="${tab==="feed"?"on":""}">▦ Feed</button><button data-gtab="stories" class="${tab==="stories"?"on":""}">◎ Historias (${stories.length})</button></div>
     ${tab==="stories"?(stories.length?`<div class="igrid stories">${stories.map(p=>storyTile(p,p.id===highlight)).join("")}</div>`:`<div class="emptygrid">Sin historias este mes.</div>`):shown.length?`<div class="igrid">${shown.map(p=>tile(p,!p.fecha.startsWith(pre),p.id===highlight)).join("")}</div>`:`<div class="emptygrid">${onlyArt?"Este país todavía no tiene piezas de feed con arte cargado.":"Este país no tiene publicaciones de feed con estos filtros."}</div>`}`;
}
function renderGrid(){
  const f=S.f; const r=f.region!=="ALL"?region(f.region):null;
  const opts=r?r.paises:REGIONES.flatMap(x=>x.paises);
  if(!opts.includes(f.gridPais)) f.gridPais=opts[0];
  const c=f.gridPais; const {feed,m}=countryFeed(c,true);
  const withArt=feed.filter(p=>p.imagenes&&p.imagenes.length).length;
  const big=f.gridSize==="big";
  $("#view").innerHTML=`<div class="gridview ${big?"big":""}">
   <div class="gridphone">${phone(profileGrid(c,{onlyArt:f.onlyArt,tab:f.gridTab||"feed"}))}</div>
   <div class="gridnote"><h2>Feed de ${esc(PAIS[c])}</h2>
     <div class="fgroup" style="margin:4px 0 14px"><div class="chips">${opts.map(x=>`<button class="chip" data-gpais="${x}" aria-pressed="${x===c}" title="${PAIS[x]}">${x} · ${PAIS[x]}</button>`).join("")}</div></div>
     <div class="fgroup" style="margin-bottom:14px">
       <div class="seg" role="group" aria-label="Tamaño"><button data-gsize="phone" aria-pressed="${!big}">Celular</button><button data-gsize="big" aria-pressed="${big}">Grande</button></div>
       <div class="seg" role="group" aria-label="Piezas"><button data-onlyart="0" aria-pressed="${!f.onlyArt}">Todas</button><button data-onlyart="1" aria-pressed="${!!f.onlyArt}">Solo con arte</button></div>
     </div>
     <p><b>${withArt} de ${feed.length}</b> piezas de feed tienen arte cargado. ${withArt<feed.length?"Los cuadros grises son publicaciones sin imagen: pega la imagen en su casilla VIEW del Excel (cada cuadro indica la celda) y usa «Actualizar desde el Excel».":""}</p>
     ${canEdit()&&S.assets?`<p><button class="btn primary" data-xlsx>Actualizar imágenes desde el Excel</button></p>`:""}
     <p>Aquí solo aparece lo que se publica en el feed. Las historias y las promos (que van en historias) están en la pestaña <b>Historias</b> del perfil.</p>
     <p>Orden de salida, la más reciente arriba, con el recorte 3:4 del perfil de Instagram. Las piezas de meses anteriores aparecen atenuadas. Toca un cuadro para abrir la publicación.</p>
   </div></div>`;

function loadScript(src){return new Promise((ok,ko)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}

const FRAME={"Carrusel":0.8,"Reel":0.8,"Historia":0.5625,"Estático":0.8,"Portada":2.6};
async function sha(buf){const h=await crypto.subtle.digest("SHA-256",buf);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("")}
async function frames(blob,fmt){
  const bmp=await createImageBitmap(blob); const ratio=bmp.width/bmp.height; const exp=FRAME[fmt]||0.8;
  let n=Math.round(ratio/exp); if(n<2||ratio<exp*1.5) n=1;
  const out=[]; const fw=bmp.width/n;
  for(let i=0;i<n;i++){const c=document.createElement("canvas");c.width=Math.round(fw);c.height=bmp.height;c.getContext("2d").drawImage(bmp,Math.round(i*fw),0,Math.round(fw),bmp.height,0,0,c.width,c.height);out.push(await new Promise(r=>c.toBlob(r,"image/jpeg",0.88)))}
  return out;
}
function kids(el,name){return [...el.children].filter(c=>c.localName===name)}
function desc(el,name){return [...el.getElementsByTagName("*")].filter(c=>c.localName===name)}
async function importXlsx(file){
  if(!S.assets){toast("Necesitas permiso de edición para actualizar imágenes.");return}
  toast("Leyendo el Excel…");
  try{
    if(!window.JSZip) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
    const zip=await JSZip.loadAsync(file); const P=new DOMParser();
    const xml=async p=>{const f=zip.file(p);return f?P.parseFromString(await f.async("string"),"application/xml"):null};
    const rels=async p=>{const d=await xml(p);const m={};if(d) for(const r of desc(d,"Relationship")) m[r.getAttribute("Id")]=r.getAttribute("Target");return m};
    const resolve=(base,t)=>{if(t.startsWith("/")) return t.slice(1);const parts=base.split("/");parts.pop();for(const seg of t.split("/")){if(seg==="..")parts.pop();else if(seg!==".")parts.push(seg)}return parts.join("/")};
    const wb=await xml("xl/workbook.xml"); const wbr=await rels("xl/_rels/workbook.xml.rels");
    const anchors=[];
    for(const sh of desc(wb,"sheet")){
      const name=sh.getAttribute("name"); const rid=[...sh.attributes].find(a=>a.localName==="id").value;
      const sp=resolve("xl/workbook.xml",wbr[rid]); const sr=await rels(sp.replace(/([^/]+)$/,"_rels/$1.rels"));
      for(const t of Object.values(sr)){ if(!/drawings\//.test(t)) continue;
        const dp=resolve(sp,t); const d=await xml(dp); if(!d) continue; const dr=await rels(dp.replace(/([^/]+)$/,"_rels/$1.rels"));
        for(const an of [...desc(d,"twoCellAnchor"),...desc(d,"oneCellAnchor")]){
          const fr=kids(an,"from")[0]; const blip=desc(an,"blip")[0]; if(!fr||!blip) continue;
          const col=+desc(fr,"col")[0].textContent+1, row=+desc(fr,"row")[0].textContent+1;
          const emb=[...blip.attributes].find(a=>a.localName==="embed"); if(!emb) continue;
          anchors.push({sheet:name,col,row,media:resolve(dp,dr[emb.value])});
        }}
    }
    const posts=[...S.posts.values()].filter(p=>p.slot);
    let nuevas=0,iguales=0,sueltas=0; const cache=new Map();
    for(const a of anchors){
      const targets=posts.filter(p=>p.slot.sheet===a.sheet&&p.slot.col===a.col&&a.row>=p.slot.r1-1&&a.row<=p.slot.r2);
      if(!targets.length){sueltas++;continue}
      const f=zip.file(a.media); if(!f) continue; const buf=await f.async("arraybuffer"); const h=await sha(buf);
      for(const p of targets){
        const cur=S.posts.get(p.id); if(cur.arteManual||cur.imgHash===h){iguales++;continue}
        const key=h+"|"+cur.formato; let ids=cache.get(key);
        if(!ids){toast(`Subiendo imágenes… (${nuevas+1})`);const fr=await frames(new Blob([buf]),cur.formato);ids=[];for(const b of fr){const r=await S.assets.upload(b,{type:"image/jpeg"});ids.push("asset:"+r.id)}cache.set(key,ids)}
        await save(p.id,{imagenes:ids,imgHash:h}); nuevas++;
      }
    }
    toast(nuevas?`${nuevas} ${nuevas===1?"pieza":"piezas"} con imagen nueva · ${iguales} sin cambios`:`No hay imágenes nuevas (${iguales} sin cambios)`);
  }catch(err){console.error(err);toast("No se pudo leer el Excel. Revisa que sea el planning en formato .xlsx.")}
}

function approveBox(p){
  if(!canApprove()) return "";
  const pend=p.estado==="Enviado a cliente";
  if(role()==="cliente"){
    if(!pend&&p.estado!=="Cambios solicitados") return `<div class="approve"><span class="q">${p.estado==="Aprobado"||p.estado==="Programado"||p.estado==="Publicado"?"Esta pieza ya está aprobada.":"Esta pieza aún no se ha enviado a aprobación. Puedes dejar comentarios en la pestaña Aprobación."}</span></div>`;
    return `<div class="approve"><span class="q">${pend?"¿Apruebas esta publicación?":"Pediste cambios. ¿Ya está lista?"}</span>
      <button class="btn ok" data-act="aprobar">Aprobar</button><button class="btn bad" data-act="cambios">Pedir cambios</button>
      ${S.askChanges?`<textarea id="chgTxt" placeholder="¿Qué hay que ajustar? Sé específico: texto, foto, país, fecha…"></textarea><button class="btn primary" data-act="enviarCambios">Enviar cambios</button>`:""}</div>`;
  }
  if(p.estado==="Sin iniciar"||p.estado==="En desarrollo"||p.estado==="Cambios solicitados")
    return `<div class="approve"><span class="q">${p.estado==="Cambios solicitados"?"El cliente pidió cambios. Cuando estén listos, vuelve a enviarla.":"¿Lista para revisión del cliente?"}</span><button class="btn primary" data-act="enviar">Enviar a aprobación</button></div>`;
  return "";
}

function inp(k,label,p,type="text",wide=false,hint=""){

  else ctl=`<input id="${id}" data-field="${k}" type="${type}" value="${esc(v)}">`;
  return `<div class="f ${wide?"wide":""}"><label for="${id}">${label}</label>${ctl}${hint?`<span class="hint">${hint}</span>`:""}${k==="link"&&p.link?`<a class="hint" href="${esc(p.link)}" target="_blank" rel="noopener">Abrir enlace ↗</a>`:""}</div>`;

      ${canApprove()?`<div class="newcm"><textarea id="cmTxt" placeholder="Escribe un comentario para el equipo…" aria-label="Comentario"></textarea><button class="btn primary" data-act="comentar">Comentar</button></div>`:""}`;

  return `${linkBox}<div class="fields">

document.addEventListener("click",async e=>{
  const pcEl=e.target.closest("#view .pc[data-open]");
  if(pcEl&&selectMode()&&!S.justDragged){selectPost(pcEl.dataset.open,pcEl);return}
  const dayEl=e.target.closest("#view .day[data-day]");
  if(dayEl&&selectMode()&&!e.target.closest("button,a,input")){selectDay(dayEl.dataset.day);return}
  const o=e.target.closest("[data-open]"); if(o&&!S.justDragged&&!e.target.closest("input,select,textarea,label")){openPost(o.dataset.open);return}
  const ch=e.target.closest("[data-clearhora]"); if(ch){await save(ch.dataset.clearhora,{hora:""});toast("Hora quitada");return}
  const rmA=e.target.closest("[data-rmask]"); if(rmA){S.rmAsk=+rmA.dataset.rmask;renderSheet();return}
  if(e.target.closest("[data-rmno]")){S.rmAsk=null;renderSheet();return}
  const mvR=e.target.closest("[data-mvr]"); if(mvR){const p=S.posts.get(S.openId);const k=+mvR.dataset.mvr;const a=[...p.imagenes];[a[k+1],a[k]]=[a[k],a[k+1]];await save(p.id,{imagenes:a,arteManual:true});return}
  if(e.target.closest("[data-x]")||e.target.matches("[data-close]")){closeSheet();return}
  const ex=e.target.closest("[data-expand]"); if(ex){const k=ex.dataset.expand;expanded.has(k)?expanded.delete(k):expanded.add(k);renderView();return}
  const nw=e.target.closest("[data-new]"); if(nw){createPost(nw.dataset.new);return}
  if(e.target.closest("#newPost")){createPost(S.month?`${S.month[0]}-${pad(S.month[1]+1)}-01`:"");return}
  const tb=e.target.closest("[data-tab]"); if(tb){S.openTab=tb.dataset.tab;renderSheet();return}
  const pv=e.target.closest("[data-pv]"); if(pv){const p=S.posts.get(S.openId);const n=(p.imagenes||[]).length;S.pv.slide=Math.max(0,Math.min(n-1,S.pv.slide+ +pv.dataset.pv));renderSheet();return}
  if(e.target.closest("[data-more]")){S.pv.full=true;renderSheet();return}
  if(e.target.closest("[data-play]")){S.pv.playing?stopPlay():startPlay();renderSheet();return}
  const tp=e.target.closest("[data-tpais]"); if(tp){const p=S.posts.get(S.openId);const c=tp.dataset.tpais;let ps=p.paises.includes(c)?p.paises.filter(x=>x!==c):[...p.paises,c];if(!ps.length){toast("Debe salir en al menos un país");return}ps=region(p.region).paises.filter(x=>ps.includes(x));await save(p.id,{paises:ps});return}
  const mv=e.target.closest("[data-mv]"); if(mv){const p=S.posts.get(S.openId);const k=+mv.dataset.mv;const a=[...p.imagenes];[a[k-1],a[k]]=[a[k],a[k-1]];await save(p.id,{imagenes:a,arteManual:true});return}
  const rm=e.target.closest("[data-rm]"); if(rm){const p=S.posts.get(S.openId);const a=p.imagenes.filter((_,k)=>k!==+rm.dataset.rm);S.rmAsk=null;await save(p.id,{imagenes:a,arteManual:true});toast("Foto borrada de la publicación");return}
  const act=e.target.closest("[data-act]"); if(act) doAct(act.dataset.act);
});
function startPlay(resume){
  const p=S.posts.get(S.openId); const n=(p.imagenes||[]).length; if(n<2) return;
  clearInterval(S.pv.timer); S.pv.playing=true;
  S.pv.timer=setInterval(()=>{S.pv.slide=(S.pv.slide+1)%n; const tr=$(".sheet .track"); if(tr) tr.style.transform=`translateX(-${S.pv.slide*100}%)`; else stopPlay()},1400);
}
document.addEventListener("keydown",e=>{

async function upload(files,replace){
  const p=S.posts.get(S.openId); if(!p||!S.assets||!files.length) return;
  const msg=$("#uplMsg"); const added=[];
  for(const [k,f] of files.entries()){
    if(msg) msg.textContent=`Subiendo ${k+1} de ${files.length}…`;
    try{const r=await S.assets.upload(f);added.push("asset:"+r.id)}
    catch(err){toast(err&&err.code==="too_large"?`${f.name} pesa más de 20 MB`:err&&err.code==="unsupported_type"?`${f.name}: formato no admitido`:`No se pudo subir ${f.name}. Intenta de nuevo.`)}
  }
  if(added.length){const cur=S.posts.get(p.id);await save(p.id,{imagenes:replace?added:[...(cur.imagenes||[]),...added],arteManual:true});toast(replace?"Arte reemplazado":added.length===1?"Foto agregada":`${added.length} fotos agregadas`);if(msg) msg.textContent=""}
  else if(msg) msg.textContent="";
}

async function doAct(a){
  const p=S.posts.get(S.openId); if(!p) return;
  if(a==="cambios"){S.askChanges=true;renderSheet();$("#chgTxt")?.focus();return}
  if(a==="aprobar"){await save(p.id,{estado:"Aprobado"});await addComment(p.id,"aprobado","");toast("Aprobada");return}
  if(a==="enviarCambios"){const t=$("#chgTxt").value.trim();if(!t){toast("Cuéntanos qué hay que ajustar");return}S.askChanges=false;await save(p.id,{estado:"Cambios solicitados"});await addComment(p.id,"cambios",t);toast("Cambios enviados al equipo");return}
  if(a==="enviar"){await save(p.id,{estado:"Enviado a cliente"});await addComment(p.id,"envio","");toast("Enviada a aprobación");return}
  if(a==="comentar"){const t=$("#cmTxt").value.trim();if(!t) return;await addComment(p.id,"nota",t);toast("Comentario publicado");return}
  if(a==="sinfecha"){await save(p.id,{fecha:"",sinFecha:true,fechaPropuesta:p.fecha});toast("Movida a Por asignar fecha");return}
  if(a==="copiar"){copyPost(p.id);closeSheet();return}
  if(a==="duplicar"){const id=newId(p);const c={...p,id,estado:"Sin iniciar",copy:p.copy,fuente:`Duplicada de ${p.id}`,creado:new Date().toISOString()};await write(id,c,true);toast("Duplicada");openPost(id);return}
  if(a==="borrar"){S.confirmDel=true;renderSheet();return}
  if(a==="borrarNo"){S.confirmDel=false;renderSheet();return}
  if(a==="borrarSi"){try{await S.db.doc("posts/"+p.id).delete();S.posts.delete(p.id);closeSheet();render();toast("Publicación eliminada")}catch(e){toast("No se pudo eliminar. Revisa tu conexión.")}}
}
function newId(p){return `${(p.region||"cen").slice(0,3).toLowerCase()}-n-${Date.now().toString(36)}${Math.random().toString(36).slice(2,5)}`}
/* ============ copiar y pegar publicaciones */
function clipBar(){
  if(!canEdit()||!S.clip) return "";
  const p=S.posts.get(S.clip); if(!p){S.clip=null;return ""}
  return `<div class="clipbar" role="status"><span>Copiada: <b>${esc(p.campana||p.headline||"Publicación")}</b> · ${esc(fmtLabel(p))} · ${esc(p.paises.join(" "))}${p.fecha?" · "+fmtDia(p.fecha):""}</span>
    <span>Haz clic en un día y presiona <b>Ctrl+V</b>, o toca <b>Pegar</b> en cada día (puedes pegar varias veces), o elige una fecha:</span>
    <input type="date" id="clipDate" aria-label="Fecha para pegar" value="${esc(p.fecha||"")}"><button class="btn primary" data-pastedate>Pegar</button><span class="sp"></span><button class="btn ghost" data-clipclear>Terminar</button></div>`;
}
function copyPost(id){
  if(!canEdit()||!S.posts.has(id)) return;
  S.clip=id; renderView(); toast("Copiada. Haz clic en un día y presiona Ctrl+V.");
}
async function pastePost(day){
  const src=S.posts.get(S.clip); if(!canEdit()||!src||!day) return;
  const id=newId(src);
  const c={...src,id,origen:"manual",fecha:day,sinFecha:false,estado:"Sin iniciar",creado:new Date().toISOString(),fuente:`Copiada de ${src.id}${src.fecha?" ("+fmtDia(src.fecha)+")":""}`};
  for(const k of ["slot","imgHash","fechaPropuesta","actualizado","actualizadoPor","vinculo"]) delete c[k];
  if((c.imagenes||[]).length) c.arteManual=true;
  await write(id,c,true); toast(`Pegada el ${fmtDia(day,true)}${matches(c)?"":" (no se ve con los filtros actuales)"}`);
}
document.addEventListener("click",e=>{
  const ps=e.target.closest("[data-paste]"); if(ps){e.stopPropagation();pastePost(ps.dataset.paste);return}
  if(e.target.closest("[data-pastedate]")){const v=$("#clipDate")?.value; if(!v){toast("Elige una fecha");return} pastePost(v);return}
  if(e.target.closest("[data-clipclear]")){S.clip=null;renderView();return}
},true);
/* selección: clic selecciona, doble clic abre (solo Inside con mouse) */
function selectMode(){return canEdit()&&window.matchMedia("(pointer:fine)").matches}
function selectPost(id,el){
  S.sel=id; const p=S.posts.get(id); if(p&&p.fecha) S.selDay=p.fecha;
  document.querySelectorAll("#view .pc.sel").forEach(x=>x.classList.remove("sel"));
  document.querySelectorAll(`#view .pc[data-open="${CSS.escape(id)}"]`).forEach(x=>x.classList.add("sel"));
  markDay();
}
function selectDay(day){S.selDay=day;markDay()}
function markDay(){document.querySelectorAll("#view .day.sel").forEach(x=>x.classList.remove("sel"));if(S.selDay) document.querySelector(`#view .day[data-day="${S.selDay}"]`)?.classList.add("sel")}
document.addEventListener("dblclick",e=>{const c=e.target.closest("#view .pc[data-open]");if(c&&selectMode()) openPost(c.dataset.open)});
document.addEventListener("keydown",e=>{
  if(S.openId||!S.sel||e.target.closest("input,textarea,select")) return;
  if(e.key==="Enter"){e.preventDefault();openPost(S.sel)}
});
/* atajos: Ctrl/Cmd+C sobre una publicación, Ctrl/Cmd+V sobre un día */
let hoverPost=null, hoverDay=null;
document.addEventListener("mouseover",e=>{const c=e.target.closest("[data-open]");hoverPost=c&&c.closest("#view")?c.dataset.open:null;const d=e.target.closest(".day[data-day]");hoverDay=d?d.dataset.day:null});
document.addEventListener("keydown",e=>{
  if(!(e.ctrlKey||e.metaKey)||e.target.closest("input,textarea,select,[contenteditable]")||!canEdit()) return;
  if(window.getSelection&&String(window.getSelection()).length) return;
  const k=e.key.toLowerCase();
  if(k==="c"){const id=S.openId||S.sel||hoverPost; if(id){e.preventDefault();copyPost(id)}}
  else if(k==="v"&&S.clip&&!S.openId){const d=S.selDay||hoverDay; if(d){e.preventDefault();pastePost(d)}else toast("Haz clic en un día y vuelve a pegar")}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!S.openId&&(S.clip||S.sel||S.selDay)){S.clip=null;S.sel=null;S.selDay=null;renderView()}});
async function createPost(fecha){
  if(!canEdit()) return;
  const reg=S.f.region!=="ALL"?S.f.region:"CENTRO"; const r=region(reg);
  const id=newId({region:reg});
  const p={id,origen:"manual",region:reg,paises:S.f.paises.length?S.f.paises:[...r.paises],tipo:S.f.tipo==="ALL"?"feed":S.f.tipo,fecha:fecha||"",sinFecha:!fecha,hora:"",campana:"",linea:"Otra",formato:"Estático",estado:"Sin iniciar",headline:"",copy:"",imagenes:[],creado:new Date().toISOString(),fuente:"Creada en la plataforma"};
  await write(id,p,true); openPost(id); setTimeout(()=>$("#fld_headline")?.focus(),50);
}

/* ============ escritura (una a la vez por documento) */
const queues=new Map();
function enqueue(id,fn){const prev=queues.get(id)||Promise.resolve();const next=prev.catch(()=>{}).then(fn);queues.set(id,next);return next}
async function save(id,patch){
  if(!canApprove()) return;
  const cur=S.posts.get(id); if(!cur) return;
  const changed={}; for(const k in patch) if(JSON.stringify(cur[k])!==JSON.stringify(patch[k])) changed[k]=patch[k];
  if(!Object.keys(changed).length) return;
  changed.actualizado=new Date().toISOString(); if(S.myId) changed.actualizadoPor=S.myId;
  S.posts.set(id,{...cur,...changed}); render(); if(S.openId===id) renderSheet();
  try{await enqueue(id,()=>S.db.doc("posts/"+id).update(changed))}
  catch(e){S.posts.set(id,cur);render();if(S.openId===id) renderSheet();toast(e&&e.code==="invalid_argument"?"No tienes permiso para editar esta publicación.":"No se guardó el cambio. Revisa tu conexión e inténtalo otra vez.")}
}
async function write(id,doc,create){
  S.posts.set(id,doc); render();
  try{await enqueue(id,()=>S.db.doc("posts/"+id).set(doc))}catch(e){S.posts.delete(id);render();toast(e&&e.code==="quota_exceeded"?"Se llenó el espacio de la base de datos.":"No se pudo crear la publicación.")}
}
async function addComment(postId,tipo,texto){
  const c={postId,tipo,texto,fecha:new Date().toISOString(),autorId:S.myId||"",autorNombre:(S.me&&S.me.name)||""};
  S.comments.push(c); if(S.openId===postId) renderSheet();
  try{await S.db.collection("comentarios").add(c)}catch(e){S.comments=S.comments.filter(x=>x!==c);if(S.openId===postId) renderSheet();toast("No se pudo guardar el comentario.")}
}

/* ============ arrastrar entre días */
document.addEventListener("dragstart",e=>{const c=e.target.closest("[data-drag]");if(!c||!canEdit()) return;S.dragId=c.dataset.drag;c.classList.add("dragging");e.dataTransfer.effectAllowed="copyMove";try{e.dataTransfer.setData("text/plain",S.dragId)}catch(_){}});
document.addEventListener("dragend",e=>{const c=e.target.closest("[data-drag]");if(c) c.classList.remove("dragging");document.querySelectorAll(".drop").forEach(x=>x.classList.remove("drop"));S.dragId=null;S.justDragged=true;setTimeout(()=>S.justDragged=false,60)});
document.addEventListener("dragover",e=>{if(!S.dragId) return;const d=e.target.closest("[data-day]");if(!d) return;e.preventDefault();document.querySelectorAll(".drop").forEach(x=>x!==d&&x.classList.remove("drop"));d.classList.add("drop")});
document.addEventListener("drop",async e=>{
  if(!S.dragId) return; const d=e.target.closest("[data-day]"); if(!d) return; e.preventDefault();
  const id=S.dragId; const day=d.dataset.day; const p=S.posts.get(id); d.classList.remove("drop");
  if(!p) return;
  if(day&&(e.altKey||e.ctrlKey||e.metaKey)){const prev=S.clip;S.clip=id;await pastePost(day);S.clip=prev;return}
  if(p.fecha===day) return;
  if(day) {await save(id,{fecha:day,sinFecha:false}); toast(`Movida al ${fmtDia(day,true)}`)}
  else {await save(id,{fecha:"",sinFecha:true,fechaPropuesta:p.fecha||p.fechaPropuesta}); toast("Movida a Por asignar fecha")}
});

/* ============ render */
function renderTop(){
  const [y,m]=S.month; $("#monthTitle").textContent=`${MESES[m]} ${y}`;
  const pill=$("#rolePill");
  const labels={inside:"Equipo Inside",cliente:"Cliente Payless",lectura:"Solo lectura",offline:"Vista del Excel"};
  const rr=S.mode==="offline"?"offline":role();
  pill.className="pill role-"+rr; pill.textContent=labels[rr]+(S.viewAs?" (vista previa)":"");
  $("#sync").className="sync"+(S.mode==="live"?" on":""); $("#sync").title=S.mode==="live"?"Conectado: los cambios se ven en vivo":"Sin conexión a los datos compartidos";
  const b=$("#banner");
  if(S.mode==="offline") b.innerHTML=`<div class="banner">Estás viendo el planning tal como viene del Excel. Abre esta página desde tu cuenta de claude.ai para aprobar, comentar o editar.</div>`;
  else if(S.role==="inside") b.innerHTML=`<div class="banner" style="background:var(--sunk)"><span>${S.viewAs?"Estás viendo la plataforma como la ve el cliente.":"Así ve el cliente la plataforma: solo aprueba, pide cambios y comenta."}</span><button class="btn" id="toggleView">${S.viewAs?"Volver a la vista de Inside":"Ver como cliente"}</button></div>`;
  else b.innerHTML="";
}
document.addEventListener("click",e=>{if(e.target.closest("#toggleView")){S.viewAs=S.viewAs?null:"cliente";render();if(S.openId) renderSheet()}});
function renderView(){
  renderSummary();
  if(S.mode==="loading"){$("#view").innerHTML=`<div class="empty"><h3>Cargando el calendario…</h3><p>Conectando con los datos compartidos.</p></div>`;return}
  if(!S.posts.size){
    $("#view").innerHTML=`<div class="empty"><h3>Todavía no hay publicaciones</h3><p>Aquí aparecerán las piezas del planning con su fecha, estado y preview.</p>${canEdit()?`<p><button class="btn primary" id="importSeed">Cargar planning de octubre 2026</button></p>`:""}</div>`;return}
  if(S.f.view==="list") renderList(); else if(S.f.view==="grid") renderGrid(); else if(S.f.view==="gaps"&&role()==="inside") renderGaps(); else renderCal();
}
function render(){renderTop();renderFilters();renderView()}
$("#prevM").onclick=()=>{let [y,m]=S.month;m--;if(m<0){m=11;y--}S.month=[y,m];render()};
$("#nextM").onclick=()=>{let [y,m]=S.month;m++;if(m>11){m=0;y++}S.month=[y,m];render()};
let lastNarrow=null; window.addEventListener("resize",()=>{const n=window.matchMedia("(max-width:760px)").matches;if(n!==lastNarrow){lastNarrow=n;if(S.f.view==="cal") renderView()}});

function pickMonth(){
  const now=new Date(); const pre=`${now.getFullYear()}-${pad(now.getMonth()+1)}`;
  const ds=[...S.posts.values()].map(p=>p.fecha).filter(Boolean).sort();
  if(!ds.length||ds.some(d=>d.startsWith(pre))) return [now.getFullYear(),now.getMonth()];
  const d=parseISO(ds.find(x=>x>=pre)||ds[ds.length-1]); return [d.getFullYear(),d.getMonth()];
}
function normalize(d){return {imagenes:[],paises:[],copy:"",headline:"",campana:"",hora:"",fecha:"",estado:"Sin iniciar",formato:"Estático",tipo:"feed",linea:"Otra",region:"CENTRO",...d}}

/* ============ arranque */
async function loadSeed(){const r=await fetch("seed-octubre-2026.json");if(!r.ok) throw new Error("seed");return r.json()}
async function offline(){
  S.mode="offline";
  try{const seed=await loadSeed();for(const d of seed) S.posts.set(d.id,normalize(d))}catch(e){}
  S.month=pickMonth(); render();
}
document.addEventListener("click",async e=>{
  if(!e.target.closest("#importSeed")) return;
  const b=e.target.closest("#importSeed"); b.disabled=true;
  try{const seed=await loadSeed();let k=0;for(const d of seed){k++;b.textContent=`Cargando ${k} de ${seed.length}…`;await S.db.doc("posts/"+d.id).set(d)}toast("Planning cargado")}
  catch(err){toast("No se pudo cargar el planning.");b.disabled=false;b.textContent="Cargar planning de octubre 2026"}
});
async function boot(){
  S.month=pickMonth(); render();
  const use=n=>(window.claude&&window.claude.use)?Promise.resolve(window.claude.use(n)).catch(()=>null):Promise.resolve(null);
  const [db,user,assets]=await Promise.all([use("db"),use("user"),use("assets")]);
  if(!db){await offline();return}
  S.db=db; S.user=user; S.assets=assets;
  if(user){
    try{S.myId=await user.id()}catch(e){}
    try{S.me=await user.me()}catch(e){}
    let ed=false,wr=null; try{ed=await user.canEdit()}catch(e){} try{wr=await user.can("data.write")}catch(e){}
    let own=false; try{own=await user.isOwner()}catch(e){}
    let guest=null; try{if(S.myId){const pr=await user.profiles([S.myId]);if(pr[S.myId]) guest=!!pr[S.myId].guest}}catch(e){}
    // Inside = dueña o miembros de la organización; Payless entra como invitado externo
    const inside=own||(guest===false&&wr!==false)||(guest===null&&ed);
    S.role=inside&&wr!==false?"inside":(wr===false?"lectura":"cliente");
  }else S.role="cliente";
  let first=true;
  db.collection("posts").onSnapshot(snap=>{
    const m=new Map(); for(const d of snap.docs) m.set(d.id,normalize({...d.data(),id:d.id}));
    S.posts=m; S.mode="live";
    if(first){first=false;S.month=pickMonth()}
    render(); if(S.openId) renderSheet();
  },err=>{if(!S.posts.size) offline(); else toast("Se perdió la conexión en vivo. Recarga la página.")});
  db.collection("comentarios").onSnapshot(async snap=>{
    S.comments=snap.docs.map(d=>({...d.data(),_id:d.id}));
    const ids=[...new Set(S.comments.map(c=>c.autorId).filter(Boolean))];
    if(user&&ids.length){try{S.profiles=await user.profiles(ids)}catch(e){}}
    if(S.openId) renderSheet(); renderSummary();
  },()=>{});
  setTimeout(()=>{if(S.mode==="loading") offline()},12000);
}
boot();
</script>
