<title>Calendario Payless</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: barra de marca + barra de filtros fija arriba; el mes ocupa el lienzo; la publicación se abre en una hoja con el teléfono a la izquierda y la ficha a la derecha. */
:root{
  --bg:#f6f4f1; --surface:#ffffff; --sunk:#efebe6; --line:#e2dcd4; --line-strong:#cfc6bb;
  --ink:#1e1a16; --ink-2:#5a5148; --ink-3:#8b8177;
  --accent:#ea5b0c; --accent-ink:#ffffff; --accent-soft:#fde6d8;
  --r-centro:#0f8b8d; --r-sur:#4a56c9; --r-rd:#c2366b; --r-caribe:#6d8f12;
  --ok:#1d8a4e; --ok-soft:#dcf2e5; --warn:#b7791f; --warn-soft:#fbefd6; --bad:#c43c2f; --bad-soft:#fbe1dd; --info:#3a6ccf; --info-soft:#e1e9fa;
  --done-bg:#1f7a45; --done:#14592f; --pub-bg:#c9efd6; --pub-line:#5fbf86; --pub-ink:#14593a; --pend-bg:#ffdcc2; --pend-line:#f08a3e; --pend-ink:#8a3a07; --pend:#e8700f; --pro:#7a4fd0;
  --phone:#000; --phone-ink:#f5f5f5; --ig-bg:#ffffff; --ig-ink:#111; --ig-mute:#737373; --ig-line:#efefef;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --radius:10px; --shadow:0 1px 2px rgba(30,26,22,.06),0 8px 24px rgba(30,26,22,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161311; --surface:#201c19; --sunk:#2a2522; --line:#352f2b; --line-strong:#4a423c;
  --ink:#f3ede7; --ink-2:#c3b8ad; --ink-3:#8f857b;
  --accent:#ff7a33; --accent-ink:#1a0f08; --accent-soft:#4a2614;
  --r-centro:#35b9bb; --r-sur:#8b95ff; --r-rd:#ff6fa3; --r-caribe:#a6c94a;
  --ok:#4cc884; --ok-soft:#173826; --warn:#e5b04f; --warn-soft:#3b2d12; --bad:#ff7b6d; --bad-soft:#40201c; --info:#86a8ff; --info-soft:#1d2a47;
  --ig-bg:#000; --ig-ink:#f5f5f5; --ig-mute:#a8a8a8; --ig-line:#262626;
  --done-bg:#2b8a55; --done:#5fd394; --pub-bg:#16402a; --pub-line:#2f8a57; --pub-ink:#9be3b9; --pend-bg:#4a2612; --pend-line:#c4621f; --pend-ink:#ffc49a; --pend:#ff8f3d; --pro:#a98bff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161311; --surface:#201c19; --sunk:#2a2522; --line:#352f2b; --line-strong:#4a423c;
  --ink:#f3ede7; --ink-2:#c3b8ad; --ink-3:#8f857b;
  --accent:#ff7a33; --accent-ink:#1a0f08; --accent-soft:#4a2614;
  --r-centro:#35b9bb; --r-sur:#8b95ff; --r-rd:#ff6fa3; --r-caribe:#a6c94a;
  --ok:#4cc884; --ok-soft:#173826; --warn:#e5b04f; --warn-soft:#3b2d12; --bad:#ff7b6d; --bad-soft:#40201c; --info:#86a8ff; --info-soft:#1d2a47;
  --ig-bg:#000; --ig-ink:#f5f5f5; --ig-mute:#a8a8a8; --ig-line:#262626;
  --done-bg:#2b8a55; --done:#5fd394; --pub-bg:#16402a; --pub-line:#2f8a57; --pub-ink:#9be3b9; --pend-bg:#4a2612; --pend-line:#c4621f; --pend-ink:#ffc49a; --pend:#ff8f3d; --pro:#a98bff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{padding-inline:max(16px,2vw)}

/* ---------- top bar */
.top{position:relative;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font:800 22px/1 var(--f-display);letter-spacing:-.02em}
.brand b i{font-style:normal;color:var(--accent)}
.brand span{color:var(--ink-3);font-size:13px}
.month{display:flex;align-items:center;gap:6px;margin-left:auto}
.month h1{font:700 20px/1 var(--f-display);margin:0;min-width:150px;text-align:center;text-transform:capitalize;letter-spacing:-.01em}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{border-color:var(--line-strong);color:var(--ink)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.role-inside{background:var(--accent-soft);color:var(--accent)}
.pill.role-cliente{background:var(--info-soft);color:var(--info)}
.pill.role-lectura,.pill.role-offline{background:var(--sunk);color:var(--ink-2)}
.sync{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.sync.on{background:var(--ok)}

/* ---------- filter bar */
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:0 12px}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 11px;font-weight:600;font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button .dot{width:8px;height:8px;border-radius:50%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.flabel{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.fgroup{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
select.sel,input.search{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;min-width:0}
input.search{width:200px;max-width:100%}
.views{margin-left:auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--line-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--surface);border-color:var(--bad);color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.summary{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);padding-block:0 10px}
.summary b{color:var(--ink);font-variant-numeric:tabular-nums}
.summary .warn b{color:var(--bad)}
.banner{margin:10px 0 0;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--ink);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ---------- main area */
main{padding-block:16px 40px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}
.layout.nobacklog{grid-template-columns:minmax(0,1fr)}

/* calendar grid */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.cal-head,.cal-body{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-head div{padding:8px 10px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--line)}
.day{min-height:132px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0;position:relative}
.day:nth-child(7n){border-right:0}
.day.out{background:var(--sunk)}
.day.out .dnum{color:var(--ink-3)}
.day.today .dnum{background:var(--accent);color:var(--accent-ink)}
.day.drop{outline:2px dashed var(--accent);outline-offset:-3px;background:var(--accent-soft)}
.dhead{display:flex;align-items:center;justify-content:space-between}
.dnum{font:600 12px/1 var(--f-mono);padding:4px 6px;border-radius:6px;color:var(--ink-2)}
.dadd{opacity:0;border:0;background:transparent;color:var(--ink-3);font-size:16px;line-height:1;padding:0 4px}
.day:hover .dadd{opacity:1}
.dpaste{border:1px dashed var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:5px;font:700 10px/1 var(--f-body);padding:3px 6px;margin-left:auto;margin-right:2px}
.dpaste:hover{background:var(--accent);color:var(--accent-ink)}
.clipbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--radius);padding:8px 12px;margin-bottom:12px;font-size:13px}
.clipbar b{font-weight:700}
.clipbar .sp{flex:1}
.clipbar select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:4px 6px;font:inherit}
.clipbar input{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:4px 6px;font:inherit}
.pc.multi{position:relative;border-left-color:transparent}
.pc.multi::before{content:"";position:absolute;left:-3px;top:-1px;bottom:-1px;width:3px;border-radius:6px 0 0 6px;background:var(--rg)}
.selbar{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-strong);border-radius:999px;padding:6px 8px 6px 16px;box-shadow:var(--shadow);z-index:70;font-size:13px}
.selbar kbd{font:600 10px var(--f-mono);opacity:.7;margin-left:4px}
.pc.clip{outline:2px dashed var(--accent);outline-offset:1px}
.pc.sel{box-shadow:0 0 0 2px var(--ink);border-color:var(--ink)}
.day.sel{background:color-mix(in srgb,var(--accent) 8%,var(--surface));box-shadow:inset 0 0 0 2px var(--accent)}
.selhint{font-size:12px;color:var(--ink-3);margin:-4px 0 10px}
.selhint kbd{font:600 11px var(--f-mono);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface);color:var(--ink-2)}
.more{border:0;background:transparent;color:var(--ink-2);font-size:12px;font-weight:600;text-align:left;padding:2px 4px}
.more:hover{color:var(--accent)}

/* post chip */
.pc{display:grid;grid-template-columns:28px minmax(0,1fr);gap:6px;align-items:center;border:1px solid var(--line);border-left:3px solid var(--rc,var(--ink-3));background:var(--surface);border-radius:6px;padding:3px 5px 3px 4px;text-align:left;width:100%;min-width:0;cursor:pointer}
.pc:hover{border-color:var(--line-strong);border-left-color:var(--rc)}
.pc[draggable="true"]{cursor:grab}
.pc.dragging{opacity:.4}
.pc .th{width:28px;height:28px;border-radius:4px;background:var(--sunk) center/cover no-repeat;display:grid;place-items:center;font-size:12px;color:var(--ink-3);overflow:hidden}
.pc .th.story{border-radius:50%;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--accent)}
.pc .t1{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden}
.pc .t2{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sd{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ink-3)}
.st-sin{--s:var(--ink-3)} .st-des{--s:var(--ink-2)} .st-env{--s:var(--pend)} .st-apr{--s:var(--info)} .st-cam{--s:var(--bad)} .st-pro{--s:var(--ok)} .st-pub{--s:var(--done)}
/* fondo por estado: verde = publicado, naranja = esperando al cliente, blanco = en desarrollo Inside */
.pc.cs-pub{background:var(--pub-bg);border-color:var(--pub-line)} .pc.cs-pub .t1{color:var(--pub-ink)}
.pc.cs-done{background:var(--done-bg);border-color:var(--done)} .pc.cs-done .t1,.pc.cs-done .t2{color:#fff} .pc.cs-done .sd{background:#fff}
.pc.cs-env{background:var(--pend-bg);border-color:var(--pend-line)} .pc.cs-env .t1{color:var(--pend-ink)}
table.list tr.cs-pub td{background:var(--pub-bg)} table.list tr.cs-done td{background:var(--done-bg);color:#fff} table.list tr.cs-done .badge{background:#fff} table.list tr.cs-done td div{color:#e3f5ea!important} table.list tr.cs-done .qhora{color:var(--ink)} table.list tr.cs-env td{background:var(--pend-bg)}
.legend .cs{width:14px;height:10px;border-radius:3px;border:1px solid var(--line-strong);background:var(--surface)}
.legend .cs.done{background:var(--done-bg);border-color:var(--done)} .legend .cs.pub{background:var(--pub-bg);border-color:var(--pub-line)} .legend .cs.env{background:var(--pend-bg);border-color:var(--pend-line)}
.chip[data-treg][aria-pressed="true"],.chip[data-clipreg][aria-pressed="true"]{background:var(--rc);border-color:var(--rc);color:#fff}
.fmts{display:flex;flex-wrap:wrap;gap:6px}
.fmts .chip{font-size:13px;padding:5px 12px}
.fmts .chip .n{font:600 10px var(--f-mono);opacity:.7;margin-left:4px}
.sd{background:var(--s)}
.fmt{font-family:var(--f-mono);font-size:10px;letter-spacing:.02em}

/* backlog */
.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 150px)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.panel h3{margin:0 0 4px;font:700 15px/1.2 var(--f-display)}
.panel p.sub{margin:0 0 10px;color:var(--ink-3);font-size:12px}
.backlog{display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow:auto;padding-right:2px}
.backlog.drop{outline:2px dashed var(--accent);outline-offset:2px}
.legend{display:grid;gap:6px;font-size:12px;color:var(--ink-2)}
.legend div{display:flex;align-items:center;gap:8px}
.legend .sw{width:12px;height:12px;border-radius:3px}

/* agenda / list */
.agenda{display:flex;flex-direction:column;gap:14px}
.aday h4{margin:0 0 6px;font:700 14px/1.2 var(--f-display);display:flex;gap:8px;align-items:baseline}
.aday h4 span{font:500 12px var(--f-body);color:var(--ink-3)}
.aday .items{display:grid;gap:6px}
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto}
table.list{border-collapse:collapse;width:100%;min-width:980px;font-size:13px}
table.list th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:9px 10px;border-bottom:1px solid var(--line)}
table.list td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.list tr{cursor:pointer}
table.list tr:hover td{background:var(--sunk)}
.qhora{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 6px;font:inherit;width:110px}
.rtag{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px}
.rtag i{width:8px;height:8px;border-radius:2px;background:var(--rc)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;background:color-mix(in srgb,var(--s) 14%,transparent);color:var(--s);white-space:nowrap}
.badge .sd{background:var(--s)}

/* grid (IG profile) view */
.gridview{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:24px;align-items:start}
.gridnote{color:var(--ink-2);font-size:13px;max-width:52ch}
.gridnote h2{font:800 26px/1.1 var(--f-display);letter-spacing:-.02em;margin:0 0 8px;color:var(--ink)}

/* ---------- phone + Instagram */
.phone{background:var(--phone);border-radius:42px;padding:12px;box-shadow:var(--shadow);width:100%;max-width:390px;margin-inline:auto}
.screen{background:var(--ig-bg);color:var(--ig-ink);border-radius:32px;overflow:hidden;position:relative;font-family:-apple-system,"Helvetica Neue","Segoe UI",Roboto,sans-serif;font-size:13.5px}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:10px 22px 4px;font-weight:600;font-size:13px}
.igtop{display:flex;align-items:center;justify-content:space-between;padding:6px 14px 8px;border-bottom:1px solid var(--ig-line)}
.igtop b{font:700 19px/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.01em}
.ighead{display:flex;align-items:center;gap:10px;padding:10px 12px}
.av{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font:800 15px/1 var(--f-display);flex:none}
.av.ring{box-shadow:0 0 0 2px var(--ig-bg),0 0 0 4px #e1306c}
.ighead .h{line-height:1.2;min-width:0}
.ighead .h b{font-size:13.5px}
.ighead .h small{display:block;color:var(--ig-mute);font-size:12px}
.ighead .dots{margin-left:auto;font-weight:700;letter-spacing:1px}
.media{position:relative;background:#111;overflow:hidden;touch-action:pan-y}
.media.r45{aspect-ratio:4/5}
.media.r916{aspect-ratio:9/16}
.track{display:flex;height:100%;transition:transform .3s ease}
.track img,.track .ph{flex:0 0 100%;width:100%;height:100%;object-fit:cover;display:block}
.cnt{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:3px 8px;border-radius:999px;font-weight:600}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:0;background:rgba(255,255,255,.85);color:#111;display:grid;place-items:center;font-weight:800}
.nav.prev{left:8px}.nav.next{right:8px}
.igdots{display:flex;justify-content:center;gap:4px;padding:8px 0 0;min-height:14px}
.igdots i{width:6px;height:6px;border-radius:50%;background:var(--ig-line)}
.igdots i.on{background:#0095f6}
.igact{display:flex;gap:14px;padding:8px 12px 4px;font-size:22px;line-height:1}
.igact .sp{margin-left:auto}
.igact svg{width:24px;height:24px;stroke:var(--ig-ink);fill:none;stroke-width:1.8}
.igcap{padding:2px 12px 14px;font-size:13.5px;line-height:1.4;white-space:pre-wrap;word-break:break-word}
.igcap .prov{display:block;margin-top:6px;color:var(--ig-mute);font-size:11.5px;font-style:italic}
.igcap .tm{display:block;margin-top:6px;color:var(--ig-mute);font-size:11px;text-transform:uppercase;letter-spacing:.02em}
.igmore{color:var(--ig-mute);border:0;background:none;padding:0}
.ph{display:flex!important;flex-direction:column;justify-content:flex-end;gap:8px;padding:22px;background:var(--accent);color:#fff;text-align:left}
.ph .k{font:600 11px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.ph .phl{font:800 clamp(22px,7vw,30px)/1.02 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.ph .pend{align-self:flex-start;background:rgba(0,0,0,.25);border-radius:999px;padding:3px 9px;font:600 11px var(--f-body)}
.ph .sig{margin-top:6px;font:700 13px var(--f-display);opacity:.9}
.ph.promo{background:#d73a14}
.ph.kids{background:#1b8f8a}
.ph.nl{background:#7d4b8f}
/* story */
.story .media{border-radius:0}
.stbars{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:3px;z-index:2}
.stbars i{flex:1;height:2.5px;border-radius:2px;background:rgba(255,255,255,.4)}
.stbars i.on{background:#fff}
.sthead{position:absolute;top:18px;left:10px;right:10px;display:flex;align-items:center;gap:8px;color:#fff;z-index:2;font-size:13px;text-shadow:0 1px 2px rgba(0,0,0,.5)}

/* profile */
.prof{padding:10px 14px 4px}

.prof .bio b{display:block}
.hls{display:flex;gap:12px;padding:12px 14px;overflow-x:auto}
.hl{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;flex:none;width:62px;border:0;background:none;color:var(--ig-ink)}
.hl span{width:58px;height:58px;border-radius:50%;background:#333 center/cover;box-shadow:0 0 0 2px var(--ig-bg),0 0 0 3.5px #e1306c;display:grid;place-items:center;color:#fff;font:800 14px var(--f-display)}

.gtabs{display:flex;border-top:1px solid var(--ig-line)}

.gtabs div.on{color:var(--ig-ink);box-shadow:inset 0 -1.5px 0 var(--ig-ink)}
.igrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.tile{position:relative;aspect-ratio:3/4;background:#222 center/cover no-repeat;border:0;padding:0;overflow:hidden}
.tile .ph{position:absolute;inset:0;padding:8px 8px 24px;gap:3px;overflow:hidden}
.tile .ph .pend{font-size:9px;padding:2px 6px}
.tile .ph .k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ph .sig{display:none}
.tile .ph .phl{font-size:clamp(11px,3.2vw,14px);line-height:1.05;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.tile .ph .k{font-size:8px}
.tile .ic{position:absolute;top:6px;right:6px;width:16px;height:16px;fill:#fff;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.tile .dt{position:absolute;left:5px;bottom:5px;background:rgba(0,0,0,.6);color:#fff;font:600 10px var(--f-mono);padding:2px 5px;border-radius:4px}
.tile.ghost{opacity:.55}
.tile.noart{background:#2a2a2a}
.tile .na{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:8px;text-align:left;color:#cfcfcf}
.tile .na-k{font:600 9px/1.1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .na-h{font:700 clamp(10px,2.6vw,13px)/1.1 var(--f-display);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.tile .na-u{font:600 9px var(--f-body);color:#fff;opacity:0;transition:opacity .15s}
.tile[data-tileup]:hover .na-u,.tile.over .na-u{opacity:.9}
.tile.over{outline:3px solid var(--accent);outline-offset:-3px}
.tile.hl-on{outline:3px solid var(--accent);outline-offset:-3px;z-index:1}
.tile.hl-on::after{content:"Esta pieza";position:absolute;top:6px;left:6px;background:var(--accent);color:#fff;font:700 10px var(--f-body);padding:2px 6px;border-radius:4px}
.gridview.big{grid-template-columns:minmax(0,680px) minmax(0,1fr)}

.gridview.big .tile .dt{font-size:12px}
.pvmode{align-self:center}
.fbcover{aspect-ratio:820/312;background:#ddd;overflow:hidden;position:relative}
.fbcover img{width:100%;height:100%;object-fit:cover;display:block}

.fbprof{display:flex;gap:10px;align-items:center;padding:10px 12px;margin-top:-22px;position:relative}
.fbprof .av{width:56px;height:56px;font-size:24px}
.fbprof small{display:block;color:var(--ig-mute);font-size:12px}
.ph.emptym{background:#e9e6e2;color:#6d655d;justify-content:center;align-items:center;text-align:center;gap:6px;padding:24px;font:500 12.5px/1.4 var(--f-body)}
.ph.emptym b{font:700 15px var(--f-display);color:#3d3731}
.ph.emptym .em-ic{width:44px;height:44px;border-radius:50%;border:2px dashed #a99f95;display:grid;place-items:center;font-size:22px;color:#8b8177}
.gtabs button{flex:1;border:0;background:none;padding:9px 0;font-size:12px;color:var(--ig-mute);font-weight:600}
.gtabs button.on{color:var(--ig-ink);box-shadow:inset 0 -1.5px 0 var(--ig-ink)}
.igrid.stories .tile{aspect-ratio:9/16}
.gapsview{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
.vh{font:800 22px/1.1 var(--f-display);letter-spacing:-.01em;margin:0 0 4px}
.gaps .sub,.clientinfo .sub{color:var(--ink-3);font-size:13px;margin:0 0 12px}
.gap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px}
.gap summary{display:flex;gap:12px;align-items:center;padding:10px 12px;cursor:pointer;list-style:none}
.gap summary::-webkit-details-marker{display:none}
.gap summary small{display:block;color:var(--ink-3);font-size:12px;font-weight:400}
.gn{min-width:34px;height:28px;border-radius:8px;background:var(--bad-soft);color:var(--bad);font:700 14px var(--f-mono);display:grid;place-items:center;padding:0 6px}
.gn.zero{background:var(--ok-soft);color:var(--ok)}
.gap ul{list-style:none;margin:0;padding:0 8px 8px;display:grid;gap:4px;max-height:420px;overflow:auto}
.gi{display:grid;grid-template-columns:86px 90px minmax(0,1fr);gap:4px 10px;width:100%;text-align:left;border:1px solid var(--line);border-left:3px solid var(--rc);background:var(--bg);border-radius:6px;padding:6px 8px;font-size:12.5px}
.gi:hover{border-color:var(--line-strong)}
.gi .gc{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.gi .gx:empty{display:none}
.callout{background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.cireg{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--rc,var(--line-strong));border-radius:var(--radius);padding:12px 14px;margin-bottom:12px}
.cireg h3{margin:0 0 8px;font:700 16px var(--f-display)}
.cireg h4{margin:12px 0 6px;font:700 13px var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.cireg dl{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;margin:0 0 10px;font-size:13px}
.cireg dt{color:var(--ink-3);font-weight:600}
.cireg dd{margin:0}
table.mini{border-collapse:collapse;width:100%;font-size:12.5px;min-width:420px}
table.mini th,table.mini td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
table.mini th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.sheet .left .screen{max-height:calc(100vh - 150px);overflow-y:auto}
.emptygrid{padding:30px 16px;text-align:center;color:var(--ig-mute);font-size:13px}

/* ---------- sheet (post detail) */
.scrim{position:fixed;inset:0;background:rgba(20,16,12,.55);z-index:50;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(1080px,100%);height:100%;overflow:auto;display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:0;box-shadow:var(--shadow)}
.sheet .left{background:var(--sunk);padding:20px 16px 30px;display:flex;flex-direction:column;gap:12px;align-items:center;border-right:1px solid var(--line)}
.sheet .right{padding:18px 22px 40px;min-width:0}
.sheethead{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.sheethead h2{margin:4px 0 0;font:800 24px/1.1 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.sheethead .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--ink-2);font-size:13px}
.sheethead .x{margin-left:auto}
.pvtabs{display:flex;gap:4px;justify-content:center}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:14px 0 14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:600;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
.f label,.f .lb{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.f textarea{resize:vertical;min-height:70px;line-height:1.45}
.f .ro{padding:2px 0;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.f .ro.empty{color:var(--ink-3)}
.f .hint{font-size:12px;color:var(--ink-3)}
.saved{font-size:12px;color:var(--ok);min-height:16px}
.approve{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);margin-bottom:14px}
.approve .q{flex:1 1 220px;font-weight:600}
.approve textarea{flex:1 1 100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);min-height:60px}
.thread{display:flex;flex-direction:column;gap:10px}
.cm{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px}
.cm .av{width:30px;height:30px;font-size:12px;background:var(--ink-2)}
.cm .bd{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.cm .bd header{display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--ink-3);flex-wrap:wrap}
.cm .bd header b{color:var(--ink);font-size:13px}
.cm .bd p{margin:4px 0 0;white-space:pre-wrap;word-break:break-word}
.cm.apr .bd{border-color:var(--ok)} .cm.cam .bd{border-color:var(--bad)}
.newcm{display:flex;gap:8px;margin-top:12px;align-items:flex-end}
.newcm textarea{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);min-height:44px;min-width:0}
.arte{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.arte figure{margin:0;position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--sunk)}
.arte img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
.arte figcaption{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;font-size:11px;color:var(--ink-3)}
.arte figcaption button{border:0;background:none;color:var(--ink-3);padding:2px 4px}
.arte figcaption button:hover{color:var(--accent)}
.arte figcaption button[data-rmask]:hover{color:var(--bad)}
.rmask{position:absolute;inset:0;background:color-mix(in srgb,var(--surface) 92%,transparent);display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;padding:8px;text-align:center;font-size:12px;font-weight:600}
.drop-zone{display:block;cursor:pointer;border:1.5px dashed var(--line-strong);border-radius:10px;padding:18px;text-align:center;color:var(--ink-2);margin-top:14px}
.drop-zone.over{border-color:var(--accent);background:var(--accent-soft)}
.src{margin-top:18px;font-size:12px;color:var(--ink-3)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;border-radius:8px;background:var(--bad-soft);margin-top:10px}
.toast .undo{margin-left:12px;border:0;background:transparent;color:var(--accent);font:700 13px var(--f-body);text-decoration:underline;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:13px;z-index:80;box-shadow:var(--shadow)}
.empty{padding:40px 20px;text-align:center;color:var(--ink-2);background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--radius)}
.empty h3{font:700 18px var(--f-display);margin:0 0 6px;color:var(--ink)}

@media (min-width:901px){.top{position:sticky;top:env(safe-area-inset-top,0px)}}
@media (max-width:1100px){.layout{grid-template-columns:minmax(0,1fr)}.side{position:static}.backlog{max-height:none}}
@media (max-width:900px){.sheet{grid-template-columns:minmax(0,1fr)}.sheet .left{border-right:0;border-bottom:1px solid var(--line)}.gridview,.gridview.big{grid-template-columns:minmax(0,1fr)}}

@media (max-width:640px){.cireg dl{grid-template-columns:minmax(0,1fr)}.gi{grid-template-columns:minmax(0,1fr) auto}.fields{grid-template-columns:minmax(0,1fr)}.month{margin-left:0;width:100%;justify-content:space-between}.month h1{min-width:0}.views{margin-left:0}input.search{width:100%}.brand span{display:none}.phone{border-radius:34px;padding:9px}.screen{border-radius:26px}}
@media (prefers-reduced-motion:reduce){.track{transition:none}}

/* ---------- medios: línea de tiempo */
.seg.sect button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;max-height:calc(100vh - 250px)}
.tl{--tl-label:280px;--tl-day:30px;min-width:calc(var(--tl-label) + 31*var(--tl-day))}
.tl-row{display:grid;position:relative;border-bottom:1px solid var(--line);min-height:44px;align-items:center}
.tl-row>*{grid-row:1}
.tl-head{position:sticky;top:0;z-index:3;background:var(--surface);min-height:38px}
.tl-lab{grid-column:1;position:sticky;left:0;z-index:2;background:var(--surface);border:0;border-right:1px solid var(--line);text-align:left;padding:6px 10px;height:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:6px;align-items:center;min-width:0;font:inherit;color:inherit;cursor:pointer}
.tl-head .tl-lab{cursor:default;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center}

.tl-lab small{grid-column:2 / 4;font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tl-lab .cmb{grid-row:1;grid-column:3;font-style:normal;font:700 10px var(--f-mono);background:var(--bad);color:#fff;border-radius:999px;padding:1px 6px}
.tl-d{text-align:center;font:600 11px/1.1 var(--f-mono);color:var(--ink-2);padding:4px 0;border-left:1px solid var(--line)}
.tl-d small{display:block;font-size:9px;color:var(--ink-3)}
.tl-d.we,.tl-c.we{background:var(--sunk)}
.tl-d.today{color:var(--accent-ink);background:var(--accent)}
.tl-c{align-self:stretch;border-left:1px solid var(--line)}
.tl-c.today{box-shadow:inset 2px 0 0 var(--accent)}
.tl-bar{position:relative;z-index:1;height:28px;margin:0 2px;border-radius:6px;background:var(--surface);border:1px solid var(--line-strong);border-left:4px solid var(--rc);display:flex;align-items:center;min-width:0;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08);user-select:none;touch-action:none}
.tl-bar[style*="--rg"]{border-left-color:transparent;background-image:none}
.tl-bar[style*="--rg"]::before{content:"";position:absolute;left:-4px;top:-1px;bottom:-1px;width:4px;border-radius:6px 0 0 6px;background:var(--rg)}
.tl-bar.cs-env{background:var(--pend-bg);border-color:var(--pend-line)} .tl-bar.cs-pub{background:var(--pub-bg);border-color:var(--pub-line)} .tl-bar.cs-done{background:var(--done-bg);border-color:var(--done);color:#fff}
.tl-bar.cutl{border-top-left-radius:0;border-bottom-left-radius:0} .tl-bar.cutr{border-top-right-radius:0;border-bottom-right-radius:0;border-right-style:dashed}
.tl-bar .bt{display:flex;align-items:center;gap:5px;padding:0 8px;font:600 11px var(--f-mono);white-space:nowrap;overflow:hidden;flex:1;min-width:0}
.tl-bar.short .bt{position:absolute;left:calc(100% + 4px);overflow:visible;padding:0;color:var(--ink-2)}
.tl-bar.short .bt .sd{display:none}
.tl-bar .hd{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;z-index:2}

.tl-bar:hover .hd{background:color-mix(in srgb,var(--accent) 35%,transparent);border-radius:4px}
.tl-hint{z-index:1;font-size:11px;color:var(--ink-3);padding-left:10px;pointer-events:none;font-style:italic}
.tl-group{position:sticky;left:0;padding:8px 10px;font-size:12px;color:var(--ink-2);background:var(--sunk);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.tl-group.warn{color:var(--bad)}
.mz{font:700 10px var(--f-mono);letter-spacing:.04em;padding:2px 6px;border-radius:4px;color:#fff;background:var(--ink-2);text-transform:uppercase;white-space:nowrap}
.mz-atl{background:#7a4fd0} .mz-ecommerce{background:#0f8b8d} .mz-digital{background:#3a6ccf}
.mprev{position:relative;width:100%;max-width:360px;background:#000;border-radius:14px;overflow:hidden;min-height:200px;display:grid;place-items:center}

.mthumbs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:360px}
.mthumbs button{width:46px;height:46px;border-radius:6px;border:2px solid transparent;background:#000 center/cover no-repeat;cursor:pointer}
.mthumbs button.on{border-color:var(--accent)}
.mlegal{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;display:flex;flex-direction:column;gap:2px;color:var(--ink-2)}
.mlegal b{color:var(--ink);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.revisar{background:var(--bad-soft);border:1px solid var(--bad);border-radius:10px;padding:10px 12px;margin-bottom:12px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.revisar b{color:var(--bad)}
.artgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.artgrid figure{margin:0;background:var(--sunk);border-radius:8px;overflow:hidden}

.crep{color:var(--ink-3);font-size:12px}
/* bandeja y envío */

.envview{max-width:960px;display:flex;flex-direction:column;gap:16px}

.envd{font:700 13px var(--f-mono);display:flex;flex-direction:column}
.envd em{font:700 10px var(--f-body);font-style:normal;text-transform:uppercase;color:var(--bad)} .envd em.hoy{color:var(--accent)}

.picklist{display:flex;flex-direction:column;gap:10px;max-height:50vh;overflow:auto}

<script>
"use strict";
/* ============ constantes */
const REGIONES=[
  {id:"CENTRO",nombre:"Centroamérica",corto:"Centro",var:"--r-centro",paises:["GT","SV","HN","NI","CR"]},
  {id:"SUR",nombre:"Sur",corto:"Sur",var:"--r-sur",paises:["PA","CO","EC","PE"]},
  {id:"RD",nombre:"República Dominicana",corto:"RD",var:"--r-rd",paises:["RD"]},
  {id:"CARIBE",nombre:"Caribe inglés",corto:"Caribe",var:"--r-caribe",paises:["TT","JM","BB","ECI","GY","USVI"]}];
const PAIS={GT:"Guatemala",SV:"El Salvador",HN:"Honduras",NI:"Nicaragua",CR:"Costa Rica",PA:"Panamá",CO:"Colombia",EC:"Ecuador",PE:"Perú",RD:"República Dominicana",TT:"Trinidad y Tobago",JM:"Jamaica",BB:"Barbados",ECI:"Eastern Caribbean",GY:"Guyana",USVI:"Islas Vírgenes EE. UU."};
const EN_PAISES=new Set(["TT","JM","BB","ECI","GY","USVI"]);
const ESTADOS=[
  {id:"Sin iniciar",c:"st-sin"},{id:"Enviado a cliente",c:"st-env"},{id:"Programado",c:"st-pro"},{id:"Publicado",c:"st-pub"}];
const isOk=p=>p.estado==="Programado"||p.estado==="Publicado";
/* estados anteriores → los 3 vigentes (los datos viejos se leen así, sin reescribir la base) */
const ESTADO_MAP={"En desarrollo":"Sin iniciar","Cambios solicitados":"Sin iniciar","Aprobado":"Programado"};
const FORMATOS=["Estático","Carrusel","Reel","Historia","Portada"];
const TIPOS={feed:"Feed",historia:"Historia",promo:"Promo"};
const LINEAS=["Sneakers","Nuevas Llegadas","Kids","Halloween Kids","Comfort Plus","Aniversario TT","Promociones","Otra"];
const DOW=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const FIELDS_EDIT=["fecha","hora","estado","formato","formatos","tipo","campana","linea","serie","headline","copy","cta","idea","objetivo","tipoContenido","sku","mandatories","responsable","insumo","prioridad","link","slide","legal","estadoLegal","fase","vigencia"];

/* ============ estado */
const S={
  posts:new Map(), comments:[], profiles:{},
  mode:"loading",      // live | offline
  role:"lectura",      // inside | cliente | lectura
  viewAs:null,         // inside puede previsualizar como cliente
  me:null, myId:null,
  db:null, assets:null, user:null,
  month:null,
  f:{region:"ALL",paises:[],tipo:"ALL",linea:"ALL",estado:"ALL",q:"",view:"cal",gridPais:"GT",gridSize:"phone",onlyArt:false,desde:"2026-10-01",hasta:"2026-10-10",section:"org",matriz:"ALL"},
  openId:null, openTab:"info", pv:{slide:0}, dragId:null, medios:new Map(), series:new Map(), feedOrd:{}, openMed:null, clip:null, sel:null, sels:new Set(), selDay:null, group:null,
};
const store={get(k){try{return JSON.parse(localStorage.getItem("cpay:"+k))}catch(e){return null}},set(k,v){try{localStorage.setItem("cpay:"+k,JSON.stringify(v))}catch(e){}}};
const saved=store.get("f"); if(saved) Object.assign(S.f,saved,{q:""});
if(S.f.estado!=="ALL"&&!ESTADOS.some(e=>e.id===S.f.estado)) S.f.estado=ESTADO_MAP[S.f.estado]||"ALL";

/* ============ utilidades */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const todayISO=iso(new Date());
const cap1=s=>s.charAt(0).toUpperCase()+s.slice(1);
const region=id=>REGIONES.find(r=>r.id===id)||REGIONES[0];
const estadoC=e=>(ESTADOS.find(x=>x.id===e)||ESTADOS[0]).c;
const colorC=e=>e==="Publicado"?"cs-done":e==="Programado"?"cs-pub":e==="Enviado a cliente"?"cs-env":"";
function horaMin(h){
  if(!h) return 24*60;
  const s=String(h).toLowerCase().replace(/\s+/g,"");
  const m=s.match(/(\d{1,2})(?::(\d{2}))?(am|pm|m)?/); if(!m) return 24*60;
  let H=+m[1],M=+(m[2]||0);
  if(m[3]==="pm"&&H<12) H+=12; if(m[3]==="am"&&H===12) H=0; if(m[3]==="m") H=12;
  return H*60+M;
}
function toHHMM(h){const m=horaMin(h);if(m>=24*60) return "";return pad(Math.floor(m/60))+":"+pad(m%60)}
function fromHHMM(v){if(!v) return "";let [H,M]=v.split(":").map(Number);const ap=H>=12?"pm":"am";const h12=H%12||12;return `${h12}:${pad(M)} ${ap}`}
function fmtDia(s,long){if(!s) return "Sin fecha"; const d=parseISO(s); const w=(d.getDay()+6)%7; return long?`${["lunes","martes","miércoles","jueves","viernes","sábado","domingo"][w]} ${d.getDate()} de ${MESES[d.getMonth()]}`:`${DOW[w]} ${d.getDate()} ${MESES[d.getMonth()].slice(0,3)}`}
function imgSrc(x){return x.startsWith("asset:")?"/_blob/"+x.slice(6):x}
function toast(msg){const r=$("#toastRoot");r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML="",2600)}
function role(){return S.viewAs||S.role}
const canEdit=()=>S.mode==="live"&&role()==="inside";
const canApprove=()=>S.mode==="live"&&(role()==="cliente"||role()==="inside");
function rv(p){return `var(${region(regsOf(p)[0]).var})`}
const ALL_PAISES=REGIONES.flatMap(r=>r.paises);
/* una publicación puede ir a varias regiones: las regiones salen de sus países */
function regsOf(p){const rs=REGIONES.filter(r=>r.paises.some(c=>(p.paises||[]).includes(c))).map(r=>r.id);return rs.length?rs:[p.region||"CENTRO"]}
function regNames(p,k="nombre"){return regsOf(p).map(id=>region(id)[k]).join(" + ")}
function whereLabel(p){const rs=regsOf(p);return rs.map(id=>{const r=region(id);const ps=p.paises.filter(c=>r.paises.includes(c));return ps.length===r.paises.length&&ps.length>1?r.corto:ps.join(" ")}).join(" · ")}
function regStripe(p){const rs=regsOf(p);if(rs.length<2) return "";const n=rs.length;return `--rg:linear-gradient(${rs.map((id,i)=>`var(${region(id).var}) ${i*100/n}% ${(i+1)*100/n}%`).join(",")})`}
function caption(p){
  if(p.copy&&p.copy.trim()) return {text:p.copy.trim(),prov:false};
  const t=[p.headline,p.cta?`👉 ${p.cta}`:""].filter(Boolean).join("\n\n");
  return {text:t||p.campana||"",prov:true};
}
function phClass(p){return p.tipo==="promo"||p.linea==="Promociones"?"promo":p.linea==="Kids"||p.linea==="Halloween Kids"?"kids":p.linea==="Nuevas Llegadas"?"nl":""}
function colLetter(n){let s="";while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s}
function slotLabel(p){return p.slot?`hoja «${p.slot.sheet}», celdas ${p.slot.cell} (fila VIEW)`:""}
function emptyMedia(p){
  const ok=isOk(p);
  if(role()!=="inside") return `<div class="ph emptym"><b>${ok?"Pieza aprobada":"Arte en producción"}</b><span>${esc(p.campana||"")}${p.headline?" · "+esc(p.headline):""}</span></div>`;
  return `<div class="ph emptym"><span class="em-ic">＋</span><b>Sin imagen</b><span>${p.slot?`Pégala en el Excel: ${esc(slotLabel(p))}`:"Esta pieza no tiene casilla de imagen en el Excel. Ubícala primero en el calendario del documento."}</span></div>`;
}
function placeholder(p,extra=""){
  const en=p.paises.every(c=>EN_PAISES.has(c));

}

const FEED_FMT=["Estático","Carrusel","Reel"];
function fmts(p){const a=(Array.isArray(p.formatos)&&p.formatos.length?p.formatos:[p.formato||"Estático"]).filter(f=>FORMATOS.includes(f));return a.length?FORMATOS.filter(f=>a.includes(f)):["Estático"]}
function isStory(p){return fmts(p).includes("Historia")}
function feedFmt(p){return fmts(p).find(f=>FEED_FMT.includes(f))||""}
function fmtLabel(p){return fmts(p).join(" + ")}
function fmtAbbr(p){return fmts(p).map(f=>FMT_ABBR[f]).join("·")}
function pvFmt(p){const a=fmts(p);return a.includes(S.pv.fmt)?S.pv.fmt:a[0]}
const FMT_ABBR={"Estático":"POST","Carrusel":"CARR","Reel":"REEL","Historia":"HIST","Portada":"PORT"};

/* ============ filtros */
function matches(p,opts={}){
  const f=S.f;
  if(f.region!=="ALL"&&!regsOf(p).includes(f.region)) return false;
  if(f.paises.length&&!p.paises.some(c=>f.paises.includes(c))) return false;
  if(!opts.ignoreTipo&&f.tipo!=="ALL"&&p.tipo!==f.tipo) return false;
  if(f.linea!=="ALL"&&p.linea!==f.linea) return false;
  if(f.estado!=="ALL"&&p.estado!==f.estado) return false;
  if(!aprobMatch(p)) return false;
  if(p.fecha&&((f.desde&&p.fecha<f.desde)||(f.hasta&&p.fecha>f.hasta))) return false;
  if(f.q){const q=f.q.toLowerCase();const hay=[p.campana,p.headline,p.copy,p.serie,p.idea,p.sku,p.fase,p.grupo,p.paises.join(" ")].join(" ").toLowerCase();if(!hay.includes(q)) return false}
  return true;
}
function isDraft(p){return !p.campana&&!p.headline&&!(p.imagenes||[]).length}
function visible(){return [...S.posts.values()].filter(p=>matches(p)&&!(role()!=="inside"&&isDraft(p)))}
function sortPosts(a,b){return (a.fecha||"9").localeCompare(b.fecha||"9")||horaMin(a.hora)-horaMin(b.hora)||a.region.localeCompare(b.region)}
function persistF(){store.set("f",{...S.f,q:""})}

  const mz=e.target.closest("[data-matriz]"); if(mz){const v=mz.dataset.matriz;let a=selMz();if(v==="ALL") a=[]; else {a=a.includes(v)?a.filter(x=>x!==v):[...a,v];if(a.length===MATRICES.length) a=[]}S.f.matrices=a;persistF();render();return}
  const t=e.target.closest("[data-region],[data-pais],[data-tipo],[data-view]"); if(!t||!t.closest("#filters")) return;
  const f=S.f;
  if(t.dataset.region){f.region=t.dataset.region;f.paises=[]; if(f.region!=="ALL"&&!region(f.region).paises.includes(f.gridPais)) f.gridPais=region(f.region).paises[0]}
  if(t.dataset.pais){const c=t.dataset.pais;f.paises=f.paises.includes(c)?f.paises.filter(x=>x!==c):[...f.paises,c]; if(f.paises.length===1) f.gridPais=f.paises[0]}

  if(t.dataset.view) f.view=t.dataset.view;
  persistF(); render();
});

/* ============ vista calendario */
function chip(p,opts={}){
  const im=p.imagenes&&p.imagenes[0];
  const story=!isFeed(p)&&isStory(p);
  const drag=canEdit()?`draggable="true"`:"";
  const where=whereLabel(p); const stripe=regStripe(p);
  return `<button class="pc ${colorC(p.estado)} ${(S.clip||[]).includes(p.id)?"clip":""} ${S.sels&&S.sels.has(p.id)?"sel":""} ${stripe?"multi":""}" data-open="${esc(p.id)}" ${drag} data-drag="${esc(p.id)}" ${p.serieId?`data-sid="${esc(p.serieId)}"`:""} style="--rc:${rv(p)};${stripe}" title="${esc((p.headline||p.campana)+" · "+p.estado)}">
    <span class="th ${story?"story":""}" style="${im?`background-image:url('${esc(imgSrc(im))}')`:""}">${im?"":p.tipo==="promo"?"%":story?"◎":"▢"}</span>
    <span style="min-width:0"><span class="t1"><span class="sd ${p.cambiosPendientes?"st-cam":estadoC(p.estado)}" ${p.cambiosPendientes?`title="El cliente pidió cambios"`:""}></span><span class="mono">${esc(p.hora||(opts.sf&&p.fechaPropuesta?"prop. "+fmtDia(p.fechaPropuesta):"—"))}</span><span class="fmt">${fmtAbbr(p)}</span>${serieTag(p)}<span>${esc(where)}</span></span>
    <span class="t2">${esc(campDisp(p)||p.headline||"Sin campaña")}${p.campSug&&canEdit()?` <i class="sugdot" title="Sugerencia de campaña por confirmar">✨</i>`:""}</span></span></button>`;
}
function monthDays(){
  const [y,m]=S.month; const first=new Date(y,m,1); const start=new Date(first); start.setDate(1-((first.getDay()+6)%7));
  const last=new Date(y,m+1,0); const end=new Date(last); end.setDate(last.getDate()+(6-((last.getDay()+6)%7)));
  const out=[]; for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)) out.push(new Date(d)); return out;
}
const expanded=new Set();
function renderCal(){
  const rank=p=>isFeed(p)?0:fmts(p).includes("Portada")?1:2;
  const vs=visible().sort((a,b)=>sortPosts(a,b)); const byDay={}; for(const p of vs) if(p.fecha)(byDay[p.fecha]=byDay[p.fecha]||[]).push(p);
  for(const k in byDay) byDay[k].sort((a,b)=>rank(a)-rank(b)||horaMin(a.hora)-horaMin(b.hora));
  const sf=vs.filter(p=>!p.fecha);
  const narrow=window.matchMedia("(max-width:760px)").matches;
  const [y,m]=S.month; const pre=`${y}-${pad(m+1)}`;
  let main;
  if(narrow){
    const days=Object.keys(byDay).filter(d=>d.startsWith(pre)).sort();
    main=days.length?`<div class="agenda">${days.map(d=>`<section class="aday"><h4>${cap1(fmtDia(d,true))} <span>${byDay[d].length} publicaciones</span></h4><div class="items">${byDay[d].map(p=>chip(p)).join("")}</div></section>`).join("")}</div>`
      :emptyMonth();
  }else{
    const LIM=4;
    main=`<div class="cal"><div class="cal-head">${DOW.map(d=>`<div>${d}</div>`).join("")}</div><div class="cal-body">${monthDays().map(d=>{
      const k=iso(d); const ps=byDay[k]||[]; const out=d.getMonth()!==m; const show=expanded.has(k)?ps:ps.slice(0,LIM);
      return `<div class="day ${out?"out":""} ${k===todayISO?"today":""} ${S.selDay===k?"sel":""}" data-day="${k}"><div class="dhead"><span class="dnum">${d.getDate()}</span>${canEdit()&&clipIds().length?`<button class="dpaste" data-paste="${k}" title="Pegar la publicación copiada el ${fmtDia(k,true)}">Pegar</button>`:""}${canEdit()?`<button class="dadd" data-new="${k}" aria-label="Nueva publicación el ${fmtDia(k,true)}">＋</button>`:""}</div>
      ${show.map(p=>chip(p)).join("")}${ps.length>LIM?`<button class="more" data-expand="${k}">${expanded.has(k)?"Ver menos":`+${ps.length-LIM} más`}</button>`:""}</div>`}).join("")}</div></div>`;
  }
  const side=`<aside class="side">
    ${role()==="inside"?`<section class="panel"><h3>Por asignar fecha <span style="font:600 13px var(--f-mono);color:var(--ink-3)">${sf.length}</span></h3><p class="sub">Piezas sin fecha. Las que vienen de la parrilla con fecha propuesta ya se ubicaron solas en su día.${canEdit()?" Arrástralas a un día, o vincúlalas desde la ficha de un post.":""}</p>
      <div class="backlog" data-day="">${sf.length?sf.map(p=>chip(p,{sf:true})).join(""):`<p class="sub" style="margin:0">Nada pendiente con estos filtros.</p>`}</div></section>`:""}
    <section class="panel"><h3>Cómo leer el calendario</h3><div class="legend">
      ${REGIONES.map(r=>`<div><span class="sw" style="background:var(${r.var})"></span>${r.nombre}</div>`).join("")}
      <div style="margin-top:4px"></div>
      <div><span class="cs done"></span><span><b>Verde oscuro</b>: publicado</span></div>
      <div><span class="cs pub"></span><span><b>Verde</b>: programado (aprobado por el cliente)</span></div>
      <div><span class="cs env"></span><span><b>Naranja</b>: esperando aprobación del cliente</span></div>
      <div><span class="cs"></span><span><b>Blanco</b>: sin iniciar / en desarrollo en Inside</span></div>
      <div style="margin-top:4px"></div>
      ${ESTADOS.map(e=>`<div><span class="sd ${e.c}" style="width:9px;height:9px"></span>${e.id}</div>`).join("")}
      <div><span class="sd st-cam" style="width:9px;height:9px"></span>Punto rojo: el cliente pidió cambios</div>
      <div style="margin-top:4px;color:var(--ink-3)">Las historias llevan aro naranja. POST, CARR, REEL, HIST y PORT indican los formatos; una pieza puede salir en varios.</div>
    </div></section></aside>`;
  $("#view").innerHTML=`${clipBar()}${selectMode()&&!S.clip?`<p class="selhint"><b>Clic</b> selecciona · <b>Ctrl/Shift + clic</b> suma varias · <kbd>Ctrl</kbd>+<kbd>A</kbd> todas las del día · <b>doble clic</b> la abre · <kbd>Ctrl</kbd>+<kbd>C</kbd> copia · clic en un día y <kbd>Ctrl</kbd>+<kbd>V</kbd> pega · <kbd>Supr</kbd> elimina · <kbd>Ctrl</kbd>+<kbd>Z</kbd> deshace</p>`:""}<div class="layout">${main}${side}</div>`;
}

function countryFeed(c,useFilters){
  const [y,m]=S.month; const pre=`${y}-${pad(m+1)}`;
  const all=[...S.posts.values()].filter(p=>p.paises.includes(c)&&!(role()!=="inside"&&isDraft(p))&&(!useFilters||matches({...p,paises:[c]},{ignoreTipo:true})));
  const feed=all.filter(p=>isFeed(p)&&p.fecha&&p.fecha<=`${pre}-31`).sort((a,b)=>sortPosts(b,a));
  const stories=all.filter(p=>isStory(p)&&p.fecha&&p.fecha.startsWith(pre)).sort(sortPosts);
  return {feed,stories,pre,m};
}
function isFeed(p){return fmts(p).some(f=>FEED_FMT.includes(f))}
function handleOf(c){return `payless${c==="RD"?"rd":"."+c.toLowerCase()}`}

function loadScript(src){return new Promise((ok,ko)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
document.addEventListener("click",e=>{if(!e.target.closest("[data-xlsx]")) return;let inp=$("#xlsxIn");if(!inp){inp=document.createElement("input");inp.type="file";inp.id="xlsxIn";inp.accept=".xlsx";inp.hidden=true;document.body.appendChild(inp);inp.addEventListener("change",()=>{if(inp.files[0]) importXlsx(inp.files[0]);inp.value=""})}inp.click()});
const FRAME={"Carrusel":0.8,"Reel":0.8,"Historia":0.5625,"Estático":0.8,"Portada":2.6};
async function sha(buf){const h=await crypto.subtle.digest("SHA-256",buf);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join("")}
async function frames(blob,fmt){
  const bmp=await createImageBitmap(blob); const ratio=bmp.width/bmp.height; const exp=FRAME[fmt]||0.8;
  let n=Math.round(ratio/exp); if(n<2||ratio<exp*1.5) n=1;
  const out=[]; const fw=bmp.width/n;
  for(let i=0;i<n;i++){const c=document.createElement("canvas");c.width=Math.round(fw);c.height=bmp.height;c.getContext("2d").drawImage(bmp,Math.round(i*fw),0,Math.round(fw),bmp.height,0,0,c.width,c.height);out.push(await new Promise(r=>c.toBlob(r,"image/jpeg",0.88)))}
  return out;
}
function kids(el,name){return [...el.children].filter(c=>c.localName===name)}
function desc(el,name){return [...el.getElementsByTagName("*")].filter(c=>c.localName===name)}
async function importXlsx(file){
  if(!S.assets){toast("Necesitas permiso de edición para actualizar imágenes.");return}
  toast("Leyendo el Excel…");
  try{
    if(!window.JSZip) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
    const zip=await JSZip.loadAsync(file); const P=new DOMParser();
    const xml=async p=>{const f=zip.file(p);return f?P.parseFromString(await f.async("string"),"application/xml"):null};
    const rels=async p=>{const d=await xml(p);const m={};if(d) for(const r of desc(d,"Relationship")) m[r.getAttribute("Id")]=r.getAttribute("Target");return m};
    const resolve=(base,t)=>{if(t.startsWith("/")) return t.slice(1);const parts=base.split("/");parts.pop();for(const seg of t.split("/")){if(seg==="..")parts.pop();else if(seg!==".")parts.push(seg)}return parts.join("/")};
    const wb=await xml("xl/workbook.xml"); const wbr=await rels("xl/_rels/workbook.xml.rels");
    const anchors=[];
    for(const sh of desc(wb,"sheet")){
      const name=sh.getAttribute("name"); const rid=[...sh.attributes].find(a=>a.localName==="id").value;
      const sp=resolve("xl/workbook.xml",wbr[rid]); const sr=await rels(sp.replace(/([^/]+)$/,"_rels/$1.rels"));
      for(const t of Object.values(sr)){ if(!/drawings\//.test(t)) continue;
        const dp=resolve(sp,t); const d=await xml(dp); if(!d) continue; const dr=await rels(dp.replace(/([^/]+)$/,"_rels/$1.rels"));
        for(const an of [...desc(d,"twoCellAnchor"),...desc(d,"oneCellAnchor")]){
          const fr=kids(an,"from")[0]; const blip=desc(an,"blip")[0]; if(!fr||!blip) continue;
          const col=+desc(fr,"col")[0].textContent+1, row=+desc(fr,"row")[0].textContent+1;
          const emb=[...blip.attributes].find(a=>a.localName==="embed"); if(!emb) continue;
          anchors.push({sheet:name,col,row,media:resolve(dp,dr[emb.value])});
        }}
    }
    const posts=[...S.posts.values()].filter(p=>p.slot);
    let nuevas=0,iguales=0,sueltas=0; const cache=new Map();
    for(const a of anchors){
      const targets=posts.filter(p=>p.slot.sheet===a.sheet&&p.slot.col===a.col&&a.row>=p.slot.r1-1&&a.row<=p.slot.r2);
      if(!targets.length){sueltas++;continue}
      const f=zip.file(a.media); if(!f) continue; const buf=await f.async("arraybuffer"); const h=await sha(buf);
      for(const p of targets){
        const cur=S.posts.get(p.id); if(cur.arteManual||cur.imgHash===h){iguales++;continue}
        const key=h+"|"+cur.formato; let ids=cache.get(key);
        if(!ids){toast(`Subiendo imágenes… (${nuevas+1})`);const fr=await frames(new Blob([buf]),cur.formato);ids=[];for(const b of fr){const r=await S.assets.upload(b,{type:"image/jpeg"});ids.push("asset:"+r.id)}cache.set(key,ids)}
        await save(p.id,{imagenes:ids,imgHash:h}); nuevas++;
      }
    }
    toast(nuevas?`${nuevas} ${nuevas===1?"pieza":"piezas"} con imagen nueva · ${iguales} sin cambios`:`No hay imágenes nuevas (${iguales} sin cambios)`);
  }catch(err){console.error(err);toast("No se pudo leer el Excel. Revisa que sea el planning en formato .xlsx.")}
}

function clipIds(){return (S.clip||[]).filter(id=>S.posts.has(id))}
function clipUnionRegs(){return REGIONES.map(r=>r.id).filter(id=>clipIds().some(x=>regsOf(S.posts.get(x)).includes(id)))}
function clipBar(){
  if(!canEdit()||!S.clip) return "";

    <input type="date" id="clipDate" aria-label="Fecha para pegar" value="${esc(ds[0]||"")}"><button class="btn primary" data-pastedate>Pegar</button><span class="sp"></span><button class="btn ghost" data-clipclear>Terminar</button></div>`;
}

function copyPosts(ids){
  ids=ids.filter(id=>S.posts.has(id)); if(!canEdit()||!ids.length) return;
  S.clip=ids; S.clipRegs=null; renderView(); toast(ids.length>1?`${ids.length} publicaciones copiadas. Haz clic en un día y presiona Ctrl+V.`:"Copiada. Haz clic en un día y presiona Ctrl+V.");
}
const dOf=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=dOf(s);d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((dOf(a)-dOf(b))/864e5);
function copyOf(src,day){
  const id=newId(src);
  const c={...src,id,origen:"manual",fecha:day,sinFecha:false,estado:"Sin iniciar",cambiosPendientes:false,creado:new Date().toISOString(),fuente:`Copiada de ${src.id}${src.fecha?" ("+fmtDia(src.fecha)+")":""}`};
  for(const k of ["slot","imgHash","fechaPropuesta","actualizado","actualizadoPor","vinculo"]) delete c[k];
  if((c.imagenes||[]).length) c.arteManual=true;
  const want=S.clipRegs&&S.clipRegs.length?S.clipRegs:regsOf(src), have=regsOf(src);
  if(want.join()!==have.join()){c.paises=want.flatMap(r=>have.includes(r)?region(r).paises.filter(x=>src.paises.includes(x)):region(r).paises);c.paises=ALL_PAISES.filter(x=>c.paises.includes(x));c.region=regsOf(c)[0]}
  return c;
}
async function pastePost(day){
  const ids=clipIds(); if(!canEdit()||!ids.length||!day) return;
  const srcs=ids.map(id=>S.posts.get(id)); const base=srcs.map(p=>p.fecha).filter(Boolean).sort()[0];
  const out=srcs.map(src=>copyOf(src,src.fecha&&base?addDays(day,diffDays(src.fecha,base)):day));
  beginGroup(); try{for(const c of out) await write(c.id,c,true)} finally{endGroup(out.length>1?`el pegado de ${out.length} publicaciones`:"el pegado")}
  const hidden=out.filter(c=>!matches(c)).length;
  toast(out.length>1?`${out.length} publicaciones pegadas desde el ${fmtDia(day,true)}${hidden?` (${hidden} no se ven con los filtros actuales)`:""}`
    :`Pegada el ${fmtDia(day,true)}${regNames(out[0])!==regNames(srcs[0])?" en "+regNames(out[0]):""}${hidden?" (no se ve con los filtros actuales)":""}`);
}

/* Supr / Delete (o Backspace) elimina las publicaciones seleccionadas, con Deshacer */
async function deletePost(id){return deletePosts([id])}
async function deletePosts(ids){
  ids=ids.filter(id=>S.posts.has(id)); if(!ids.length||!canEdit()) return;
  let ok=0; beginGroup();
  try{for(const id of ids){const p=S.posts.get(id);try{await S.db.doc("posts/"+id).delete()}catch(e){continue}
    S.posts.delete(id); ok++; if(S.sels) S.sels.delete(id); if(S.sel===id) S.sel=null; if(S.clip) S.clip=S.clip.filter(x=>x!==id);
    pushUndo({type:"delete",doc:p,label:"la eliminación"})}}
  finally{endGroup(ok>1?`la eliminación de ${ok} publicaciones`:"la eliminación")}
  render();
  if(!ok){toast("No se pudo eliminar. Revisa tu conexión.");return}
  toastUndo(ok>1?`${ok} publicaciones eliminadas`:"Publicación eliminada");
}
/* ============ deshacer (Ctrl/Cmd + Z) */
function undoLabel(ch){const k=Object.keys(ch);return k.includes("fecha")?"el cambio de fecha":k.includes("estado")?"el cambio de estado":k.includes("region")?"el cambio de región":k.includes("imagenes")?"el cambio de arte":k.includes("hora")?"el cambio de hora":"la edición"}
function pushUndo(op){if(!canEdit()) return;if(S.group){S.group.push(op);return}(S.undo=S.undo||[]).push(op);if(S.undo.length>50) S.undo.shift()}
function beginGroup(){S.group=[]}
function endGroup(label){const g=S.group;S.group=null;if(!g||!g.length) return;pushUndo(g.length===1?g[0]:{type:"group",ops:g,label})}
function toastUndo(msg){const r=$("#toastRoot");r.innerHTML=`<div class="toast" role="status">${esc(msg)}<button class="undo" data-undo>Deshacer</button></div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML="",7000)}
async function undoOne(op){
  if(op.type==="edit"){ if(!S.posts.has(op.id)) return; await save(op.id,op.prev); }
  else if(op.type==="create"){ if(S.posts.has(op.id)){await S.db.doc("posts/"+op.id).delete(); S.posts.delete(op.id); if(S.openId===op.id) closeSheet(); if(S.sels) S.sels.delete(op.id); if(S.sel===op.id) S.sel=null; if(S.clip) S.clip=S.clip.filter(x=>x!==op.id)} }
  else if(op.type==="medit"){ if(S.medios.has(op.id)) await saveMed(op.id,op.prev); }
  else if(op.type==="mcreate"){ if(S.medios.has(op.id)){await S.db.doc("medios/"+op.id).delete(); S.medios.delete(op.id); if(S.openMed===op.id) closeMedio()} }
  else if(op.type==="mdelete"){ const {actualizado,actualizadoPor,...doc}=op.doc; S.medios.set(doc.id,doc); await S.db.doc("medios/"+doc.id).set(doc); }
  else if(op.type==="delete"){ const {actualizado,actualizadoPor,...doc}=op.doc; await write(doc.id,doc,true); S.sels=S.sels||new Set(); S.sels.add(doc.id); S.sel=doc.id; }
}
async function undoLast(){
  const op=(S.undo||[]).pop(); if(!op){toast("No hay nada que deshacer");return}
  S.undoing=true;
  try{
    const ops=op.type==="group"?[...op.ops].reverse():[op];
    if(op.type==="group") clearSel();
    for(const o of ops) await undoOne(o);
    render(); if(S.openId) renderSheet(); if(S.openMed) renderMedioSheet();
    toast(`Deshecho: ${op.label}`);
  }catch(e){toast("No se pudo deshacer. Revisa tu conexión.")}
  finally{S.undoing=false}
}

/* ============ escritura (una a la vez por documento) */
const queues=new Map();
function enqueue(id,fn){const prev=queues.get(id)||Promise.resolve();const next=prev.catch(()=>{}).then(fn);queues.set(id,next);return next}
async function save(id,patch){
  if(!canApprove()) return;
  const cur=S.posts.get(id); if(!cur) return;
  const changed={}; for(const k in patch) if(JSON.stringify(cur[k])!==JSON.stringify(patch[k])) changed[k]=patch[k];
  if(!Object.keys(changed).length) return;
  if(!S.undoing){const prev={};for(const k in changed) prev[k]=cur[k]===undefined?null:cur[k];pushUndo({type:"edit",id,prev,label:undoLabel(changed)})}
  if(!S.undoing&&!("campMadre" in changed)&&["headline","copy","imagenes","campana","serie"].some(k=>k in changed)&&typeof campAutoOnEdit==="function") setTimeout(()=>campAutoOnEdit(id),0);
  if(typeof traceLog==="function") traceLog("post",cur,patch,changed);
  changed.actualizado=new Date().toISOString(); if(S.myId) changed.actualizadoPor=S.myId;
  S.posts.set(id,{...cur,...changed}); render(); if(S.openId===id) renderSheet();
  try{await enqueue(id,()=>S.db.doc("posts/"+id).update(changed))}
  catch(e){S.posts.set(id,cur);render();if(S.openId===id) renderSheet();toast(e&&e.code==="invalid_argument"?"No tienes permiso para editar esta publicación.":"No se guardó el cambio. Revisa tu conexión e inténtalo otra vez.")}
}
async function write(id,doc,create){
  if(!S.undoing) pushUndo({type:"create",id,label:"la creación"});
  S.posts.set(id,doc); render();
  try{await enqueue(id,()=>S.db.doc("posts/"+id).set(doc))}catch(e){S.posts.delete(id);render();toast(e&&e.code==="quota_exceeded"?"Se llenó el espacio de la base de datos.":"No se pudo crear la publicación.")}
}
async function addComment(postId,tipo,texto){
  const c={postId,tipo,texto,fecha:new Date().toISOString(),autorId:S.myId||"",autorNombre:(S.me&&S.me.name)||"",autorOrg:role()==="cliente"?"cliente":"inside",...autoActor(tipo)};
  S.comments.push(c); if(S.openId===postId) renderSheet();
  try{const ref=await S.db.collection("comentarios").add(c);if(ref&&ref.id) c._id=ref.id}catch(e){S.comments=S.comments.filter(x=>x!==c);if(S.openId===postId) renderSheet();toast("No se pudo guardar el comentario.")}
}

function pickMonth(){
  const now=new Date(); const pre=`${now.getFullYear()}-${pad(now.getMonth()+1)}`;
  const ds=[...S.posts.values()].map(p=>p.fecha).filter(Boolean).sort();
  if(!ds.length||ds.some(d=>d.startsWith(pre))) return [now.getFullYear(),now.getMonth()];
  const d=parseISO(ds.find(x=>x>=pre)||ds[ds.length-1]); return [d.getFullYear(),d.getMonth()];
}

const MATRICES=[{id:"ATL",nombre:"ATL",desc:"TV, radio, OOH, DOOH y publimóvil"},{id:"ECOMMERCE",nombre:"Ecommerce",desc:"Pauta y orgánico de tienda en línea"},{id:"DIGITAL",nombre:"Digital",desc:"Pauta en Meta (FB e IG)"}];

function medNorm(d){return {imagenes:[],paises:[],nombre:"",inicio:"",fin:"",estado:"Sin iniciar",matriz:"DIGITAL",plataforma:"",formato:"",statusMatriz:"",legal:"",comentariosSlide:"",...d,...normEstado(d)}}
function medRange(m){return m.inicio?(m.fin&&m.fin!==m.inicio?`${fmtCorto(m.inicio)} – ${fmtCorto(m.fin)}`:fmtCorto(m.inicio)):"Sin fechas"}
function fmtCorto(s){const d=parseISO(s);return `${d.getDate()} ${MESES[d.getMonth()].slice(0,3)}`}
function medMatches(m){
  const f=S.f;
  if(f.region!=="ALL"&&!regsOf(m).includes(f.region)) return false;
  if(f.paises.length&&!m.paises.some(c=>f.paises.includes(c))) return false;
  if(selMz().length&&!selMz().includes(m.matriz)) return false;
  if(f.estado!=="ALL"&&m.estado!==f.estado) return false;
  if(!aprobMatch(m)) return false;
  if(f.q){const q=f.q.toLowerCase();if(![m.nombre,m.plataforma,m.formato,m.titular,m.textoPrincipal,m.legal,m.paises.join(" ")].join(" ").toLowerCase().includes(q)) return false}
  return true;
}
function medVisible(){return [...S.medios.values()].filter(medMatches)}
function inMonth(m,pre,last){return m.inicio&&m.inicio<=`${pre}-${pad(last)}`&&(m.fin||m.inicio)>=`${pre}-01`}
function medPendientes(id){return openCount(id)}

    ${MATRICES.map(x=>`<span><b>${enMes.filter(v=>v.matriz===x.id).length}</b> ${x.nombre}</span>`).join("")}
    ${sf.length?`<span class="warn"><b>${sf.length}</b> por asignar fechas</span>`:""}${env?`<button class="sumlink" data-openinbox=""><b>${env}</b> ${role()==="inside"?"esperando aprobación del cliente":"esperan tu aprobación"}</button>`:""}${cms?`<button class="sumlink warn" data-openinbox="abiertos"><b>${cms}</b> comentarios por revisar</button>`:""}`;

async function saveMed(id,patch){

  if(typeof traceLog==="function") traceLog("medio",cur,patch,ch);

}

}
function openSend(items){S.send={items:items.filter(x=>pieceInfo(x.kind,x.id)),step:1,nota:""};renderSend()}

El feed es la vitrina de marca, no catálogo ni volante. REGLA: ninguna pieza del feed abre con un descuento; el precio va como sello dentro de la historia, nunca como titular. Las promos viven en historias con look + oferta + hora exacta + legal.
El copy se escribe para la búsqueda y para mandarse (ej.: «Para ese amigo que siempre dice "quiero unos zapatos cómodos". Ya encontramos el par. Mándale esto»), no como descripción de producto.

function infoCampText(linea){
  if(!INFO||!INFO.lineamientos) return "";
  const L=INFO.lineamientos; const k=(linea||"").toLowerCase().split(" ")[0];
  const pick=arr=>(arr||[]).filter(x=>(x.nombre||"").toLowerCase().includes(k)).map(x=>`${x.nombre}: ${x.detalle}`);
  return [...pick(L.tono),...pick(L.series)].join("\n");
}
function lineaOf(piece,kind){
  const cc=campOf(piece); if(cc&&LINEAS.includes(cc.madre)) return cc.madre;
  if(kind==="post") return piece.linea&&piece.linea!=="Otra"?piece.linea:(piece.campana||"Otra");
  const n=(piece.nombre||"").toLowerCase();
  if(/halloween/.test(n)) return "Halloween Kids"; if(/kid|niñ/.test(n)) return "Kids"; if(/comfort/.test(n)) return "Comfort Plus";
  if(/llegad|sandal|bota|cuero/.test(n)) return "Nuevas Llegadas"; if(/bogo|%|descuento|flash|promo|cyd|off/.test(n)) return "Promociones";
  if(/atl[eé]tic|sneaker|champion|gear|airwalk|reebok|cross/.test(n)) return "Sneakers"; return "Otra";
}
function lineaOfAny(x){return x.nombre!==undefined&&x.matriz?lineaOf(x,"medio"):lineaOf(x,"post")}

  finally{st.busy=false; rerenderOpen()}
}

async function extractText(file){
  const name=file.name.toLowerCase(); const ext=name.split(".").pop();
  if(["txt","md","csv","json"].includes(ext)) return await file.text();
  if(ext==="pdf"){
    if(!window.pdfjsLib) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
    try{pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"}catch(e){}
    const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise; const out=[];
    for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();out.push(`[Página ${i}] `+tc.items.map(x=>x.str).join(" ").replace(/\s+/g," "))}
    return out.join("\n");
  }
  if(["docx","pptx","xlsx"].includes(ext)){
    if(!window.JSZip) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
    const zip=await JSZip.loadAsync(file); const P=new DOMParser(); const txt=x=>[...P.parseFromString(x,"application/xml").getElementsByTagName("*")].filter(n=>/:t$|^t$/.test(n.tagName)&&n.childNodes.length===1&&n.firstChild.nodeType===3).map(n=>n.textContent);

function docExcerpt(text,keys,cap){
  if(text.length<=cap) return text;
  const chunks=text.split(/\n+/).flatMap(l=>l.length>700?l.match(/[\s\S]{1,700}/g):[l]).filter(c=>c.trim());
  const ks=keys.map(k=>k.toLowerCase()).filter(k=>k.length>2);
  const scored=chunks.map((c,i)=>{const lc=c.toLowerCase();return {i,c,s:ks.reduce((a,k)=>a+(lc.includes(k)?1:0),0)}});
  const head=text.slice(0,Math.min(2500,cap/4)); let out=[head], len=head.length;
  for(const x of scored.filter(x=>x.s>0).sort((a,b)=>b.s-a.s||a.i-b.i)){if(len+x.c.length>cap) continue;out.push(x);len+=x.c.length}
  return [head,...out.slice(1).sort((a,b)=>a.i-b.i).map(x=>x.c)].join("\n…\n");
}
function docsForPrompt(linea,piece){

  const ds=redDocs().filter(d=>!d.linea||d.linea==="General"||d.linea===linea);
  let total=0; const out=[];
  for(const d of ds){const cap=Math.max(4000,Math.min(18000,42000-total));if(cap<=0) break;const ex=docExcerpt(d.texto||"",keys,cap);total+=ex.length;out.push(`--- ${d.nombre} (${d.categoria||"Documento"}${d.linea&&d.linea!=="General"?` · ${d.linea}`:""}) ---\n${ex}`);if(total>42000) break}
  return {txt:out.join("\n\n"),n:out.length};
}

/* ============ SERIES v2: detección por «1/3, 2 de 3», enlazar existentes, reordenar, vista de todas */
const SRS_RE=/(^|[\s(·#–—-])(\d{1,2})(\s*(?:\/|de|of)\s*)(\d{1,2})(?=$|[\s).,·–—-])/i;
function srsNum(p){
  for(const k of ["campana","headline","serie"]){const v=String(p[k]||"");const m=SRS_RE.exec(v);if(!m) continue;const n=+m[2],t=+m[4];
    if(t>=2&&t<=9&&n>=1&&n<=t){const orig=(v.slice(0,m.index)+m[1]+v.slice(m.index+m[0].length)).replace(/[\s·|–—-]+$/,"").replace(/^[\s·|–—-]+/,"").trim();return {n,t,k,orig:orig||p.linea||"Serie",base:norm(orig||p.linea||"")}}}
  return null;
}
function srsTotal(s){const its=serieItems(s.id);return Math.max((s.pasos||[]).length,s.total||0,...its.map(x=>(x.seriePaso??0)+1),1)}
function srsLabel(s,i,N){return s.plantilla==="num"||s.plantilla==="triada"?`${i+1}/${N}`:((s.pasos||[])[i]||`Paso ${i+1}`)}
function srsFieldFix(x,slot,N){const m=srsNum(x);if(!m) return {};const v=String(x[m.k]);return {[m.k]:v.replace(SRS_RE,(a,pre,n,sep)=>`${pre}${slot+1}${sep}${N}`)}}
function relabelPatch(s,x,slot,N){return {seriePaso:slot,serieFase:srsLabel(s,slot,N),...(s.plantilla==="num"||s.plantilla==="triada"?srsFieldFix(x,slot,N):{})}}
async function saveSerieDoc(s){S.series.set(s.id,s);try{await S.db.doc("series/"+s.id).set(s)}catch(e){toast("No se pudo guardar la serie.")}}
async function relabelAll(sid){const s=S.series.get(sid);if(!s) return;const N=srsTotal(s);for(const x of serieItems(sid)) await save(x.id,relabelPatch(s,x,x.seriePaso??0,N))}

/* detección */
function detectSeries(){
  const groups=[];
  for(const s of (S.series||new Map()).values()) if(s.auto&&s.base){const its=serieItems(s.id);if(its.length) groups.push({sid:s.id,base:s.base,t:srsTotal(s),orig:s.nombre,items:its.map(p=>({p,m:{n:(p.seriePaso??0)+1}})),nuevos:[]})}
  const cands=[...S.posts.values()].filter(p=>!p.serieId&&!p.serieNo).map(p=>({p,m:srsNum(p)})).filter(x=>x.m).sort((a,b)=>(a.p.fecha||"9").localeCompare(b.p.fecha||"9"));
  for(const c of cands){
    const g=groups.find(g=>g.base===c.m.base&&g.t===c.m.t&&!g.items.some(x=>x.m.n===c.m.n)&&g.items.some(x=>x.p.paises.some(k=>c.p.paises.includes(k)))&&(!c.p.fecha||g.items.every(x=>!x.p.fecha||Math.abs(dayDiff(x.p.fecha,c.p.fecha))<=14)));
    if(g){g.items.push(c);g.nuevos.push(c)} else groups.push({base:c.m.base,t:c.m.t,orig:c.m.orig,items:[c],nuevos:[c]});
  }
  for(const g of groups) g.items.sort((a,b)=>a.m.n-b.m.n);
  return groups.filter(g=>g.nuevos.length);
}
async function linkDetected(g){
  let sid=g.sid;
  if(!sid){sid=`srs-${Date.now().toString(36)}${Math.random().toString(36).slice(2,5)}`;await saveSerieDoc({id:sid,nombre:`${g.orig} · serie de ${g.t}`,plantilla:"num",pasos:Array.from({length:g.t},(_,i)=>`${i+1}/${g.t}`),total:g.t,auto:true,base:g.base,creado:new Date().toISOString(),porId:S.myId||""})}
  for(const c of g.nuevos) await save(c.p.id,{serieId:sid,seriePaso:c.m.n-1,serieFase:`${c.m.n}/${g.t}`});
  return sid;
}
async function autoLinkSeries(){
  if(S._srsAuto||role()!=="inside"||!S.series) return; S._srsAuto=true;
  const gs=detectSeries().filter(g=>g.items.length>=2); if(!gs.length) return;
  beginGroup(); let n=0; try{for(const g of gs){await linkDetected(g);n+=g.nuevos.length}}finally{endGroup("el enlace automático de series")}
  toast(`⛓ Enlacé ${n} publicaciones en ${gs.length} serie${gs.length>1?"s":""} por sus títulos (1/3, 2/3…). Puedes revisarlas en «Series».`);
  render();
}

/* agregar / mover */
async function addToSerie(sid,ids,slot){
  const s={...S.series.get(sid)}; if(!s.id) return;
  const ps=ids.map(id=>S.posts.get(id)).filter(Boolean).sort((a,b)=>(a.fecha||"9").localeCompare(b.fecha||"9"));
  beginGroup();
  try{
    for(const [k,x] of ps.entries()){
      const taken=new Set(serieItems(sid).filter(y=>y.id!==x.id).map(y=>y.seriePaso??0)); let N=srsTotal(s);
      const m=srsNum(x); let at=k===0&&slot!=null&&slot!==""?+slot:(m&&m.t===N&&!taken.has(m.n-1)?m.n-1:null);
      if(at==null||taken.has(at)){at=null;for(let i=0;i<N;i++) if(!taken.has(i)){at=i;break}}
      if(at==null){at=N;N=N+1;s.pasos=Array.from({length:N},(_,i)=>s.plantilla==="num"||s.plantilla==="triada"?`${i+1}/${N}`:((s.pasos||[])[i]||`Paso ${i+1}`));if(s.total) s.total=N;await saveSerieDoc(s)}
      if(m&&m.n-1!==at) S._srsWarn=`«${x[m.k]}» quedó como ${at+1}/${N} porque el ${m.n}/${m.t} ya estaba ocupado. Puedes moverla con ‹ ›.`;
      await save(x.id,{serieId:sid,serieNo:false,...relabelPatch(s,x,at,N)});
    }
    await relabelAll(sid);
  }finally{endGroup("agregar a la serie")}
  toast(S._srsWarn||(ps.length===1?"Publicación enlazada a la serie":`${ps.length} publicaciones enlazadas a la serie`));S._srsWarn=null;
}
async function moveInSerie(id,dir){
  const x=S.posts.get(id); const s=serieOf(x); if(!s) return;
  const N=srsTotal(s); const k=x.seriePaso??0; const t=k+dir; if(t<0) return;
  const y=serieItems(s.id).find(z=>z.id!==x.id&&(z.seriePaso??0)===t);
  let s2=s; if(t>=N){s2={...s,pasos:[...(s.pasos||[]),srsLabel(s,t,t+1)]};if(s.total) s2.total=t+1;await saveSerieDoc(s2)}
  const N2=srsTotal(s2);
  beginGroup();
  try{
    if(y){await save(x.id,{...relabelPatch(s2,x,t,N2),fecha:y.fecha||"",hora:y.hora||"",sinFecha:!y.fecha});await save(y.id,{...relabelPatch(s2,y,k,N2),fecha:x.fecha||"",hora:x.hora||"",sinFecha:!x.fecha})}
    else await save(x.id,relabelPatch(s2,x,t,N2));
  }finally{endGroup("el cambio de orden de la serie")}
  toast(y?`Ahora va en el paso ${t+1}; intercambió fecha con «${y.serieFase||"la otra pieza"}»`:`Ahora va en el paso ${t+1}`);
}
async function unlinkSerie(sid,mark){
  beginGroup();try{for(const x of serieItems(sid)) await save(x.id,{serieId:"",seriePaso:null,serieFase:"",...(mark?{serieNo:true}:{})})}finally{endGroup("quitar la serie")}
  S.series.delete(sid);try{await S.db.doc("series/"+sid).delete()}catch(e){}
  toast("Serie deshecha. Las publicaciones siguen igual.");
}

/* buscador para enlazar con publicaciones existentes */
function srsCands(from){
  const fs=serieOf(from); const fm=srsNum(from); const fc=campOf(from); const q=norm(S.srsPick.q);
  return [...S.posts.values()].filter(p=>p.id!==from.id&&!(fs&&p.serieId===fs.id)).map(p=>{
    let sc=0; const m=srsNum(p); const c=campOf(p);
    if(fm&&m&&m.base===fm.base) sc+=6; if(p.linea&&p.linea===from.linea) sc+=3; if(c&&fc&&c.sub&&c.sub===fc.sub) sc+=3;
    if(p.paises.some(k=>from.paises.includes(k))) sc+=2; if(p.fecha&&from.fecha){const d=Math.abs(dayDiff(from.fecha,p.fecha));sc+=d<=7?3:d<=21?1:-2}
    return {p,sc,m};
  }).filter(x=>!q||norm([x.p.headline,x.p.campana,x.p.serie,x.p.paises.join(" "),x.p.fecha,x.p.id].join(" ")).includes(q)).sort((a,b)=>b.sc-a.sc||(a.p.fecha||"9").localeCompare(b.p.fecha||"9")).slice(0,60);
}

    ${mode==="new"&&sel.length?`<div class="redcfg"><label>Tipo de serie<select id="pkPl">${Object.entries(PLANTILLAS).map(([k,v])=>`<option value="${k}" ${k===(P.plantilla||(fm?"num":sel.length===2?"promo":"libre"))?"selected":""}>${v.nombre}</option>`).join("")}</select></label><label>Nombre<input id="pkNom" value="${esc(P.nombre||`${fm?fm.orig:((campOf(from)||{}).sub||from.campana||"Serie")} · serie`)}"></label></div>`:""}

    <div class="drow"><button class="btn ghost" data-srspickno>Cancelar</button><button class="btn primary" data-srspickgo ${sel.length?"":"disabled"}>${mode==="add"?`Agregar ${sel.length||""} a la serie`:mode==="join"?`Unir a «${esc(joinS.nombre)}»`:`Crear serie con ${sel.length+1} publicaciones`}</button></div>

async function srsPickGo(){
  const P=S.srsPick; const from=S.posts.get(P.from); const fs=serieOf(from); const sel=[...P.sel].map(id=>S.posts.get(id)).filter(Boolean);
  const joinS=!fs&&sel.filter(p=>p.serieId).length&&new Set(sel.filter(p=>p.serieId).map(p=>p.serieId)).size===1?serieOf(sel.find(p=>p.serieId)):null;
  const pl=$("#pkPl")?.value, nom=($("#pkNom")?.value||"").trim();
  S.srsPick=null; renderSrsPick();
  if(fs) await addToSerie(fs.id,sel.map(p=>p.id),P.slot);
  else if(joinS) await addToSerie(joinS.id,[from.id,...sel.filter(p=>!p.serieId).map(p=>p.id)],null);
  else{
    const ids=[from.id,...sel.map(p=>p.id)]; const ms=ids.map(id=>srsNum(S.posts.get(id)));
    if(pl==="num"&&ms.every(Boolean)&&new Set(ms.map(m=>m.n)).size===ms.length){const t=Math.max(...ms.map(m=>m.t),ids.length);await linkDetected({base:ms[0].base,t,orig:nom.replace(/ · serie$/,"")||ms[0].orig,nuevos:ids.map((id,i)=>({p:S.posts.get(id),m:ms[i]})),items:[]});const s=serieOf(S.posts.get(from.id));if(s&&nom){await saveSerieDoc({...s,nombre:nom,auto:false})}toast(`Serie creada con ${ids.length} publicaciones`)}
    else await linkAsSerie(ids,nom||"Serie",pl||"libre");
  }
  rerenderOpen(); render(); if(S.srsAll) renderSrsAll();
}
