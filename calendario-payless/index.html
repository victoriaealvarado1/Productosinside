/* ============ FEED ROMPECABEZAS: orden propuesto por país */
function feedKey(c,pre){return `${c}|${pre}`}
function orderedFeed(c,feed,pre){
  const ord=S.feedOrd&&S.feedOrd[feedKey(c,pre)]; if(!ord||!ord.length) return {list:feed,custom:false};
  const cur=feed.filter(p=>p.fecha&&p.fecha.startsWith(pre)), old=feed.filter(p=>!(p.fecha&&p.fecha.startsWith(pre)));
  const byId=new Map(cur.map(p=>[p.id,p])); const out=ord.map(id=>byId.get(id)).filter(Boolean); const rest=cur.filter(p=>!ord.includes(p.id));
  for(const p of rest){let i=out.findIndex(x=>sortPosts(p,x)>0);if(i<0) i=out.length;out.splice(i,0,p)}
  return {list:[...out,...old],custom:true};
}
function feedMismatch(list,pre){const cur=list.filter(p=>p.fecha&&p.fecha.startsWith(pre));const byDate=[...cur].sort((a,b)=>sortPosts(b,a));return cur.filter((p,i)=>byDate[i]!==p).length}
async function saveFeedOrder(c,pre,ids){
  S.feedOrd=S.feedOrd||{}; const k=feedKey(c,pre); if(ids) S.feedOrd[k]=ids; else delete S.feedOrd[k];
  const id=k.replace("|","-");
  try{if(ids) await S.db.doc("feedorden/"+id).set({pais:c,mes:pre,orden:ids,actualizado:new Date().toISOString(),porId:S.myId||""}); else await S.db.doc("feedorden/"+id).delete()}catch(e){toast("No se pudo guardar el orden.")}
  renderView();
}

  const {feed}=countryFeed(c,true); const cur=orderedFeed(c,feed,pre).list.filter(p=>p.fecha&&p.fecha.startsWith(pre)).map(p=>p.id);

async function applyFeedOrder(c,pre){
  const {feed}=countryFeed(c,true); const list=orderedFeed(c,feed,pre).list.filter(p=>p.fecha&&p.fecha.startsWith(pre));
  const slots=[...list].sort((a,b)=>sortPosts(b,a)).map(p=>({fecha:p.fecha,hora:p.hora}));
  const multi=list.filter((p,i)=>p.paises.length>1&&(slots[i].fecha!==p.fecha||slots[i].hora!==p.hora)).length;
  const changes=list.filter((p,i)=>slots[i].fecha!==p.fecha||slots[i].hora!==p.hora).length;
  if(!changes){toast("Las fechas ya coinciden con este orden.");return}
  if(!confirm(`Se cambiarán las fechas y horas de ${changes} publicaciones para que el feed de ${PAIS[c]} quede en este orden.${multi?`\n\nAtención: ${multi} de ellas también salen en otros países y su fecha cambiará allí.`:""}\n\nPuedes deshacerlo con Ctrl+Z.`)) return;
  beginGroup();try{for(const [i,p] of list.entries()){const sl=slots[i];if(sl.fecha!==p.fecha||sl.hora!==p.hora) await save(p.id,{fecha:sl.fecha,hora:sl.hora||"",sinFecha:false})}}finally{endGroup("el reordenamiento del feed")}
  await saveFeedOrder(c,pre,null); toast("Fechas actualizadas según el orden del feed");
}

async function migrateParrillaDates(){

  for(const p of pend){
    const dup=[...S.posts.values()].find(c=>c.id!==p.id&&c.origen!=="parrilla"&&c.fecha===p.fechaPropuesta&&c.region===p.region&&c.tipo===p.tipo&&c.paises.some(x=>p.paises.includes(x)));
    const patch={fecha:p.fechaPropuesta,sinFecha:false,fechaDesdeParrilla:true,...(dup?{posibleDuplicado:dup.id}:{})};
    S.undoing=true; try{await save(p.id,patch)}finally{S.undoing=false}

}

/* ============ APRENDIZAJES DE MARCA: reuniones + comentarios → propuestas con evidencia → aprobación */
const APR_CATS=["Copy","Tono","Arte / visual","Promos / legal","Formatos","Calendario","Proceso"];
const APR_FUERZA={directriz:"Directriz",preferencia:"Preferencia",observacion:"Observación"};
const APR_REL={nuevo:"Nuevo",refuerza:"Refuerza",matiza:"Matiza",contradice:"Contradice"};
const uid=p=>`${p}-${Date.now().toString(36)}${Math.random().toString(36).slice(2,5)}`;
function aprList(){return (redMarca().aprendizajes||[]).map((a,i)=>({id:a.id||`old-${i}`,texto:a.texto,categoria:a.categoria||"Copy",alcance:a.alcance||{tipo:"marca",valor:""},fuerza:a.fuerza||"preferencia",evidencias:a.evidencias||(a.fuente?[{cita:a.fuente,quien:"",fecha:a.fecha||"",fuente:"manual"}]:[]),estado:a.estado||"activo",historial:a.historial||[],creado:a.creado||a.fecha||"",...a}))}
function aprActive(){return aprList().filter(a=>a.estado==="activo")}
async function saveApr(list,hist){await saveRed("marca",{aprendizajes:list,...(hist?{aprHist:[...(redMarca().aprHist||[]),{...hist,fecha:new Date().toISOString(),por:S.myId||""}].slice(-200)}:{})})}
function alcanceTxt(al){if(!al||al.tipo==="marca") return "Toda la marca";return ({campana:"Campaña",region:"Región",pais:"País",canal:"Canal"}[al.tipo]||al.tipo)+": "+(al.tipo==="region"?region(al.valor).nombre:al.tipo==="pais"?(PAIS[al.valor]||al.valor):al.valor)}
function aprApplies(a,piece,kind,linea){
  const al=a.alcance||{tipo:"marca"}; if(al.tipo==="marca") return true;
  if(al.tipo==="campana") return norm(al.valor)===norm(linea)||norm((campOf(piece)||{}).sub)===norm(al.valor);
  if(al.tipo==="region") return regsOf(piece).includes(al.valor);
  if(al.tipo==="pais") return piece.paises.includes(al.valor);
  if(al.tipo==="canal") return kind==="medio"?norm(al.valor).includes(norm(piece.matriz||"")):norm(al.valor).includes(isFeed(piece)?"feed":"historia")||norm(al.valor).includes("organico");
  return true;
}
function aprPromptBlock(piece,kind,linea){
  const as=aprActive().filter(a=>aprApplies(a,piece,kind,linea));
  const g=f=>as.filter(a=>a.fuerza===f).map(a=>`- [${a.categoria}${a.alcance&&a.alcance.tipo!=="marca"?` · ${alcanceTxt(a.alcance)}`:""}] ${a.texto}`).join("\n");

function aprContextForAI(){return aprActive().map(a=>`{"id":"${a.id}","regla":${JSON.stringify(a.texto)},"categoria":"${a.categoria}","alcance":${JSON.stringify(a.alcance)},"fuerza":"${a.fuerza}"}`).join("\n")||"(ninguno)"}
const APR_JSON=`Responde SOLO con un JSON: [{"texto":"regla accionable en una frase","categoria":"una de: ${APR_CATS.join(", ")}","alcance":{"tipo":"marca|campana|region|pais|canal","valor":"(vacío si es marca; campañas: ${LINEAS.join(", ")}; regiones: CENTRO, SUR, RD, CARIBE; países: códigos GT, SV, HN, NI, CR, PA, CO, EC, PE, RD, TT, JM, BB, ECI, GY, USVI; canales: feed, historias, ATL, ECOMMERCE, DIGITAL)"},"fuerza":"directriz|preferencia|observacion","evidencias":[{"cita":"frase textual corta","quien":"nombre","fecha":"AAAA-MM-DD o vacío"}],"relacion":"nuevo|refuerza|matiza|contradice","relacionCon":"id del aprendizaje existente o vacío","recomendacion":"qué recomiendas hacer y por qué (1 frase)"}]
Criterios: "directriz" = el cliente lo pide de forma explícita o lo dice quien decide; "preferencia" = lo repite o lo deja claro sin ordenarlo; "observacion" = lo menciona una vez de pasada. No inventes ni generalices de más; si algo solo aplica a una campaña, región o canal, ponlo en el alcance. Compara con los aprendizajes existentes: "refuerza" si dice lo mismo, "matiza" si lo precisa o limita, "contradice" si va en sentido opuesto (explica en la recomendación qué debería ganar). Ignora logística, fechas de entrega y temas administrativos que no sean criterio de contenido.`;
async function proposeFromMeeting(reu){

${aprContextForAI()}

${(reu.texto||"").slice(0,150000)}
${APR_JSON}`;

async function resolveProp(id,accion){

  if(accion==="reemplazar"&&rel){rel.estado="reemplazado";rel.reemplazadoPor=nuevo.id;rel.historial=[...rel.historial,{fecha:now,accion:"reemplazada",detalle:nuevo.texto}];nuevo.reemplazaA=rel.id}

}

/* aprobadores de cada pieza */
function approversOf(x){
  if(!x) return [];
  const ps=personas().filter(p=>p.org==="cliente"&&p.aprueba);
  if(Array.isArray(x.aprobadores)&&x.aprobadores.length) return x.aprobadores.map(personaById).filter(Boolean);
  const m=/Aprueba:\s*([^·|]+)/i.exec(x.responsable||"");
  if(m){const n=norm(m[1]);const hit=ps.find(p=>norm(p.nombre)===n||(p.alias||[]).some(a=>norm(a)===n));if(hit) return [hit]}
  const cs=x.paises||[]; return ps.filter(p=>paisesOf(p).some(c=>cs.includes(c)));
}
function lastEnvio(id){return S.comments.filter(c=>c.postId===id&&c.tipo==="envio").map(c=>c.fecha).sort().pop()||""}
function approvalState(x){
  const req=approversOf(x), since=lastEnvio(x.id);
  const ap=S.comments.filter(c=>c.postId===x.id&&c.tipo==="aprobado"&&(!since||c.fecha>=since)).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const done=new Map(); for(const a of ap) if(a.personaId) done.set(a.personaId,a);
  const pend=x.estado==="Enviado a cliente"?req.filter(p=>!done.has(p.id)):[];
  return {req,ap,done,pend,since};
}
function pieceOf(kind,id){return kind==="medio"?S.medios.get(id):S.posts.get(id)}
async function recordApproval(kind,id,pid,nota){
  const per=personaById(pid);
  if(per&&per.org===myOrg()&&!myPersona()) setYo(per.id);
  await postComment(id,{tipo:"aprobado",texto:nota||"",...(per?actorFields(per):autoActor("aprobado"))});
  const x=pieceOf(kind,id); const st=approvalState(x);
  if(!st.req.length||!st.pend.length){S.quietTrace=true;try{kind==="medio"?await saveMed(id,{estado:"Programado",cambiosPendientes:false}):await save(id,{estado:"Programado",cambiosPendientes:false})}finally{S.quietTrace=false}toast(per?`Aprobada por ${per.nombre}`:"Aprobada")}
  else toast(`Aprobada por ${per?per.nombre:"ti"} · falta ${st.pend.map(p=>p.nombre).join(", ")}`);
}
function approveAsCtl(kind,x){
  const st=approvalState(x); const me=myPersona();

/* registro de cambios de estado y fecha (para la trazabilidad) */
function traceLog(kind,cur,patch,changed){
  if(S.quietTrace||!S.db) return;
  const out=[];
  if("estado" in changed&&!("cambiosPendientes" in patch)) out.push({tipo:"estado",texto:`${cur.estado||"—"} → ${changed.estado}`});
  if(cur.enviadoEn){
    if(kind==="post"&&("fecha" in changed||"hora" in changed)) out.push({tipo:"fecha",texto:`${cur.fecha?fmtDia(cur.fecha):"sin fecha"}${cur.hora?" "+cur.hora:""} → ${(changed.fecha??cur.fecha)?fmtDia(changed.fecha??cur.fecha):"sin fecha"}${(changed.hora??cur.hora)?" "+(changed.hora??cur.hora):""}`});
    if(kind==="medio"&&("inicio" in changed||"fin" in changed)) out.push({tipo:"fecha",texto:`Legal ${medRange(cur)} → ${medRange({...cur,...changed})}`});
  }
  for(const o of out) setTimeout(()=>postComment(cur.id,o),0);
}

/* trazabilidad */
function toHM(h){const m=/(\d{1,2})(?::(\d{2}))?\s*(am|pm|a\.\s*m\.|p\.\s*m\.)?/i.exec(h||"");if(!m) return "09:00";let H=+m[1];const pm=m[3]&&/p/i.test(m[3]);if(pm&&H<12) H+=12;if(m[3]&&!pm&&H===12) H=0;return String(H).padStart(2,"0")+":"+(m[2]||"00")}
const dayDiff=(a,b)=>Math.round((Date.parse(b.slice(0,10)+"T12:00")-Date.parse(a.slice(0,10)+"T12:00"))/864e5);
const dTxt=n=>`${Math.abs(n)} día${Math.abs(n)===1?"":"s"}`;
function fechaLarga(s){if(!s) return "";const d=new Date(s.length<=10?s+"T12:00":s);return d.toLocaleString("es",{weekday:"short",day:"numeric",month:"short",...(s.length>10?{hour:"numeric",minute:"2-digit"}:{})})}
function traceData(kind,x){
  const cms=S.comments.filter(c=>c.postId===x.id);
  const pub=kind==="medio"?(x.inicio||""):(x.fecha||"");
  const envs=cms.filter(c=>c.tipo==="envio").sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const env=envs.at(-1); const enviada=env?env.fecha:(x.enviadoEn||"");
  const st=approvalState(x); const aprobada=["Programado","Publicado"].includes(x.estado)&&st.ap.length?st.ap.at(-1).fecha:"";
  const ev=[];
  if(x.creado) ev.push({f:x.creado,ic:"＋",t:"Creada en la plataforma"});
  if(x.comentariosSlide) ev.push({f:"",ic:"💬",org:"cliente",t:"Comentario del cliente en la matriz",q:x.comentariosSlide});
  for(const c of cms){
    const who=c.personaNombre||nameOf(c.autorId,c.autorNombre), org=orgOf(c), reg=c.registradoPor?` · registrado por ${c.registradoPor}`:"";
    if(c.tipo==="envio") ev.push({f:c.fecha,ic:"📤",org,k:"env",t:`${who} envió a aprobación del cliente${reg}`,q:c.texto,s:x.fechaEnvio&&c===env&&x.fechaEnvio!==c.fecha.slice(0,10)?`Fecha de envío declarada: ${fechaLarga(x.fechaEnvio)}`:""});
    else if(c.tipo==="aprobado") ev.push({f:c.fecha,ic:"✅",org,k:"ok",t:`${who} aprobó${reg}`,q:c.texto});
    else if(c.tipo==="cambios") ev.push({f:c.fecha,ic:"✏️",org,k:"bad",t:`${who} pidió cambios${reg}`,q:c.texto});
    else if(c.tipo==="respuesta") ev.push({f:c.fecha,ic:"↩",org,t:`${who} respondió un comentario${reg}`,q:c.texto});
    else if(c.tipo==="estado") ev.push({f:c.fecha,ic:"●",org,t:`${who} cambió el estado: ${c.texto}`});
    else if(c.tipo==="fecha") ev.push({f:c.fecha,ic:"📅",org,k:"warn",t:`${who} cambió la fecha: ${c.texto}`});
    else ev.push({f:c.fecha,ic:"💬",org,t:`${who} comentó${c.parte&&PARTES[c.parte]&&c.parte!=="general"?` sobre ${PARTES[c.parte].toLowerCase()}`:""}${reg}`,q:c.texto});
    if(c.resuelto&&c.resueltoEn) ev.push({f:c.resueltoEn,ic:"✓",t:`${nameOf(c.resueltoPor)} resolvió el comentario de ${who}`});
  }
  if(pub) ev.push({f:pub+"T"+(kind==="post"&&x.hora?toHM(x.hora):"09:00"),ic:"★",k:"pub",t:kind==="medio"?"Sale al aire (inicio del legal)":"Fecha de publicación",milestone:true});
  ev.sort((a,b)=>(a.f?0:-1)-(b.f?0:-1)||(a.f||"").localeCompare(b.f||""));
  const alerts=[]; const today=new Date().toISOString().slice(0,10);
  const envRef=x.fechaEnvio||enviada;
  if(envRef&&pub){const n=dayDiff(envRef,pub);alerts.push(n>=0?{k:"",t:`Inside la envió ${dTxt(n)} antes de la ${kind==="medio"?"salida":"publicación"}`}:{k:"bad",t:`Se envió ${dTxt(n)} después de la fecha de ${kind==="medio"?"salida":"publicación"}`})}
  if(aprobada&&enviada){const n=dayDiff(enviada,aprobada);alerts.push({k:"",t:n?`El cliente aprobó ${dTxt(n)} después del envío`:"El cliente aprobó el mismo día del envío"})}
  if(aprobada&&pub&&aprobada.slice(0,10)>pub) alerts.push({k:"bad",t:`⚠ Aprobada ${dTxt(dayDiff(pub,aprobada))} después de la fecha de ${kind==="medio"?"salida":"publicación"} prevista`});
  if(x.estado==="Enviado a cliente"&&enviada){const n=dayDiff(enviada,today);alerts.push({k:n>=3?"warn":"",t:`⏳ Lleva ${dTxt(n)} con el cliente${st.pend.length?` · falta ${st.pend.map(p=>p.nombre).join(", ")}`:""}`});
    if(pub){const m=dayDiff(today,pub);alerts.push(m<0?{k:"bad",t:`La fecha de ${kind==="medio"?"salida":"publicación"} pasó hace ${dTxt(m)} sin aprobación`}:{k:m<=2?"warn":"",t:m?`Sale en ${dTxt(m)}`:"Sale hoy"})}}
  return {ev,enviada,aprobada,pub,alerts,st};
}
function traceBox(kind,x){

    ${edit?`<div class="chips apedit">${cl.map(p=>`<button class="chip" data-aptog="${kind}|${esc(x.id)}|${esc(p.id)}" aria-pressed="${st.req.includes(p)}">${esc(p.nombre)}</button>`).join("")}${Array.isArray(x.aprobadores)&&x.aprobadores.length?`<button class="clink" data-apauto="${kind}|${esc(x.id)}">Volver al automático (por país)</button>`:""}</div>`:""}

      <ol>${d.ev.map(e=>`<li class="${e.k||""} ${e.milestone?"ms":""} ${e.f&&e.f.slice(0,10)>new Date().toISOString().slice(0,10)?"fut":""}"><i>${e.ic}</i><div><b>${esc(e.t)}</b>${e.q?`<p>«${esc(e.q.slice(0,280))}»</p>`:""}${e.s?`<small>${esc(e.s)}</small>`:""}<small>${e.f?esc(fechaLarga(e.milestone?e.f.slice(0,10):e.f)):"sin fecha (de la matriz)"}</small></div></li>`).join("")}</ol>
    </details>
  </section>`;
}

  return `<div class="chips apf" role="group" aria-label="Pendiente de"><span class="flabel">Pendiente de</span><button class="chip" data-inap="ALL" aria-pressed="${f==="ALL"}">Todos</button>${ps.map(p=>`<button class="chip" data-inap="${esc(p.id)}" aria-pressed="${f===p.id}">${esc(p.nombre)} <span class="n">${m.get(p.id)||0}</span></button>`).join("")}${none?`<button class="chip" data-inap="NONE" aria-pressed="${f==="NONE"}">Sin aprobador <span class="n">${none}</span></button>`:""}</div>`}
function inboxApFilter(x){const f=S.inboxAp||"ALL";if(f==="ALL") return true;const st=approvalState(pieceOf(x.kind,x.id));return f==="NONE"?!st.req.length:st.pend.some(p=>p.id===f)}
function inboxApLine(x){const pc=pieceOf(x.kind,x.id);if(!pc) return "";const st=approvalState(pc);const n=x.en?dayDiff(x.en,new Date().toISOString()):null;return `<small class="apl">${st.pend.length?`Falta: ${esc(st.pend.map(p=>p.nombre).join(", "))}`:st.req.length?"":"Sin aprobador asignado"}${n!=null?` · ${n?`hace ${dTxt(n)}`:"hoy"}`:""}</small>`}
document.addEventListener("click",e=>{const b=e.target.closest("[data-inap]");if(b){S.inboxAp=b.dataset.inap;renderInboxPanel()}});

/* directorio del equipo */
async function savePersona(id,patch){const cur=personaById(id)||{};const doc={...cur,...patch,id};S.personas=S.personas||new Map();S.personas.set(id,doc);if(S.eqOpen) renderEquipo();try{await S.db.doc("personas/"+id).set(doc)}catch(e){toast("No se pudo guardar.")}}
async function seedPersonas(){if(S._seededP||role()!=="inside"||!S.db) return;S._seededP=true;for(const p of EQUIPO_BASE){try{await S.db.doc("personas/"+p.id).set({...p,creado:new Date().toISOString()})}catch(e){}}}
function renderEquipo(){
  let root=$("#eqRoot"); if(!S.eqOpen){root&&root.remove();return}
  if(!root){root=document.createElement("div");root.id="eqRoot";document.body.appendChild(root)}
  const ed=canEdit(); const me=myPersona(); const {m}=pendingByApprover();
  const cmsBy=id=>S.comments.filter(c=>c.personaId===id).length;
  const card=p=>`<article class="pcard" data-pid="${esc(p.id)}">
    ${ed?`<div class="redcfg"><label>Nombre<input data-pe="nombre" value="${esc(p.nombre)}"></label><label>Rol<select data-pe="rol">${[...new Set([...(ROLES[p.org]||[]),p.rol].filter(Boolean))].map(r=>`<option ${r===p.rol?"selected":""}>${esc(r)}</option>`).join("")}</select></label><label>Correo<input data-pe="email" value="${esc(p.email||"")}" placeholder="opcional"></label></div>`
      :`<header><i class="cav ${p.org}">${esc(initials(p.nombre))}</i><span class="cwho"><b>${esc(p.nombre)}</b><span class="corg ${p.org}">${esc(p.rol||"")}</span></span></header>`}
    ${p.org==="cliente"?`<label class="hint"><input type="checkbox" data-pe="aprueba" ${p.aprueba?"checked":""} ${ed?"":"disabled"}> Aprueba piezas</label>`:""}
    <div class="chips"><span class="flabel">${p.org==="cliente"?"Responsable de":"Regiones"}</span>${REGIONES.map(r=>`<button class="chip" ${ed?`data-preg="${r.id}"`:"disabled"} aria-pressed="${(p.regiones||[]).includes(r.id)}">${r.corto}</button>`).join("")}</div>
    ${ed||p.paises&&p.paises.length?`<div class="chips"><span class="flabel">Países</span>${ALL_PAISES.map(c=>`<button class="chip sm" ${ed?`data-ppais="${c}"`:"disabled"} aria-pressed="${paisesOf(p).includes(c)}" title="${esc(PAIS[c]||c)}">${c}</button>`).join("")}</div>`:""}
    <footer>${p.org==="cliente"&&p.aprueba?`<button class="clink" data-eqpend="${esc(p.id)}">⏳ ${m.get(p.id)||0} por aprobar</button>`:""}<span class="hint">💬 ${cmsBy(p.id)} comentarios</span>${p.porConfirmar?`<span class="cchg">Nombre por confirmar</span>`:""}${me&&me.id===p.id?`<span class="ok">Eres tú</span>`:""}${ed?`<button class="clink" data-pdel="${esc(p.id)}">Quitar</button>`:""}</footer>
  </article>`;
  const ps=personas();
  const gaps=REGIONES.filter(r=>!ps.some(p=>p.org==="cliente"&&p.aprueba&&(p.regiones||[]).includes(r.id)||r.paises.every(c=>ps.some(p=>p.org==="cliente"&&p.aprueba&&paisesOf(p).includes(c)))));
  root.innerHTML=`<div class="scrim modal" data-eqclose><div class="dialog eqd" role="dialog" aria-label="Equipo"><header><h3>👥 Equipo y aprobadores</h3><button class="iconbtn" data-eqclose aria-label="Cerrar">✕</button></header>
    <div class="eqyo">${asSelect("eqYo",ps.filter(p=>p.org===myOrg()),me&&me.id,"¿Quién eres?")}<span class="hint">Tus comentarios y aprobaciones quedan con tu nombre. Se recuerda en este navegador.</span>${!me&&S.me&&S.me.name&&(ed||role()==="cliente")?`<button class="btn sm" data-padme>＋ Agregarme como ${esc(S.me.name)} (${myOrg()==="cliente"?"Payless":"Inside"})</button>`:""}</div>
    <div class="trk">${REGIONES.map(r=>{const ap=ps.filter(p=>p.org==="cliente"&&p.aprueba&&paisesOf(p).some(c=>r.paises.includes(c)));return `<div><small><span class="rtag" style="--rc:var(${r.var})"><i></i>${r.nombre}</span></small><b>${ap.length?esc(ap.map(p=>p.nombre).join(", ")):"Sin aprobador"}</b></div>`}).join("")}</div>
    ${gaps.length?`<p class="hint" style="color:var(--bad)">Falta aprobador en: ${gaps.map(r=>r.nombre).join(", ")}.</p>`:""}
    <div class="eqcols">${[["cliente","Payless · cliente"],["inside","Inside · agencia"]].map(([o,l])=>`<section><h4>${l} <span>${ps.filter(p=>p.org===o).length}</span></h4>${ps.filter(p=>p.org===o).map(card).join("")}${ed?`<button class="btn sm" data-padd="${o}">＋ Agregar persona</button>`:""}</section>`).join("")}</div>
  </div></div>`;
}
document.addEventListener("click",async e=>{
  if(e.target.closest("#eqBtn")){S.eqOpen=true;renderEquipo();return}
  if(!S.eqOpen) return;
  if(e.target.matches("[data-eqclose]")||e.target.closest("button[data-eqclose]")){S.eqOpen=false;renderEquipo();return}
  const pid=e.target.closest("[data-pid]")?.dataset.pid; const per=personaById(pid);
  const rg=e.target.closest("[data-preg]"); if(rg&&per){const r=rg.dataset.preg;const a=(per.regiones||[]).includes(r)?per.regiones.filter(x=>x!==r):[...(per.regiones||[]),r];await savePersona(pid,{regiones:a,paises:[]});return}
  const pp=e.target.closest("[data-ppais]"); if(pp&&per){const c=pp.dataset.ppais;const cur=paisesOf(per);const a=cur.includes(c)?cur.filter(x=>x!==c):[...cur,c];await savePersona(pid,{paises:ALL_PAISES.filter(x=>a.includes(x)),regiones:REGIONES.filter(r=>r.paises.some(x=>a.includes(x))).map(r=>r.id)});return}
  if(e.target.closest("[data-padme]")){const id="p-"+Date.now().toString(36);const o=myOrg();await savePersona(id,{nombre:S.me.name,org:o,rol:o==="cliente"?"Coordinador/a":"Ejecutiva de cuentas",aprueba:false,regiones:[],paises:[],userIds:S.myId?[S.myId]:[],creado:new Date().toISOString()});setYo(id);renderEquipo();return}
  const ad=e.target.closest("[data-padd]"); if(ad){const o=ad.dataset.padd;const id="p-"+Date.now().toString(36);await savePersona(id,{nombre:o==="cliente"?"Nueva persona Payless":"Nueva persona Inside",org:o,rol:o==="cliente"?"Aprobador/a de región":"Ejecutiva de cuentas",aprueba:o==="cliente",regiones:[],paises:[],creado:new Date().toISOString()});return}
  const dl=e.target.closest("[data-pdel]"); if(dl&&per){if(!confirm(`¿Quitar a ${per.nombre} del equipo? Sus comentarios se conservan.`)) return;await savePersona(pid,{activo:false});return}
  const pe=e.target.closest("[data-eqpend]"); if(pe){S.eqOpen=false;renderEquipo();S.inboxAp=pe.dataset.eqpend;S.inboxF=null;S.inboxSeen=lastSeen();S.inboxOpen=true;renderInboxPanel();return}
});
document.addEventListener("change",async e=>{
  if(!S.eqOpen) return; const el=e.target.closest("[data-pe]"); if(!el) return; const pid=el.closest("[data-pid]").dataset.pid;
  const k=el.dataset.pe; const v=el.type==="checkbox"?el.checked:el.value.trim(); if(k==="nombre"&&!v) return;
  await savePersona(pid,{[k]:v,...(k==="nombre"?{porConfirmar:false}:{})});
});
document.addEventListener("keydown",e=>{if(S.eqOpen&&e.key==="Escape"){S.eqOpen=false;renderEquipo()}});

async function boot(){
  S.month=pickMonth(); render();
  const use=n=>(window.claude&&window.claude.use)?Promise.resolve(window.claude.use(n)).catch(()=>null):Promise.resolve(null);
  const [db,user,assets]=await Promise.all([use("db"),use("user"),use("assets")]);
  if(!db){await offline();return}
  S.db=db; S.user=user; S.assets=assets;
  use("sample").then(f=>{S.sampleFn=f||null;rerenderOpen()});
  if(user){
    try{S.myId=await user.id()}catch(e){}
    try{S.me=await user.me()}catch(e){}
    let ed=false,wr=null; try{ed=await user.canEdit()}catch(e){} try{wr=await user.can("data.write")}catch(e){}
    let own=false; try{own=await user.isOwner()}catch(e){}
    let guest=null; try{if(S.myId){const pr=await user.profiles([S.myId]);if(pr[S.myId]) guest=!!pr[S.myId].guest}}catch(e){}
    // Inside = dueña o miembros de la organización; Payless entra como invitado externo
    const inside=own||(guest===false&&wr!==false)||(guest===null&&ed);
    S.role=inside&&wr!==false?"inside":(wr===false?"lectura":"cliente");
  }else S.role="cliente";
  let first=true;
  db.collection("posts").onSnapshot(snap=>{
    const m=new Map(); for(const d of snap.docs) m.set(d.id,normalize({...d.data(),id:d.id}));
    S.posts=m; S.mode="live";
    if(first){first=false;S.month=pickMonth();setTimeout(handleDeepLink,400);setTimeout(()=>{if(S.role==="inside") migrateParrillaDates()},1500);setTimeout(()=>{if(S.role==="inside") autoLinkSeries()},3200)}
    render(); if(S.openId) renderSheet();
  },err=>{if(!S.posts.size) offline(); else toast("Se perdió la conexión en vivo. Recarga la página.")});
  db.collection("comentarios").onSnapshot(async snap=>{
    S.comments=snap.docs.map(d=>({...d.data(),_id:d.id}));
    const ids=[...new Set([...(S.envios||[]).map(e=>e.porId),...S.comments.flatMap(c=>[c.autorId,c.resueltoPor]),...[...(S.medios||new Map()).values()].map(m=>m.slideResueltoPor)].filter(Boolean))].slice(0,64);
    if(user&&ids.length){try{S.profiles=await user.profiles(ids)}catch(e){}}
    if(S.openId) renderSheet(); if(S.openMed) renderMedioSheet(); if(S.f.section==="med") renderView(); else renderSummary();
  },()=>{});
  db.collection("personas").onSnapshot(snap=>{const m=new Map();for(const d of snap.docs) m.set(d.id,{...d.data(),id:d.id});S.personas=m;if(!m.size&&role()==="inside") seedPersonas();render();rerenderOpen();if(S.eqOpen) renderEquipo();if(S.inboxOpen) renderInboxPanel()},()=>{});
  db.collection("series").onSnapshot(snap=>{const m=new Map();for(const d of snap.docs) m.set(d.id,{...d.data(),id:d.id});S.series=m;render();if(S.openId) renderSheet()},()=>{});
  db.collection("feedorden").onSnapshot(snap=>{const o={};for(const d of snap.docs){const v=d.data();if(v&&v.pais&&v.mes) o[feedKey(v.pais,v.mes)]=v.orden||[]}S.feedOrd=o;if(S.f.view==="grid") renderView()},()=>{});
  db.collection("redaccion").onSnapshot(snap=>{const r={marca:{},camps:{},docs:{}};for(const d of snap.docs){const v=d.data();if(d.id==="marca") r.marca=v; else if(d.id.startsWith("camp-")) r.camps[d.id.slice(5)]=v; else if(d.id.startsWith("doc-")) r.docs[d.id]={...v,id:d.id}; else if(d.id==="catalogo") r.catalogo=v; else if(d.id.startsWith("prop-")) (r.props=r.props||{})[d.id]={...v,id:d.id}; else if(d.id.startsWith("reu-")) (r.reus=r.reus||{})[d.id]={...v,id:d.id}}S.red=r;if(S.redC) renderRedCenter()},()=>{});
  db.collection("envios").onSnapshot(snap=>{S.envios=snap.docs.map(d=>({...d.data(),_id:d.id}));if(S.f.section==="med"&&S.f.mview==="env") renderView()},()=>{});
  db.collection("medios").onSnapshot(snap=>{const m=new Map();for(const d of snap.docs) m.set(d.id,medNorm({...d.data(),id:d.id}));S.medios=m;if(S.f.section==="med"||S.f.section==="all") render();if(S.openMed) renderMedioSheet()},()=>{});
  setTimeout(()=>{if(S.mode==="loading") offline()},12000);
}
boot();
</script>
