<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cerebro LEGO · Gestión Inside</title>
<style>
/* ============ Tokens ============ */
:root{
  --bg:#F6F5F1;
  --panel:#FFFFFF;
  --panel-2:#FBFAF7;
  --ink:#1B1B1F;
  --ink-2:#5A5A63;
  --ink-3:#8B8B95;
  --line:#E7E5DE;
  --line-2:#D8D6CE;
  --lego:#D01012;          /* rojo LEGO — marca / cliente */
  --lego-soft:#FBE9E9;
  --inside:#0055BF;        /* azul LEGO — equipo INSIDE */
  --inside-soft:#E7EFFA;
  --brick:#F5C518;         /* amarillo brick — resaltado */
  --brick-soft:#FBF3D2;
  --ok:#1F8A4C; --ok-soft:#E4F3EA;
  --warn:#B7791F; --warn-soft:#FBF1DD;
  --bad:#C22B2B; --bad-soft:#FBE9E9;
  --shadow:0 1px 2px rgba(27,27,31,.05),0 8px 24px -12px rgba(27,27,31,.12);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#17171A; --panel:#1F1F24; --panel-2:#26262C;
    --ink:#F0EFEA; --ink-2:#B4B3BC; --ink-3:#84838E;
    --line:#33333B; --line-2:#43434C;
    --lego:#F0393B; --lego-soft:#3A2224;
    --inside:#5C9BE8; --inside-soft:#1F2A3C;
    --brick:#F5C518; --brick-soft:#3A331A;
    --ok:#4CC07E; --ok-soft:#1E3128;
    --warn:#E0A94E; --warn-soft:#37301F;
    --bad:#F06A6A; --bad-soft:#3A2224;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.5);
  }
}
:root[data-theme="light"]{
  --bg:#F6F5F1; --panel:#FFFFFF; --panel-2:#FBFAF7;
  --ink:#1B1B1F; --ink-2:#5A5A63; --ink-3:#8B8B95;
  --line:#E7E5DE; --line-2:#D8D6CE;
  --lego:#D01012; --lego-soft:#FBE9E9;
  --inside:#0055BF; --inside-soft:#E7EFFA;
  --brick:#F5C518; --brick-soft:#FBF3D2;
  --ok:#1F8A4C; --ok-soft:#E4F3EA;
  --warn:#B7791F; --warn-soft:#FBF1DD;
  --bad:#C22B2B; --bad-soft:#FBE9E9;
  --shadow:0 1px 2px rgba(27,27,31,.05),0 8px 24px -12px rgba(27,27,31,.12);
}
:root[data-theme="dark"]{
  --bg:#17171A; --panel:#1F1F24; --panel-2:#26262C;
  --ink:#F0EFEA; --ink-2:#B4B3BC; --ink-3:#84838E;
  --line:#33333B; --line-2:#43434C;
  --lego:#F0393B; --lego-soft:#3A2224;
  --inside:#5C9BE8; --inside-soft:#1F2A3C;
  --brick:#F5C518; --brick-soft:#3A331A;
  --ok:#4CC07E; --ok-soft:#1E3128;
  --warn:#E0A94E; --warn-soft:#37301F;
  --bad:#F06A6A; --bad-soft:#3A2224;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.5);
}

/* ============ Base ============ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line-2);border-radius:7px;padding:7px 10px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--inside);outline-offset:1px}
::placeholder{color:var(--ink-3)}

.app{display:flex;min-height:100vh}

/* ============ Sidebar ============ */
.sidebar{
  width:248px;flex:0 0 248px;background:var(--panel);border-right:1px solid var(--line);
  padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;
}
.brandblock{display:flex;align-items:center;gap:12px;padding:4px 8px 18px}
.brick-logo{
  width:44px;height:34px;background:var(--lego);border-radius:5px;position:relative;flex:0 0 auto;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.22);
}
.brick-logo::before{
  content:"";position:absolute;top:-6px;left:5px;right:5px;height:8px;
  background:
    radial-gradient(circle at 5px 4px, var(--lego) 4.5px, transparent 5px),
    radial-gradient(circle at 17px 4px, var(--lego) 4.5px, transparent 5px),
    radial-gradient(circle at 29px 4px, var(--lego) 4.5px, transparent 5px);
}
.brandblock h1{font-size:15px;font-weight:800;letter-spacing:-.01em}
.brandblock small{color:var(--ink-2);font-size:11.5px;display:block}
.modepill{display:flex;gap:2px;background:var(--panel-2);border:1px solid var(--line);border-radius:99px;padding:3px;margin:0 4px 10px}
.modepill button{flex:1;padding:5px 8px;border-radius:99px;font-weight:700;font-size:12px;color:var(--ink-2)}
.modepill button.active{background:var(--ink);color:var(--bg)}
.modepill button.cli.active{background:var(--brick);color:#1B1B1F}
body.modo-cliente .only-interno{display:none !important}
.nav-label{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding:14px 10px 6px}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:8px 10px;border-radius:8px;font-weight:600;color:var(--ink-2);font-size:13.5px;
}
.nav-item:hover{background:var(--panel-2);color:var(--ink)}
.nav-item.active{background:var(--brick-soft);color:var(--ink)}
.nav-item .ico{width:20px;text-align:center}
.nav-item .cnt{margin-left:auto;font-size:11px;font-weight:700;background:var(--panel-2);border:1px solid var(--line);border-radius:99px;padding:0 7px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.nav-item.active .cnt{background:var(--brick);border-color:var(--brick);color:#1B1B1F}
.sidebar-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);font-size:11px;color:var(--ink-3);line-height:1.6}
.sidebar-foot .linkish{color:var(--ink-2);font-weight:600;text-decoration:underline;text-underline-offset:2px;padding:0}
.sidebar-foot .linkish:hover{color:var(--lego)}

/* ============ Main ============ */
.main{flex:1;min-width:0;padding:26px 32px 60px}
.topbar{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.topbar h2{font-size:23px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.topbar .sub{color:var(--ink-2);font-size:13px;margin-top:2px}
.topbar .spacer{flex:1}
.month-switch{display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px}
.month-switch button{padding:5px 10px;border-radius:6px;font-weight:700;color:var(--ink-2);font-size:13px}
.month-switch button:hover{background:var(--panel-2)}
.month-switch .mlabel{font-weight:800;min-width:130px;text-align:center;font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;font-weight:700;font-size:13px;border:1px solid var(--line-2);background:var(--panel)}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--lego);border-color:var(--lego);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--panel-2);color:var(--ink)}

/* ============ Cards / stats ============ */
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.stat .k{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.stat .d{font-size:12px;color:var(--ink-2)}
.stat.lego .v{color:var(--lego)} .stat.inside .v{color:var(--inside)}
.stat.warn .v{color:var(--warn)} .stat.bad .v{color:var(--bad)} .stat.ok .v{color:var(--ok)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:18px}
.card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:13px 16px;border-bottom:1px solid var(--line)}
.card-head h3{font-size:14.5px;font-weight:800}
.card-head .spacer{flex:1}
.card-body{padding:16px}

/* ============ Filters / chips ============ */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.fchip{padding:5px 12px;border-radius:99px;border:1px solid var(--line-2);font-weight:600;font-size:12.5px;color:var(--ink-2);background:var(--panel)}
.fchip:hover{border-color:var(--ink-3)}
.fchip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.fchip.on.f-lego{background:var(--lego);border-color:var(--lego);color:#fff}
.fchip.on.f-inside{background:var(--inside);border-color:var(--inside);color:#fff}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.lego{background:var(--lego-soft);color:var(--lego)}
.pill.inside{background:var(--inside-soft);color:var(--inside)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line)}
.pill.brick{background:var(--brick-soft);color:#7A6206}
:root[data-theme="dark"] .pill.brick,:root:not([data-theme="light"]) .dark-brick{color:var(--brick)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 auto}

/* ============ Tables ============ */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--panel-2)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.tasktitle{font-weight:600;cursor:pointer}
.tasktitle:hover{color:var(--lego);text-decoration:underline;text-underline-offset:2px}
.tnote{font-size:12px;color:var(--ink-2);font-weight:400;margin-top:2px}
.overdue{color:var(--bad);font-weight:700}
.rowdone td{opacity:.55}
.rowdone .tasktitle{text-decoration:line-through}
.iconbtn{padding:3px 7px;border-radius:6px;color:var(--ink-3);font-size:13px}
.iconbtn:hover{background:var(--panel-2);color:var(--ink)}
.checkbtn{width:19px;height:19px;border-radius:5px;border:1.5px solid var(--line-2);display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:transparent;flex:0 0 auto}
.checkbtn:hover{border-color:var(--ok);color:var(--ok)}
.checkbtn.done{background:var(--ok);border-color:var(--ok);color:#fff}

/* ============ Planning counters ============ */
.countergrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.counter{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-align:center}
.counter .cv{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
.counter .ck{font-size:11px;color:var(--ink-2);font-weight:600}
.feebar{height:9px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden;margin-top:8px}
.feebar>div{height:100%;background:var(--brick);border-radius:99px 0 0 99px}
.feebar>div.over{background:var(--bad)}

/* ============ Calendar ============ */
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.calhead{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);text-align:center;padding:4px 0}
.calday{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:96px;padding:6px;display:flex;flex-direction:column;gap:4px}
.calday.empty{background:transparent;border-style:dashed;opacity:.5}
.calday .dnum{font-size:12px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;align-items:center}
.calday.today{border-color:var(--lego);border-width:2px}
.calday.today .dnum{color:var(--lego)}
.calitem{font-size:11px;font-weight:600;line-height:1.3;padding:3px 6px;border-radius:5px;background:var(--panel-2);border-left:3px solid var(--ink-3);cursor:pointer;text-align:left;width:100%}
.calitem:hover{filter:brightness(.96)}
:root[data-theme="dark"] .calitem:hover{filter:brightness(1.15)}
.calitem.f-Reel{border-left-color:var(--lego)}
.calitem.f-Carrusel{border-left-color:var(--inside)}
.calitem.f-Estático{border-left-color:var(--ok)}
.calitem.f-Story{border-left-color:var(--brick)}
.calitem.f-Animación,.calitem.f-Video{border-left-color:#9061C2}
.calitem .extra-flag{color:var(--warn);font-weight:800}
.callegend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--ink-2)}
.callegend span{display:inline-flex;align-items:center;gap:6px}
.callegend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ============ Meetings ============ */
.meetlayout{display:grid;grid-template-columns:290px 1fr;gap:18px;align-items:start}
@media (max-width:900px){.meetlayout{grid-template-columns:1fr}}
.meetitem{width:100%;text-align:left;padding:12px 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel);margin-bottom:8px;display:block}
.meetitem:hover{border-color:var(--ink-3)}
.meetitem.sel{border-color:var(--lego);border-width:2px;padding:11px 13px}
.meetitem .mt{font-weight:700;font-size:13.5px}
.meetitem .md{font-size:12px;color:var(--ink-2);margin-top:2px;font-variant-numeric:tabular-nums}
.acuerdo{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.acuerdo:last-child{border-bottom:none}
.acuerdo .atext{flex:1;min-width:0}
.acuerdo .atext p{font-size:13.5px}
.acuerdo.done .atext p{text-decoration:line-through;opacity:.55}
.acuerdo .ameta{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.candidate{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:7px;background:var(--panel-2)}
.candidate textarea{flex:1;min-height:38px;resize:vertical;background:var(--panel)}

/* ============ Modal ============ */
.modal-back{position:fixed;inset:0;background:rgba(20,20,24,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow-y:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(620px,100%);padding:22px}
.modal h3{font-size:17px;font-weight:800;margin-bottom:14px;letter-spacing:-.01em}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.formgrid .full{grid-column:1/-1}
.formgrid label{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.formgrid input,.formgrid select,.formgrid textarea{width:100%}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.modal-actions .danger{color:var(--bad);margin-right:auto}
textarea{resize:vertical}

.empty-note{color:var(--ink-3);font-size:13px;padding:18px;text-align:center}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:99px;font-weight:700;font-size:13px;z-index:99;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:pop .18s ease-out}
  @keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
}
@media (max-width:760px){
  .app{flex-direction:column}
  .sidebar{width:100%;flex:none;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center}
  .sidebar-foot{display:none}
  .main{padding:18px 14px 50px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brandblock">
      <div class="brick-logo" aria-hidden="true"></div>
      <div>
        <h1>Cerebro LEGO</h1>
        <small>Gestión de marca · INSIDE</small>
      </div>
    </div>
    <div class="modepill" id="modePill" title="Modo de la herramienta">
      <button data-mode="interno" class="active">✏️ Interno</button>
      <button data-mode="cliente" class="cli">👁️ Cliente</button>
    </div>
    <div class="nav-label">Espacios</div>
    <button class="nav-item" data-view="gestion"><span class="ico">📌</span> Gestión de la marca <span class="cnt" id="cntGestion">0</span></button>
    <button class="nav-item" data-view="planning"><span class="ico">🧱</span> Planning &amp; piezas <span class="cnt" id="cntPlanning">0</span></button>
    <button class="nav-item" data-view="calendario"><span class="ico">📅</span> Calendario</button>
    <button class="nav-item" data-view="reuniones"><span class="ico">🤝</span> Reuniones &amp; acuerdos <span class="cnt" id="cntAcuerdos">0</span></button>
    <div class="only-interno" style="display:contents">
      <div class="nav-label">Datos</div>
      <button class="nav-item" id="btnExport"><span class="ico">⬇️</span> Exportar respaldo</button>
      <button class="nav-item" id="btnImport"><span class="ico">⬆️</span> Importar respaldo</button>
      <input type="file" id="importFile" accept="application/json" style="display:none" />
    </div>
    <div class="sidebar-foot">
      Todo se guarda automáticamente en este navegador.<br />
      <button class="linkish only-interno" id="btnReset">Restaurar datos iniciales</button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="modalRoot"></div>

<script>
/* =====================================================================
   CEREBRO LEGO — datos semilla
   Levantados del Planning Julio 2026 (matriz) y la reunión del 20.07.26
   (Andrea Vasquez · LEGO — Victoria Alvarado & Roald Aedo · INSIDE)
   ===================================================================== */
const LS_KEY = "legoBrain_v1";
const HOY = new Date(); HOY.setHours(0,0,0,0);

const SEED = {
  settings: { feeCupo: { "2026-08": 15 }, modo: "interno" },

  pendientes: [
    { id:"p1", tarea:"Enviar resumen de adicionales aprobados por correo", detalle:"Total extras hasta ahora: S/ 2,610 (Spiderman táctica 1,060 + Larcomar 1,200 + adicionales 350). Andrea lo revisa al recibirlo.", responsable:"INSIDE", solicitadoPor:"Andrea (LEGO)", fechaPedido:"2026-07-20", fechaCompromiso:"2026-07-21", fechaEnvio:"", prioridad:"alta", estado:"pendiente", origen:"Reunión 20.07" },
    { id:"p2", tarea:"Enviar temáticas y códigos de agosto para la segunda matriz", detalle:"Con eso INSIDE cruza las piezas faltantes de agosto (quedan 3 del fee) y arma la segunda quincena.", responsable:"LEGO", solicitadoPor:"Victoria (INSIDE)", fechaPedido:"2026-07-20", fechaCompromiso:"2026-07-24", fechaEnvio:"", prioridad:"alta", estado:"pendiente", origen:"Reunión 20.07" },
    { id:"p3", tarea:"Actualizar matriz de julio: eliminar los 2 videos tiktokeros", detalle:"Acordado en reunión: los 2 videos tiktokeros del Día del Niño no van; su lugar lo toman los reels de mundos.", responsable:"INSIDE", solicitadoPor:"Andrea (LEGO)", fechaPedido:"2026-07-20", fechaCompromiso:"2026-07-21", fechaEnvio:"", prioridad:"media", estado:"pendiente", origen:"Reunión 20.07" },
    { id:"p4", tarea:"Programar post Cumpleaños de Harry Potter", detalle:"Sale el miércoles 29.07 (evento viernes 31 y sábado 01). Se cuenta como EXTRA, no como pieza de agosto.", responsable:"INSIDE", solicitadoPor:"Andrea (LEGO)", fechaPedido:"2026-07-20", fechaCompromiso:"2026-07-29", fechaEnvio:"", prioridad:"alta", estado:"pendiente", origen:"Reunión 20.07" },

/* Piezas de la matriz FINAL que aún esperan aprobación del cliente
   (guiones de mundos por alinear, arte que envía el cliente, dinámica por confirmar) */
const APROB_PENDIENTE_SEED = new Set(["j40","j44","j50","a07","a08","a09","a10","a11","a12"]);
function load(){
  try{ const raw = localStorage.getItem(LS_KEY); S = raw ? JSON.parse(raw) : structuredClone(SEED); }
  catch(e){ S = structuredClone(SEED); }
  /* migraciones suaves para datos guardados de versiones anteriores */
  S.settings = S.settings || {};
  S.settings.feeCupo = S.settings.feeCupo || { "2026-08": 15 };
  if(!S.settings.modo) S.settings.modo = "interno";
  S.planning.forEach(i=>{ if(i.aprobacion==null) i.aprobacion = APROB_PENDIENTE_SEED.has(i.id) ? "pendiente" : "aprobado"; });
}
const esInterno = ()=> S.settings.modo !== "cliente";
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(S)); refreshCounts(); }
function uid(){ return "x" + Math.random().toString(36).slice(2,9); }

/* ============ Utilidades ============ */
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const FORMATOS = ["Estático","Story","Carrusel","Animación","Reel"];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function fmtFecha(iso){
  if(!iso) return "—";
  const [y,m,d] = iso.split("-").map(Number);
  return `${String(d).padStart(2,"0")}.${String(m).padStart(2,"0")}.${String(y).slice(2)}`;
}
function fmtMes(mesKey){ const [y,m]=mesKey.split("-").map(Number); return MESES[m-1].charAt(0).toUpperCase()+MESES[m-1].slice(1)+" "+y; }
function isOverdue(p){
  return p.fechaCompromiso && p.estado!=="enviado" && p.estado!=="completado" && new Date(p.fechaCompromiso+"T00:00:00") < HOY;
}
/* Semáforo de cumplimiento (idea heredada de la herramienta Payless):
   en retraso = pasó el compromiso · en riesgo = vence en ≤2 días · en plazo = lo demás */
function cumplimiento(p){
  if(p.estado==="enviado"||p.estado==="completado") return "plazo";
  if(!p.fechaCompromiso) return "plazo";
  const d = new Date(p.fechaCompromiso+"T00:00:00");
  if(d < HOY) return "retraso";
  const en2 = new Date(HOY); en2.setDate(en2.getDate()+2);
  return d <= en2 ? "riesgo" : "plazo";
}
/* Pieza en riesgo: publica en ≤3 días y el cliente aún no la aprueba */
function piezaEnRiesgo(i){
  if(i.aprobacion!=="pendiente" || !i.fecha || i.status==="publicado") return false;
  const d = new Date(i.fecha+"T00:00:00");
  const en3 = new Date(HOY); en3.setDate(en3.getDate()+3);
  return d >= HOY && d <= en3;
}
function soles(n){ return "S/ " + Number(n||0).toLocaleString("es-PE"); }
function toast(msg){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t = document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2200);
}

  document.getElementById("cntGestion").textContent = activos.length;
  document.getElementById("cntPlanning").textContent = S.planning.filter(i=>i.mes===mesActual).reduce((a,i)=>a+Number(i.piezas||1),0);
  document.getElementById("cntAcuerdos").textContent = S.reuniones.reduce((a,r)=>a+r.acuerdos.filter(x=>x.estado==="vigente").length,0);
}

function render(){
  document.querySelectorAll(".nav-item[data-view]").forEach(b=>b.classList.toggle("active", b.dataset.view===view));
  document.body.classList.toggle("modo-cliente", !esInterno());
  document.querySelectorAll("#modePill button").forEach(b=>b.classList.toggle("active", b.dataset.mode===S.settings.modo));
  refreshCounts();
  const main = document.getElementById("main");
  if(view==="gestion") main.innerHTML = viewGestion();
  else if(view==="planning") main.innerHTML = viewPlanning();
  else if(view==="calendario") main.innerHTML = viewCalendario();
  else main.innerHTML = viewReuniones();
  bindMain();
}

/* =====================================================================
   VISTA 1 — GESTIÓN DE LA MARCA
   ===================================================================== */
function pillResp(r){
  if(r==="LEGO") return `<span class="pill lego"><span class="dot"></span>LEGO</span>`;
  if(r==="INSIDE") return `<span class="pill inside"><span class="dot"></span>INSIDE</span>`;
  return `<span class="pill neutral">Ambos</span>`;
}
function pillPrioridad(p){
  if(p==="alta") return `<span class="pill bad">Alta</span>`;
  if(p==="media") return `<span class="pill warn">Media</span>`;
  return `<span class="pill neutral">Baja</span>`;
}
function pillEstado(e){
  const map = { "pendiente":["neutral","Pendiente"], "en-curso":["warn","En curso"], "enviado":["ok","Enviado"], "completado":["ok","Completado"] };
  const [cls,txt] = map[e] || ["neutral",e];
  return `<span class="pill ${cls}">${txt}</span>`;
}

function viewGestion(){
  const interno = esInterno();
  const all = S.pendientes;
  const abiertos = all.filter(p=>p.estado!=="completado" && p.estado!=="enviado");
  const lego = abiertos.filter(p=>p.responsable==="LEGO");
  const inside = abiertos.filter(p=>p.responsable==="INSIDE");
  const retraso = abiertos.filter(p=>cumplimiento(p)==="retraso");
  const riesgo = abiertos.filter(p=>cumplimiento(p)==="riesgo");

  let rows = all.filter(p=>{
    if(filtros.resp!=="todos" && p.responsable!==filtros.resp) return false;
    if(filtros.estado==="activos" && (p.estado==="completado"||p.estado==="enviado")) return false;
    if(filtros.estado==="cerrados" && p.estado!=="completado" && p.estado!=="enviado") return false;
    if(filtros.q){
      const t = [p.tarea,p.detalle,p.solicitadoPor,p.origen].join(" ").toLowerCase();
      if(!t.includes(filtros.q.toLowerCase())) return false;
    }
    return true;
  });
  const prioridadOrden = {alta:0, media:1, baja:2};
  rows.sort((a,b)=>{
    const closed = x => (x.estado==="completado"||x.estado==="enviado") ? 1 : 0;
    if(closed(a)!==closed(b)) return closed(a)-closed(b);
    if(isOverdue(b)!==isOverdue(a)) return isOverdue(b)-isOverdue(a);
    if(prioridadOrden[a.prioridad]!==prioridadOrden[b.prioridad]) return prioridadOrden[a.prioridad]-prioridadOrden[b.prioridad];
    return (a.fechaCompromiso||"9999").localeCompare(b.fechaCompromiso||"9999");
  });

  return `
  <div class="topbar">
    <div>
      <h2>Gestión de la marca</h2>
      <div class="sub">Pendientes LEGO ↔ INSIDE · quién lo pidió, para cuándo quedó y cuándo se envía</div>
    </div>
    <div class="spacer"></div>
    <button class="btn" data-act="copiar-estatus" title="Genera el cuadro de estatus en texto">📋 Copiar estatus</button>
    <button class="btn primary only-interno" data-act="nuevo-pendiente">＋ Nuevo pendiente</button>
  </div>

  <div class="statrow">
    <div class="stat lego"><div class="k">Debe LEGO</div><div class="v">${lego.length}</div><div class="d">pendientes del cliente</div></div>
    <div class="stat inside"><div class="k">Debe INSIDE</div><div class="v">${inside.length}</div><div class="d">pendientes de la agencia</div></div>
    <div class="stat bad"><div class="k">En retraso</div><div class="v">${retraso.length}</div><div class="d">pasaron su fecha compromiso</div></div>
    <div class="stat warn"><div class="k">En riesgo</div><div class="v">${riesgo.length}</div><div class="d">vencen en los próximos 2 días</div></div>
  </div>

  <div class="filters">
    <button class="fchip ${filtros.resp==="todos"?"on":""}" data-fresp="todos">Todos</button>
    <button class="fchip f-lego ${filtros.resp==="LEGO"?"on":""}" data-fresp="LEGO">Debe LEGO</button>
    <button class="fchip f-inside ${filtros.resp==="INSIDE"?"on":""}" data-fresp="INSIDE">Debe INSIDE</button>
    <span style="color:var(--line-2)">|</span>
    <button class="fchip ${filtros.estado==="activos"?"on":""}" data-festado="activos">Activos</button>
    <button class="fchip ${filtros.estado==="cerrados"?"on":""}" data-festado="cerrados">✓ Cerrados</button>
    <button class="fchip ${filtros.estado==="todos"?"on":""}" data-festado="todos">Historial completo</button>
    <input type="search" id="buscaPend" placeholder="Buscar pendiente…" value="${esc(filtros.q)}" style="margin-left:auto;min-width:180px" />
  </div>

  <div class="card"><div class="tablewrap"><table>
    <thead><tr>
      <th></th><th>Pendiente</th><th>Responsable</th><th>Prioridad</th><th>Pedido</th><th>Compromiso</th><th>Enviado</th><th>Estado</th><th></th>
    </tr></thead>
    <tbody>
      ${rows.length ? rows.map(p=>{
        const closed = p.estado==="completado"||p.estado==="enviado";
        const cump = cumplimiento(p);
        return `<tr class="${closed?"rowdone":""}">
          <td><button class="checkbtn only-interno ${closed?"done":""}" data-toggle="${p.id}" title="${closed?"Reabrir":"Marcar enviado"}">✓</button></td>
          <td style="min-width:260px">
            <div class="tasktitle" data-edit-p="${p.id}">${esc(p.tarea)}</div>
            ${p.detalle?`<div class="tnote">${esc(p.detalle)}</div>`:""}
            ${p.solicitadoPor||p.origen?`<div class="tnote">Pidió: ${esc(p.solicitadoPor||"—")}${p.origen?` · <span class="pill brick" style="font-size:10.5px">${esc(p.origen)}</span>`:""}</div>`:""}
          </td>
          <td>${pillResp(p.responsable)}</td>
          <td>${pillPrioridad(p.prioridad)}</td>
          <td class="num">${fmtFecha(p.fechaPedido)}</td>
          <td class="num ${cump==="retraso"?"overdue":""}" ${cump==="riesgo"?`style="color:var(--warn);font-weight:700"`:""}>${fmtFecha(p.fechaCompromiso)}${cump==="retraso"?" ⚠":cump==="riesgo"?" ⏳":""}</td>
          <td class="num">${fmtFecha(p.fechaEnvio)}</td>
          <td>${pillEstado(p.estado)}</td>
          <td><button class="iconbtn only-interno" data-edit-p="${p.id}" title="Editar">✏️</button></td>
        </tr>`;
      }).join("") : `<tr><td colspan="9"><div class="empty-note">Nada por aquí con estos filtros.</div></td></tr>`}
    </tbody>
  </table></div></div>`;
}

function pillAprob(a){
  if(a==="aprobado") return `<span class="pill ok" title="Aprobación del cliente">✓ Aprobado</span>`;
  if(a==="ajustes") return `<span class="pill bad" title="Aprobación del cliente">✎ Con ajustes</span>`;
  return `<span class="pill warn" title="Aprobación del cliente">✋ Por aprobar</span>`;
}
function pillStatusPieza(st){
  const map = { "por-hacer":["neutral","Por hacer"], "en-diseno":["warn","En diseño"], "enviado":["inside","Enviado a cliente"], "aprobado":["ok","Aprobado"], "programado":["brick","Programado"], "publicado":["ok","Publicado"] };
  const [cls,txt] = map[st] || ["neutral",st];
  return `<span class="pill ${cls}">${txt}</span>`;
}

function viewPlanning(){
  const items = S.planning.filter(i=>i.mes===mesActual).sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||""));
  const feeItems = items.filter(i=>i.tipo==="fee");
  const extraItems = items.filter(i=>i.tipo==="extra");
  const feeUsado = feeItems.reduce((a,i)=>a+Number(i.piezas||1),0);
  const cupoRaw = S.settings.feeCupo[mesActual];
  const hayCupo = cupoRaw != null && cupoRaw !== "";
  const cupo = hayCupo ? Number(cupoRaw) : 0;
  const extrasSoles = extraItems.reduce((a,i)=>a+Number(i.costo||0),0);
  const porFormato = {};
  FORMATOS.forEach(f=>porFormato[f]=0);
  items.forEach(i=>{ porFormato[i.formato]=(porFormato[i.formato]||0)+Number(i.piezas||1); });
  const pct = Math.min(100, Math.round(feeUsado/Math.max(cupo,1)*100));

  const semanas = [...new Set(items.map(i=>i.semana))].sort((a,b)=>a-b);

  return `
  <div class="topbar">
    <div>
      <h2>Planning &amp; piezas</h2>
      <div class="sub">Matriz mensual con conteo de piezas · fee vs. extras cotizados</div>
    </div>
    <div class="spacer"></div>
    ${monthSwitch()}
    <button class="btn primary only-interno" data-act="nueva-pieza">＋ Nueva pieza</button>
  </div>

  ${(()=>{ const rg = items.filter(piezaEnRiesgo);
    return rg.length ? `<div class="card" style="border-color:var(--warn)"><div class="card-body" style="padding:11px 16px">
      ⚠️ <b>${rg.length} pieza${rg.length>1?"s":""} en riesgo:</b> publica${rg.length>1?"n":""} en los próximos días y el cliente aún no aprueba —
      ${rg.map(i=>`<button class="btn small ghost" data-edit-i="${i.id}" style="color:var(--warn)">${fmtFecha(i.fecha)} · ${esc(i.tema.slice(0,45))}</button>`).join(" ")}
    </div></div>` : ""; })()}

  <div class="card"><div class="card-body">
    <div style="display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start">
      <div style="flex:1;min-width:230px">
        <div class="k" style="font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)">Consumo del fee · ${fmtMes(mesActual)}</div>
        <div style="font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px">
          ${feeUsado}${hayCupo?` <span style="font-size:15px;color:var(--ink-2);font-weight:600">de</span> ${cupo}`:` <span style="font-size:15px;color:var(--ink-2);font-weight:600">piezas del fee</span>`}
          <button class="iconbtn only-interno" data-act="edit-cupo" title="Editar cupo del fee">✏️</button>
        </div>
        ${hayCupo?`<div class="feebar"><div class="${feeUsado>cupo?"over":""}" style="width:${pct}%"></div></div>
        <div class="tnote" style="margin-top:5px">${feeUsado>cupo ? `⚠ Excede el cupo por ${feeUsado-cupo} pieza(s)` : `Quedan <b>${cupo-feeUsado}</b> piezas del fee para este mes`}</div>`
        :`<div class="tnote" style="margin-top:5px">Cupo del fee sin definir para este mes — defínelo con el lápiz ✏️</div>`}
      </div>
      <div style="flex:0 0 auto;min-width:170px">
        <div style="font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)">Extras cotizados</div>
        <div style="font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px;color:var(--warn)">${soles(extrasSoles)}</div>
        <div class="tnote">${extraItems.length} pieza(s) fuera del fee</div>
      </div>
      <div style="flex:2;min-width:280px">
        <div style="font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px">Piezas por formato (fee + extras)</div>
        <div class="countergrid">
          ${FORMATOS.map(f=>`<div class="counter"><div class="cv">${porFormato[f]||0}</div><div class="ck">${f}${f==="Reel"?" / Video":""}</div></div>`).join("")}
        </div>
      </div>
    </div>
  </div></div>

  ${semanas.map(w=>{
    const sem = items.filter(i=>i.semana===w);
    return `<div class="card">
      <div class="card-head"><h3>Semana ${w}</h3><span class="pill neutral">${sem.reduce((a,i)=>a+Number(i.piezas||1),0)} piezas</span></div>
      <div class="tablewrap"><table>
        <thead><tr><th>Publica</th><th>Tema</th><th>Formato</th><th class="num">Piezas</th><th>Fee / Extra</th><th>Status</th><th>Cliente</th><th></th></tr></thead>
        <tbody>${sem.map(i=>`<tr>
          <td class="num">${fmtFecha(i.fecha)}</td>
          <td style="min-width:240px"><div class="tasktitle" data-edit-i="${i.id}">${esc(i.tema)}</div>${i.comentarios?`<div class="tnote">${esc(i.comentarios)}</div>`:""}</td>
          <td><span class="pill neutral">${esc(i.formato)}</span></td>
          <td class="num">${i.piezas}</td>
          <td>${i.tipo==="extra" ? `<span class="pill warn">Extra · ${soles(i.costo)}</span>` : `<span class="pill ok">Fee</span>`}</td>
          <td>${pillStatusPieza(i.status)}</td>
          <td>${pillAprob(i.aprobacion)}</td>
          <td><button class="iconbtn only-interno" data-edit-i="${i.id}" title="Editar">✏️</button></td>
        </tr>`).join("")}</tbody>
      </table></div>
    </div>`;
  }).join("") || `<div class="card"><div class="empty-note">Sin piezas cargadas para ${fmtMes(mesActual)}. Agrega la primera con “＋ Nueva pieza”.</div></div>`}`;
}

function monthSwitch(){
  return `<div class="month-switch">
    <button data-act="mes-prev" title="Mes anterior">‹</button>
    <span class="mlabel">${fmtMes(mesActual)}</span>
    <button data-act="mes-next" title="Mes siguiente">›</button>
  </div>`;
}

/* =====================================================================
   VISTA 3 — CALENDARIO
   ===================================================================== */
function viewCalendario(){
  const [y,m] = mesActual.split("-").map(Number);
  const first = new Date(y, m-1, 1);
  const days = new Date(y, m, 0).getDate();
  const startCol = (first.getDay()+6)%7; // lunes=0
  const items = S.planning.filter(i=>i.mes===mesActual);
  const byDay = {};
  items.forEach(i=>{ if(i.fecha){ (byDay[i.fecha] = byDay[i.fecha]||[]).push(i); } });

  let cells = "";
  for(let i=0;i<startCol;i++) cells += `<div class="calday empty"></div>`;
  for(let d=1; d<=days; d++){
    const iso = `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const isToday = new Date(iso+"T00:00:00").getTime()===HOY.getTime();
    const its = (byDay[iso]||[]);
    cells += `<div class="calday ${isToday?"today":""}">
      <div class="dnum"><span>${d}</span>${its.length?`<span style="color:var(--ink-3);font-size:10.5px">${its.length}</span>`:""}</div>
      ${its.map(i=>`<button class="calitem f-${esc(i.formato)}" data-edit-i="${i.id}" title="${esc(i.tema)}${i.aprobacion==="pendiente"?" · por aprobar":""}">${i.tipo==="extra"?`<span class="extra-flag">$</span> `:""}${i.aprobacion==="pendiente"&&i.status!=="publicado"?"✋ ":""}${esc(i.tema)}</button>`).join("")}
    </div>`;
  }

  return `
  <div class="topbar">
    <div>
      <h2>Calendario de publicaciones</h2>
      <div class="sub">Lo mismo que el planning, visto por día · haz clic en una pieza para editarla</div>
    </div>
    <div class="spacer"></div>
    ${monthSwitch()}
    <button class="btn primary only-interno" data-act="nueva-pieza">＋ Nueva pieza</button>
  </div>
  <div class="card"><div class="card-body">
    <div class="calgrid">
      ${["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"].map(d=>`<div class="calhead">${d}</div>`).join("")}
      ${cells}
    </div>
    <div class="callegend">
      <span><i style="background:var(--ok)"></i>Estático</span>
      <span><i style="background:var(--brick)"></i>Story</span>
      <span><i style="background:var(--inside)"></i>Carrusel</span>
      <span><i style="background:var(--lego)"></i>Reel / Video</span>
      <span><i style="background:#9061C2"></i>Animación</span>
      <span><b class="extra-flag" style="color:var(--warn)">$</b> Extra cotizado</span>
      <span>✋ Por aprobar del cliente</span>
    </div>
  </div></div>`;
}

        </div>
        <div class="card-body">
          ${r.acuerdos.length ? r.acuerdos.map(a=>`
          <div class="acuerdo ${a.estado==="cumplido"?"done":""}">
            <button class="checkbtn only-interno ${a.estado==="cumplido"?"done":""}" data-toggle-a="${r.id}|${a.id}" title="${a.estado==="cumplido"?"Reabrir":"Marcar cumplido"}">✓</button>

                ${pillResp(a.responsable)}

/* --- Cuadro de estatus en texto para correo / WhatsApp (idea Payless) --- */
function textoEstatus(){
  const abiertos = S.pendientes.filter(p=>p.estado!=="completado" && p.estado!=="enviado")
    .sort((a,b)=>(a.fechaCompromiso||"9999").localeCompare(b.fechaCompromiso||"9999"));
  const linea = p => `• ${p.prioridad==="alta"?"🔴 ":""}${p.tarea}${p.fechaCompromiso?` — límite ${fmtFecha(p.fechaCompromiso)}`:""}${cumplimiento(p)==="retraso"?" ⚠ EN RETRASO":""}`;
  const cl = abiertos.filter(p=>p.responsable==="LEGO");
  const ins = abiertos.filter(p=>p.responsable==="INSIDE");
  const items = S.planning.filter(i=>i.mes===mesActual);
  const porAprobar = items.filter(i=>i.aprobacion==="pendiente" && i.status!=="publicado")
    .sort((a,b)=>(a.fecha||"9999").localeCompare(b.fecha||"9999"));
  const extras = items.filter(i=>i.tipo==="extra");
  const extrasS = extras.reduce((a,i)=>a+Number(i.costo||0),0);
  const cerrados = S.pendientes.filter(p=>p.estado==="enviado"||p.estado==="completado");

  let t = `ESTATUS LEGO · ${fmtFecha(new Date().toISOString().slice(0,10))}\n`;
  t += `\n🧱 PENDIENTE DE LEGO (${cl.length}):\n${cl.map(linea).join("\n")||"• Nada pendiente"}\n`;
  t += `\n🏠 EN CURSO POR INSIDE (${ins.length}):\n${ins.map(linea).join("\n")||"• Nada pendiente"}\n`;
  if(porAprobar.length) t += `\n✋ PIEZAS POR APROBAR (${porAprobar.length}):\n${porAprobar.map(i=>`• ${fmtFecha(i.fecha)} · ${i.tema}`).join("\n")}\n`;
  t += `\n💰 EXTRAS ${fmtMes(mesActual).toUpperCase()}: ${soles(extrasS)} (${extras.length} pieza${extras.length===1?"":"s"} fuera del fee)\n`;
  if(cerrados.length) t += `\n✅ ENVIADOS / COMPLETADOS (${cerrados.length}):\n${cerrados.slice(-5).map(p=>`• ${p.tarea}`).join("\n")}\n`;
  return t;
}
function copiarEstatus(){
  const t = textoEstatus();
  const listo = ()=>toast("Estatus copiado — pégalo en correo o WhatsApp ✓");
  const fallback = ()=>{
    openModal(`<h3>Cuadro de estatus</h3>

/* --- Heurística: detectar frases de compromiso en la transcripción --- */
const REGLAS_ACUERDO = /(quedamos|acordamos|se acord|compromiso|va a enviar|van a enviar|te env[ií]o|te paso|te mando|env[ií]ame|me env[ií]as|nos pasas|enviar[áé]|confirmar|va a confirmar|pendiente de|lo ponemos|ponlo como|se elimina|eliminar|se cuenta como|queda para|para la segunda quincena|para (agosto|septiembre|octubre)|cotizaci[oó]n|adicional(es)? de|as[ií] quedamos|listo,? as[ií]|deber[ií]a (estar|salir)|programado para)/i;
function detectarAcuerdos(texto){
  const limpio = texto
    .replace(/https?:\/\/\S+/g,"")
    .replace(/Hola, estoy transcribiendo esta llamada.*?(?=\n|$)/gi,"");
  // separa por turnos de hablante (00:00 Nombre:) o por líneas
  const trozos = limpio.split(/\n(?=\d{1,2}:\d{2})|\n{2,}/).flatMap(t=>t.split(/(?<=[.?!])\s+(?=[A-ZÁÉÍÓÚ¿])/));
  const out = [];
  trozos.forEach(t=>{
    const s = t.replace(/^\d{1,2}:\d{2}\s+[^:]{2,30}:\s*/,"").replace(/\s+/g," ").trim();
    if(s.length>25 && s.length<420 && REGLAS_ACUERDO.test(s)) out.push(s);
  });
  return [...new Set(out)].slice(0,14);
}

  root.innerHTML = `<div class="modal-back" id="modalBack"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;

function bindMain(){
  const main = document.getElementById("main");
  const interno = esInterno();

  main.querySelectorAll("[data-fresp]").forEach(b=>b.onclick=()=>{ filtros.resp=b.dataset.fresp; render(); });
  main.querySelectorAll("[data-festado]").forEach(b=>b.onclick=()=>{ filtros.estado=b.dataset.festado; render(); });
  const busca = main.querySelector("#buscaPend");
  if(busca) busca.oninput = ()=>{
    filtros.q = busca.value;
    render();
    const nb = document.getElementById("buscaPend");
    if(nb){ nb.focus(); nb.setSelectionRange(nb.value.length, nb.value.length); }
  };

  main.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{
    if(!interno) return;
    const p = S.pendientes.find(x=>x.id===b.dataset.toggle);
    if(p.estado==="enviado"||p.estado==="completado"){ p.estado="pendiente"; p.fechaEnvio=""; }
    else { p.estado="enviado"; p.fechaEnvio = new Date().toISOString().slice(0,10); }
    save(); render();
  });
  main.querySelectorAll("[data-edit-p]").forEach(b=>b.onclick=()=>{ if(interno) modalPendiente(S.pendientes.find(x=>x.id===b.dataset.editP)); });
  main.querySelectorAll("[data-edit-i]").forEach(b=>b.onclick=()=>{ if(interno) modalPieza(S.planning.find(x=>x.id===b.dataset.editI)); });

  main.querySelectorAll("[data-act]").forEach(b=>{
    const act = b.dataset.act;
    b.onclick = ()=>{
      if(act==="copiar-estatus") copiarEstatus();
      if(!interno && act!=="mes-prev" && act!=="mes-next" && act!=="copiar-estatus") return;
      if(act==="nuevo-pendiente") modalPendiente(null);
      if(act==="nueva-pieza") modalPieza(null);
      if(act==="nueva-reunion") modalReunion(null);
      if(act==="mes-prev"||act==="mes-next"){
        let [y,m] = mesActual.split("-").map(Number);
        m += act==="mes-next"?1:-1;
        if(m===0){m=12;y--;} if(m===13){m=1;y++;}
        mesActual = `${y}-${String(m).padStart(2,"0")}`;
        render();
      }
      if(act==="edit-cupo"){
        const cur = S.settings.feeCupo[mesActual] ?? 15;
        const v = prompt(`Cupo de piezas del fee para ${fmtMes(mesActual)}:`, cur);
        if(v!==null && !isNaN(Number(v))){ S.settings.feeCupo[mesActual]=Number(v); save(); render(); }
      }
    };
  });

  /* Reuniones */
  main.querySelectorAll("[data-sel-r]").forEach(b=>b.onclick=()=>{ reunionSel=b.dataset.selR; render(); });
  main.querySelectorAll("[data-edit-r]").forEach(b=>b.onclick=()=>modalReunion(S.reuniones.find(x=>x.id===b.dataset.editR)));
  main.querySelectorAll("[data-del-r]").forEach(b=>b.onclick=()=>{
    const r = S.reuniones.find(x=>x.id===b.dataset.delR);
    if(confirm(`¿Eliminar la reunión “${r.titulo}” y sus acuerdos?`)){
      S.reuniones = S.reuniones.filter(x=>x.id!==r.id); reunionSel=null; save(); render(); toast("Reunión eliminada");
    }
  });
  main.querySelectorAll("[data-add-acuerdo]").forEach(b=>b.onclick=()=>modalAcuerdo(b.dataset.addAcuerdo));
  main.querySelectorAll("[data-toggle-a]").forEach(b=>b.onclick=()=>{
    const [rid,aid] = b.dataset.toggleA.split("|");
    const a = S.reuniones.find(x=>x.id===rid).acuerdos.find(x=>x.id===aid);
    a.estado = a.estado==="cumplido" ? "vigente" : "cumplido";
    save(); render();
  });
  main.querySelectorAll("[data-del-a]").forEach(b=>b.onclick=()=>{
    const [rid,aid] = b.dataset.delA.split("|");
    const r = S.reuniones.find(x=>x.id===rid);
    r.acuerdos = r.acuerdos.filter(x=>x.id!==aid);
    save(); render();
  });
  main.querySelectorAll("[data-a2p]").forEach(b=>b.onclick=()=>{
    const [rid,aid] = b.dataset.a2p.split("|");
    const r = S.reuniones.find(x=>x.id===rid);
    const a = r.acuerdos.find(x=>x.id===aid);
    S.pendientes.push({ id:uid(), tarea:a.texto.slice(0,120), detalle:a.texto.length>120?a.texto:"", responsable:(a.responsable==="AMBOS"?"INSIDE":a.responsable),
      solicitadoPor:"", fechaPedido:r.fecha, fechaCompromiso:"", fechaEnvio:"", prioridad:"media", estado:"pendiente", origen:`Acuerdo · ${fmtFecha(r.fecha)}` });
    save(); toast("Creado como pendiente en Gestión ✓");
  });

  /* Detección de acuerdos */
  main.querySelectorAll("[data-scan]").forEach(b=>b.onclick=()=>{
    const rid = b.dataset.scan;
    const r = S.reuniones.find(x=>x.id===rid);
    const texto = document.getElementById("transcriptBox").value;
    r.transcript = texto; save();
    const cands = detectarAcuerdos(texto);
    const box = document.getElementById("candidatos");
    if(!cands.length){ box.innerHTML = `<div class="empty-note">No se detectaron frases de compromiso. Puedes agregar acuerdos manualmente con “＋ Acuerdo”.</div>`; return; }
    box.innerHTML = `
      <div class="tnote" style="margin-bottom:8px"><b>${cands.length}</b> posibles acuerdos detectados — edita el texto, marca los que quieras y guárdalos:</div>
      ${cands.map((c,ix)=>`<div class="candidate">
        <input type="checkbox" id="cand${ix}" checked style="margin-top:10px" />
        <textarea data-cand="${ix}">${esc(c)}</textarea>
        <select data-candresp="${ix}" style="align-self:flex-start"><option>INSIDE</option><option>LEGO</option><option>AMBOS</option></select>
      </div>`).join("")}
      <button class="btn primary" id="saveCands" style="margin-top:6px">Guardar acuerdos seleccionados</button>`;
    document.getElementById("saveCands").onclick = ()=>{
      let n=0;
      cands.forEach((c,ix)=>{
        if(document.getElementById("cand"+ix).checked){
          const txt = box.querySelector(`[data-cand="${ix}"]`).value.trim();
          const resp = box.querySelector(`[data-candresp="${ix}"]`).value;
          if(txt){ r.acuerdos.push({ id:uid(), texto:txt, responsable:resp, estado:"vigente" }); n++; }
        }
      });
      save(); render(); toast(`${n} acuerdo(s) guardado(s) ✓`);
    };
  });
}

});

/* ============ Init ============ */
load(); save(); render();
</script>
